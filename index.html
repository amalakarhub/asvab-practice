foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_048","question":"Read the paragraph: The school installed water bottle filling stations near the gym. Students used them often after physical education classes, and fewer disposable plastic bottles were found in trash cans. What was one effect of installing the stations?","options":["Less plastic bottle waste was produced","Students stopped drinking water","The gym was removed","Trash cans became larger"],"answer":"Less plastic bottle waste was produced","explanation":"The paragraph says fewer disposable plastic bottles were found in trash cans after the stations were installed.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_049","question":"Read the paragraph: The apprentice measured the board twice before cutting it. His supervisor said that careful measuring prevents wasted material and saves time in the long run. What lesson does the paragraph teach?","options":["Careful measuring helps avoid mistakes","Cutting first is the safest method","Boards should never be measured","Wasted material saves time"],"answer":"Careful measuring helps avoid mistakes","explanation":"The paragraph emphasizes measuring carefully so material is not wasted.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_050","question":"Read the paragraph: The local clinic offered free blood pressure screenings at the community center. Many people with high blood pressure do not feel sick, so regular checks can help identify problems early. What is the main purpose of the screenings?","options":["To find possible health problems early","To replace all doctor visits","To sell exercise equipment","To test people's eyesight"],"answer":"To find possible health problems early","explanation":"The paragraph says regular blood pressure checks can identify problems before people notice symptoms.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_051","question":"Read the paragraph: The warehouse supervisor asked workers to stack heavier boxes on the bottom shelves and lighter boxes above them. This arrangement made the shelves more stable and reduced the chance of injury. Why should heavier boxes be placed on the bottom shelves?","options":["To make the shelves more stable","To make the boxes harder to reach","To increase the number of shelves","To make lighter boxes heavier"],"answer":"To make the shelves more stable","explanation":"Heavy boxes on the bottom create a safer, more stable stack and reduce the risk of falling boxes.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_052","question":"Read the paragraph: The technician cleaned the air conditioner filter before turning on the unit for the summer. A dirty filter can block airflow and make the system work harder than necessary. What is one reason to clean the filter?","options":["To improve airflow","To make the unit heavier","To stop electricity from reaching the unit","To increase dust inside the room"],"answer":"To improve airflow","explanation":"The paragraph says a dirty filter blocks airflow, so cleaning it helps air move through the system properly.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_053","question":"Read the paragraph: The mayor encouraged residents to report broken streetlights. Well-lit streets can help drivers see pedestrians and make neighborhoods feel safer at night. What is the main purpose of reporting broken streetlights?","options":["To improve nighttime safety","To reduce the number of roads","To make streets darker","To stop people from walking"],"answer":"To improve nighttime safety","explanation":"The paragraph connects working streetlights with better visibility and safer neighborhoods.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_054","question":"Read the paragraph: Before signing the lease, Nina read every section carefully. She wanted to understand the rules about rent, repairs, and moving out. What can be inferred about Nina?","options":["She wants to avoid surprises later","She does not plan to pay rent","She owns the apartment building","She dislikes reading all documents"],"answer":"She wants to avoid surprises later","explanation":"Nina reads the lease carefully so she understands her responsibilities before agreeing to them.","skillTag":"inference","topic":"inference","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_055","question":"Read the paragraph: The gardener watered the plants early in the morning. At that time, less water evaporates, and the plants have moisture before the hottest part of the day. Why did the gardener water early?","options":["To help plants keep more moisture","To make the soil dry faster","To avoid using any water","To stop plants from growing"],"answer":"To help plants keep more moisture","explanation":"Watering early reduces evaporation and gives plants water before the day becomes hot.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_056","question":"Read the paragraph: The new bus schedule added more buses during rush hour. City officials hoped this would reduce crowding and shorten wait times for passengers. What problem was the new schedule meant to address?","options":["Crowded buses and long waits","Too many empty buses at night","A lack of bus drivers' uniforms","Passengers refusing to ride buses"],"answer":"Crowded buses and long waits","explanation":"The paragraph states that more buses were added to reduce crowding and passenger wait times.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_057","question":"Read the paragraph: The mechanic noticed uneven wear on the tires. He recommended an alignment because poor alignment can cause tires to wear out faster. What did the mechanic believe was causing the tire problem?","options":["Poor alignment","Too much fuel","A broken windshield","Low engine oil"],"answer":"Poor alignment","explanation":"The mechanic recommended an alignment because uneven tire wear is often caused by poor alignment.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_058","question":"Read the paragraph: The teacher asked students to outline their essays before writing. An outline helps organize ideas and makes it easier to write a clear paper. What is the purpose of an outline?","options":["To organize ideas before writing","To replace the essay completely","To make handwriting larger","To avoid choosing a topic"],"answer":"To organize ideas before writing","explanation":"The paragraph explains that an outline helps students arrange their ideas before writing the essay.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_059","question":"Read the paragraph: The construction crew covered the fresh concrete with plastic. The covering helped protect the surface from rain and kept it from drying too quickly. Why was the concrete covered?","options":["To protect it while it cured","To make it softer forever","To hide it from workers","To stop it from hardening"],"answer":"To protect it while it cured","explanation":"The plastic protected the fresh concrete from rain and helped it dry at the proper rate.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_060","question":"Read the paragraph: The grocery store placed popular items near the front during the storm warning. Customers were looking for water, batteries, and canned food. What was the store trying to do?","options":["Make emergency supplies easier to find","Hide emergency supplies from customers","Stop customers from buying water","Close the store immediately"],"answer":"Make emergency supplies easier to find","explanation":"The store moved items customers needed during the storm warning to a convenient location.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_061","question":"Read the paragraph: The restaurant trained employees to wash their hands after handling raw meat. This step helps prevent bacteria from spreading to other foods. What is the main reason for this rule?","options":["To prevent food contamination","To make raw meat cook faster","To reduce the number of employees","To keep customers from ordering meat"],"answer":"To prevent food contamination","explanation":"Washing hands after touching raw meat helps keep bacteria from spreading to other foods.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_062","question":"Read the paragraph: The driver slowed down when fog covered the road. Reduced visibility made it harder to see other cars, signs, and curves ahead. Why did the driver slow down?","options":["Because fog made it harder to see","Because the road was completely closed","Because the car was out of fuel","Because signs became brighter"],"answer":"Because fog made it harder to see","explanation":"The paragraph says fog reduced visibility, so slowing down made driving safer.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_063","question":"Read the paragraph: The gym replaced worn mats in the exercise room. The old mats had thin spots that no longer cushioned falls well. What was the likely reason for replacing the mats?","options":["To improve safety","To make the room smaller","To remove all exercise equipment","To increase the chance of falls"],"answer":"To improve safety","explanation":"The worn mats no longer cushioned falls properly, so replacing them helped make the exercise room safer.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_064","question":"Read the paragraph: The office asked employees to turn off computers at the end of the day. This policy reduced electricity use and helped lower monthly utility costs. What was one result of the policy?","options":["Lower utility costs","Longer workdays","More paper waste","Fewer employees"],"answer":"Lower utility costs","explanation":"Turning off computers reduced electricity use, which helped lower utility costs.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_065","question":"Read the paragraph: The volunteer group picked up litter along the riverbank. Trash near water can harm wildlife and eventually wash into the river. What was the volunteer group helping to protect?","options":["The river environment","The city's traffic lights","A shopping center","A parking garage"],"answer":"The river environment","explanation":"Removing litter from the riverbank helps protect wildlife and keeps trash out of the water.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_066","question":"Read the paragraph: The homeowner installed smoke detectors in each hallway and bedroom. Smoke detectors can warn people early enough to escape a fire. What is the main purpose of smoke detectors?","options":["To warn people about fire","To prevent all smoke from forming","To heat the hallway","To unlock bedroom doors"],"answer":"To warn people about fire","explanation":"Smoke detectors alert people when smoke is present, giving them time to escape.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_067","question":"Read the paragraph: The airport recommends arriving early for morning flights. Security lines are often longest before 8 a.m., when many business travelers are departing. Why should passengers arrive early?","options":["Security lines may be long","Morning flights never leave on time","Business travelers are not allowed to fly","The airport closes before 8 a.m."],"answer":"Security lines may be long","explanation":"The paragraph says security lines are often longest before 8 a.m., so arriving early helps passengers avoid delays.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_068","question":"Read the paragraph: The animal shelter asks visitors to speak softly around the dogs. Loud noises can make some animals nervous and harder to handle. Why does the shelter ask visitors to speak softly?","options":["To keep the animals calm","To make the dogs run faster","To stop visitors from entering","To train animals to ignore food"],"answer":"To keep the animals calm","explanation":"The paragraph explains that loud noises can make animals nervous, so soft voices help keep them calm.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_069","question":"Read the paragraph: The supervisor praised Leo for labeling each storage bin clearly. Because of the labels, new workers could find parts without asking for help. What was one benefit of the labels?","options":["New workers could find parts more easily","Bins became harder to use","Workers stopped using parts","The storage area became smaller"],"answer":"New workers could find parts more easily","explanation":"The labels helped new workers locate parts without needing assistance.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_070","question":"Read the paragraph: The town postponed the outdoor concert because strong winds were expected. Temporary stages and speakers can become dangerous when wind speeds are high. Why was the concert postponed?","options":["Strong winds created a safety concern","The musicians forgot their songs","The town had too many speakers","The weather was too calm"],"answer":"Strong winds created a safety concern","explanation":"The paragraph says high winds can make temporary equipment dangerous, so postponing the concert was a safety decision.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_071","question":"Read the paragraph: The cook let the soup simmer instead of boil rapidly. A gentle simmer allows flavors to blend without causing the liquid to evaporate too quickly. What is one advantage of simmering the soup?","options":["It helps flavors blend","It freezes the soup","It removes all liquid instantly","It prevents the soup from heating"],"answer":"It helps flavors blend","explanation":"The paragraph states that simmering allows flavors to blend without too much evaporation.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_072","question":"Read the paragraph: The repair shop gives customers written estimates before starting work. This helps customers understand expected costs and approve repairs before being charged. What is the purpose of written estimates?","options":["To explain expected costs before repairs","To make repairs unnecessary","To keep customers from asking questions","To hide the cost of labor"],"answer":"To explain expected costs before repairs","explanation":"Written estimates show customers what repairs may cost before the work begins.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_073","question":"Read the paragraph: The factory tested each fire alarm once a month. Regular testing helped ensure the alarms would work during an emergency. Why were the alarms tested regularly?","options":["To make sure they would work when needed","To make the factory louder every day","To stop workers from entering the building","To replace emergency exits"],"answer":"To make sure they would work when needed","explanation":"The paragraph says testing helps confirm the alarms will operate properly in an emergency.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_074","question":"Read the paragraph: The student reviewed her notes each night instead of waiting until the day before the exam. Short, regular study sessions helped her remember the material better. What study method does the paragraph support?","options":["Studying a little each day","Studying only after the exam","Avoiding notes completely","Waiting until the last minute"],"answer":"Studying a little each day","explanation":"The paragraph says regular nightly review helped the student remember the material.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_075","question":"Read the paragraph: The mechanic used a torque wrench to tighten the bolts to the manufacturer's recommended setting. Over-tightening or under-tightening bolts can cause parts to fail. Why did the mechanic use a torque wrench?","options":["To tighten bolts to the correct level","To loosen every bolt completely","To paint the bolts","To measure tire pressure"],"answer":"To tighten bolts to the correct level","explanation":"A torque wrench helps apply the correct amount of tightness, preventing damage or failure.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_076","question":"Read the paragraph: The community center added ramps near the entrances. The ramps made the building easier to enter for people using wheelchairs, walkers, or strollers. What was the purpose of adding ramps?","options":["To improve accessibility","To make the doors smaller","To block the entrances","To remove the sidewalks"],"answer":"To improve accessibility","explanation":"The ramps help more people enter the building safely and easily.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_077","question":"Read the paragraph: The farmer checked the weather forecast before cutting hay. Hay must dry in the field before it is stored, and rain can spoil it. Why did the farmer check the forecast?","options":["To avoid cutting hay before rain","To find the price of tractors","To decide which animals to feed","To make the hay wetter"],"answer":"To avoid cutting hay before rain","explanation":"The farmer needed dry weather because rain could spoil the hay before storage.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_078","question":"Read the paragraph: The security guard checked identification badges at the entrance. Only employees and approved visitors were allowed beyond the front desk. What was the guard's main job?","options":["Controlling access to the building","Cleaning the front desk","Selling badges to employees","Repairing office computers"],"answer":"Controlling access to the building","explanation":"The guard checked badges to make sure only approved people entered the building.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_079","question":"Read the paragraph: The plumber wrapped exposed pipes before the coldest part of winter. Insulation helps keep pipes from freezing and bursting during low temperatures. Why did the plumber wrap the pipes?","options":["To protect them from freezing","To make them easier to see","To stop water from entering them","To make them burst sooner"],"answer":"To protect them from freezing","explanation":"Pipe insulation helps prevent freezing, which can cause pipes to burst.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_080","question":"Read the paragraph: The team held a short meeting after finishing the project. They discussed what went well and what could be improved next time. What was the purpose of the meeting?","options":["To learn from the completed project","To cancel the project","To avoid future teamwork","To blame one person for everything"],"answer":"To learn from the completed project","explanation":"The team reviewed successes and possible improvements so they could do better on future projects.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"afqt_pc_real_001","question":"Read the paragraph: During a routine inspection, a supervisor found that several storage labels were faded and difficult to read. Although no inventory was missing, the supervisor ordered the labels replaced immediately. She explained that unreadable labels could lead to future errors during emergency restocking. What is the main reason the supervisor replaced the labels?","options":["To prevent future mistakes","To reduce the number of stored items","To avoid hiring more workers","To make the storage room larger"],"answer":"To prevent future mistakes","explanation":"The paragraph says unreadable labels could cause future errors, so replacing them was preventive.","difficulty":"medium","skillTag":"main_idea","afqtRelevant":true,"realismTier":"asvab_style","topic":"main_idea"},{"id":"afqt_pc_real_002","question":"Read the paragraph: The generator started on the second pull, but the lights flickered each time a large tool was turned on. The technician decided not to use the generator until it could be tested under load. What can be inferred about the technician?","options":["He was concerned the generator might not provide steady power","He did not know how to start the generator","He believed the tools were broken","He wanted to avoid using electricity altogether"],"answer":"He was concerned the generator might not provide steady power","explanation":"The flickering lights under load suggest unstable power, so the technician acted cautiously.","difficulty":"medium","skillTag":"inference","afqtRelevant":true,"realismTier":"asvab_style","topic":"inference"},{"id":"afqt_pc_real_003","question":"Read the paragraph: The city installed new bus shelters near several factories. The shelters included lights, benches, and posted schedules. Workers who depended on public transportation said the changes made the evening commute safer and more predictable. Which statement is best supported by the paragraph?","options":["The shelters helped workers who used buses","Factory workers stopped using public transportation","The city removed evening bus service","The shelters were built inside the factories"],"answer":"The shelters helped workers who used buses","explanation":"Workers reported safer and more predictable commutes after the shelters were installed.","difficulty":"medium","skillTag":"supported_statement","afqtRelevant":true,"realismTier":"asvab_style","topic":"supported_statement"},{"id":"afqt_pc_real_004","question":"Read the paragraph: A small leak near the water heater was ignored because it only produced a few drops at a time. After several weeks, moisture damaged the nearby wall and created a mold problem. What is the author's main point?","options":["Minor problems can become serious if ignored","Water heaters should be replaced every week","Mold only grows outdoors","A few drops of water are never important"],"answer":"Minor problems can become serious if ignored","explanation":"The leak seemed small but later caused wall damage and mold, showing small issues can grow.","difficulty":"medium","skillTag":"author_point","afqtRelevant":true,"realismTier":"asvab_style","topic":"author_point"},{"id":"afqt_pc_real_005","question":"Read the paragraph: Before using the cutting machine, Rosa checked the guard, tested the emergency stop, and confirmed that the workpiece was clamped securely. Only then did she begin the cut. Which word best describes Rosa's approach?","options":["Cautious","Careless","Impatient","Confused"],"answer":"Cautious","explanation":"Rosa checked safety features and secured the workpiece before operating the machine, showing caution.","difficulty":"medium","skillTag":"character_trait","afqtRelevant":true,"realismTier":"asvab_style","topic":"character_trait"},{"id":"afqt_pc_real_006","question":"Read the paragraph: The manual states that the filter should be replaced every 90 days under normal use. In dusty environments, however, the filter may need replacement more often. A clogged filter can reduce airflow and cause the motor to overheat. According to the paragraph, when should the filter be replaced more often than every 90 days?","options":["When the equipment is used in dusty environments","When the motor is new","When airflow increases","When the manual is missing"],"answer":"When the equipment is used in dusty environments","explanation":"The paragraph directly states that dusty environments may require more frequent filter replacement.","difficulty":"medium","skillTag":"detail","afqtRelevant":true,"realismTier":"asvab_style","topic":"detail"},{"id":"afqt_pc_real_007","question":"Read the paragraph: The warehouse manager did not object to the new scanner system. Instead, he argued that workers needed training before the system went live. He said a good tool could still cause confusion if people did not understand how to use it. What was the manager's concern?","options":["The system might fail if workers were not trained","The scanner system was too expensive to buy","The warehouse had too many workers","The old system had never worked"],"answer":"The system might fail if workers were not trained","explanation":"The manager supported the tool but worried that lack of training would cause confusion.","difficulty":"medium","skillTag":"inference","afqtRelevant":true,"realismTier":"asvab_style","topic":"inference"},{"id":"afqt_pc_real_008","question":"Read the paragraph: When fuel prices rose, the delivery company changed its routes so drivers made fewer left turns and avoided heavy traffic whenever possible. The changes reduced idling time and helped the company use less fuel. What does the word 'idling' most likely mean in this paragraph?","options":["Running while not moving","Driving at high speed","Loading heavy cargo","Repairing an engine"],"answer":"Running while not moving","explanation":"The company avoided traffic to reduce time engines ran without moving, which is idling.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_pc_real_009","question":"Read the paragraph: The first storm damaged several power lines. Crews repaired the main line by noon, but some homes remained without power because smaller neighborhood lines were still down. What happened after the main line was repaired?","options":["Some homes still lacked power","The first storm began","All power lines were replaced","The crews stopped working permanently"],"answer":"Some homes still lacked power","explanation":"The paragraph states that even after the main line was repaired, some homes remained without power.","difficulty":"medium","skillTag":"sequence","afqtRelevant":true,"realismTier":"asvab_style","topic":"sequence"},{"id":"afqt_pc_real_010","question":"Read the paragraph: A company switched from paper forms to digital reports. At first, some workers entered data slowly because the system was unfamiliar. After two weeks of practice, reports were submitted faster than before. What conclusion is best supported by the paragraph?","options":["The digital system became more efficient after workers adjusted","Paper reports are always faster than digital reports","The workers refused to learn the new system","The company stopped collecting reports"],"answer":"The digital system became more efficient after workers adjusted","explanation":"The workers were initially slow, but after practice, reports became faster than before.","difficulty":"medium","skillTag":"conclusion","afqtRelevant":true,"realismTier":"asvab_style","topic":"conclusion"},{"id":"afqt_pc_real_011","question":"Read the paragraph: The safety notice did not ban ladder use. It required workers to inspect ladders before climbing and to remove damaged ladders from service. What is the best summary of the notice?","options":["Ladders may be used if they are checked and safe","Workers are no longer allowed to use ladders","Only damaged ladders may be used","Ladder inspections are optional"],"answer":"Ladders may be used if they are checked and safe","explanation":"The notice allows ladder use but requires inspection and removal of unsafe ladders.","difficulty":"medium","skillTag":"summary","afqtRelevant":true,"realismTier":"asvab_style","topic":"summary"},{"id":"afqt_pc_real_012","question":"Read the paragraph: The clinic moved its appointment reminders from phone calls to text messages. Missed appointments decreased because patients were more likely to see short messages during the workday. What was one result of using text reminders?","options":["Fewer patients missed appointments","Appointments became longer","The clinic stopped seeing patients","Patients no longer worked during the day"],"answer":"Fewer patients missed appointments","explanation":"The paragraph states that missed appointments decreased after the clinic switched to text reminders.","difficulty":"medium","skillTag":"cause_effect","afqtRelevant":true,"realismTier":"asvab_style","topic":"cause_effect"},{"id":"afqt_pc_real_013","question":"Read the paragraph: The technician suspected the battery was not the only problem. The vehicle started after a jump, but the dashboard warning light stayed on and the engine stalled minutes later. Which detail most supports the technician's suspicion?","options":["The warning light stayed on and the engine stalled","The vehicle started after a jump","The battery was located under the hood","The dashboard was easy to see"],"answer":"The warning light stayed on and the engine stalled","explanation":"These problems continued after the jump, suggesting something besides the battery was wrong.","difficulty":"hard","skillTag":"evidence_selection","afqtRelevant":true,"realismTier":"asvab_style","topic":"evidence_selection"},{"id":"afqt_pc_real_014","question":"Read the paragraph: Some people believe faster work always means better productivity. However, rushing a task can lead to errors that require time-consuming corrections. In many jobs, careful work done at a steady pace saves time in the long run. Which statement best expresses the author's view?","options":["Accuracy can be more valuable than speed","Rushing always improves work quality","Corrections never take much time","Slow workers are always more productive"],"answer":"Accuracy can be more valuable than speed","explanation":"The author argues that rushing causes errors and that careful steady work may save time.","difficulty":"hard","skillTag":"author_viewpoint","afqtRelevant":true,"realismTier":"asvab_style","topic":"author_viewpoint"},{"id":"afqt_pc_real_015","question":"Read the paragraph: The road crew placed cones around the broken pavement before beginning repairs. Drivers were directed into one lane, causing delays during the morning commute. The inconvenience was expected to last only until the damaged section was filled and marked. Why were traffic delays expected?","options":["Traffic was reduced to one lane during repairs","The road crew forgot the cones","Drivers were told to avoid all roads","The damaged section had already been repaired"],"answer":"Traffic was reduced to one lane during repairs","explanation":"The paragraph says drivers were directed into one lane, which caused delays.","difficulty":"medium","skillTag":"cause_effect","afqtRelevant":true,"realismTier":"asvab_style","topic":"cause_effect"},{"id":"afqt_pc_real_016","question":"Read the paragraph: The new boots were lighter than the old model and dried more quickly after rain. Some hikers still preferred the old boots because they provided more ankle support on rocky trails. Which statement is NOT supported by the paragraph?","options":["The new boots provide more ankle support than the old boots","The new boots are lighter than the old model","The new boots dry more quickly after rain","Some hikers prefer the old boots on rocky trails"],"answer":"The new boots provide more ankle support than the old boots","explanation":"The paragraph says the old boots provided more ankle support, not the new boots.","difficulty":"hard","skillTag":"not_supported","afqtRelevant":true,"realismTier":"asvab_style","topic":"not_supported"},{"id":"afqt_pc_real_017","question":"Read the paragraph: A power outage shut down the refrigeration system for two hours. The manager checked the temperature logs before deciding whether to discard the food. She knew that appearance alone could not prove the food had stayed safe. What can be inferred about the manager?","options":["She relied on records rather than appearance alone","She planned to discard all food without checking","She believed warm food always looks spoiled","She ignored the outage"],"answer":"She relied on records rather than appearance alone","explanation":"The manager checked temperature logs because appearance alone was not enough to judge safety.","difficulty":"hard","skillTag":"inference","afqtRelevant":true,"realismTier":"asvab_style","topic":"inference"},{"id":"afqt_pc_real_018","question":"Read the paragraph: The training exercise was repeated three times. During the first attempt, the team missed several steps. By the third attempt, each member knew where to stand and which task to complete. What does the paragraph suggest about repetition?","options":["It helped the team perform better","It made the team forget the procedure","It was unnecessary after the first attempt","It caused the exercise to be cancelled"],"answer":"It helped the team perform better","explanation":"The team improved from missing steps to knowing positions and tasks after repeated practice.","difficulty":"medium","skillTag":"inference","afqtRelevant":true,"realismTier":"asvab_style","topic":"inference"},{"id":"afqt_pc_real_019","question":"Read the paragraph: The old instruction sheet listed each step but did not include pictures. New employees often assembled parts in the wrong order. After diagrams were added, mistakes decreased. What was the likely effect of adding diagrams?","options":["They made the instructions easier to follow","They made the parts heavier","They removed the need for training","They caused more assembly errors"],"answer":"They made the instructions easier to follow","explanation":"Mistakes decreased after diagrams were added, suggesting the diagrams improved clarity.","difficulty":"medium","skillTag":"cause_effect","afqtRelevant":true,"realismTier":"asvab_style","topic":"cause_effect"},{"id":"afqt_pc_real_020","question":"Read the paragraph: A warning label may seem unnecessary to experienced workers, but it can help new workers recognize a hazard before an accident occurs. Labels are most useful when they are short, visible, and placed near the danger. What is the main idea?","options":["Effective warning labels can help prevent accidents","Experienced workers never need safety reminders","Labels should be long and detailed","New workers should avoid all equipment"],"answer":"Effective warning labels can help prevent accidents","explanation":"The paragraph explains how visible warning labels help workers recognize hazards and avoid accidents.","difficulty":"medium","skillTag":"main_idea","afqtRelevant":true,"realismTier":"asvab_style","topic":"main_idea"},{"id":"afqt_pc_real_021","question":"Read the paragraph: The technician replaced the fuse, but it blew again as soon as the machine started. Rather than installing a larger fuse, he shut down the machine and looked for a short circuit. Why did the technician avoid using a larger fuse?","options":["A larger fuse would not fix the underlying electrical problem","The machine did not require electricity","The fuse was unrelated to the machine","The technician had no replacement fuses"],"answer":"A larger fuse would not fix the underlying electrical problem","explanation":"A fuse blowing repeatedly suggests a fault, so replacing it with a larger fuse would ignore the cause.","difficulty":"hard","skillTag":"inference_technical","afqtRelevant":true,"realismTier":"asvab_style","topic":"inference_technical"},{"id":"afqt_pc_real_022","question":"Read the paragraph: The report was brief but complete. It identified the problem, listed the repair steps, and included the final test result. The supervisor said the report was useful because it gave enough information without unnecessary details. What does 'brief but complete' mean in this paragraph?","options":["Short while still including the needed facts","Missing important information","Long and difficult to read","Written without a final result"],"answer":"Short while still including the needed facts","explanation":"The report included all needed information but avoided unnecessary details.","difficulty":"medium","skillTag":"phrase_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"phrase_meaning"},{"id":"afqt_pc_real_023","question":"Read the paragraph: The hiking group left early because afternoon storms were common in the mountains. When clouds began forming near noon, they were already below the ridge and close to the trailhead. What can be inferred about the group's decision to leave early?","options":["It helped them avoid being exposed during bad weather","It caused them to get lost","It made the hike longer than planned","It was unrelated to the weather"],"answer":"It helped them avoid being exposed during bad weather","explanation":"Leaving early placed them below the ridge and near the trailhead before storm clouds formed.","difficulty":"medium","skillTag":"inference","afqtRelevant":true,"realismTier":"asvab_style","topic":"inference"},{"id":"afqt_pc_real_024","question":"Read the paragraph: The computer lab allowed students to save work on local machines, but files were erased each Friday. Students who wanted to keep their work were told to use the network drive. What should students do to keep their files after Friday?","options":["Save files on the network drive","Save files only on local machines","Erase their work before Friday","Avoid using the computer lab"],"answer":"Save files on the network drive","explanation":"The paragraph states that local files are erased each Friday, so students should use the network drive to keep work.","difficulty":"medium","skillTag":"detail","afqtRelevant":true,"realismTier":"asvab_style","topic":"detail"},{"id":"afqt_pc_real_025","question":"Read the paragraph: The farmer planted rows of trees along the edge of the field. The trees slowed the wind, which helped keep loose soil from blowing away. Over time, the field lost less topsoil during dry months. What was the purpose of planting the trees?","options":["To reduce soil loss from wind","To make the field smaller","To increase wind speed","To block sunlight from all crops"],"answer":"To reduce soil loss from wind","explanation":"The trees slowed the wind and helped prevent loose soil from blowing away.","difficulty":"medium","skillTag":"purpose","afqtRelevant":true,"realismTier":"asvab_style","topic":"purpose"},{"id":"afqt_pc_real_026","question":"Read the paragraph: The first estimate included only the cost of materials. It did not include labor, permits, or disposal fees. When those items were added, the final estimate was much higher. Why did the estimate increase?","options":["The first estimate left out several costs","The materials became free","The project became smaller","The workers refused to charge for labor"],"answer":"The first estimate left out several costs","explanation":"The final estimate was higher because labor, permits, and disposal fees were added.","difficulty":"medium","skillTag":"cause_effect","afqtRelevant":true,"realismTier":"asvab_style","topic":"cause_effect"},{"id":"afqt_pc_real_027","question":"Read the paragraph: A medication label says the bottle should be stored in a cool, dry place. Leaving it in a hot car can reduce its effectiveness before the expiration date. What does the paragraph imply?","options":["Storage conditions can affect how well the medication works","Expiration dates are never important","Medication works better when heated","A hot car keeps medicine dry and safe"],"answer":"Storage conditions can affect how well the medication works","explanation":"The paragraph says heat can reduce effectiveness before expiration, so storage matters.","difficulty":"hard","skillTag":"inference","afqtRelevant":true,"realismTier":"asvab_style","topic":"inference"},{"id":"afqt_pc_real_028","question":"Read the paragraph: The instructor told students to read all directions before opening the parts bag. Several students ignored the instruction and mixed similar screws together. They later had trouble identifying which screws fit each step. What caused the students' problem?","options":["They mixed similar parts before reading the directions","The parts bag was empty","The instructor gave no directions","The screws were already installed"],"answer":"They mixed similar parts before reading the directions","explanation":"The students ignored the instruction and mixed similar screws, which made later identification difficult.","difficulty":"medium","skillTag":"cause_effect","afqtRelevant":true,"realismTier":"asvab_style","topic":"cause_effect"},{"id":"afqt_pc_real_029","question":"Read the paragraph: The river appeared calm from the shore, but warning signs noted a strong current below the surface. Rescue officials said swimmers often underestimated the danger because the water did not look rough. Which statement best matches the paragraph?","options":["A calm surface can hide dangerous conditions","Rough-looking water is always safe","Warning signs are only for boaters","The river had no current"],"answer":"A calm surface can hide dangerous conditions","explanation":"The paragraph explains that the current was strong below the calm surface.","difficulty":"hard","skillTag":"main_idea","afqtRelevant":true,"realismTier":"asvab_style","topic":"main_idea"},{"id":"afqt_pc_real_030","question":"Read the paragraph: The restaurant changed its prep schedule so vegetables were chopped closer to serving time. Customers noticed that salads tasted fresher, and less produce was thrown away at the end of the day. What were two results of the schedule change?","options":["Fresher salads and less waste","Higher prices and fewer customers","Longer storage time and more spoilage","Less preparation and no vegetables"],"answer":"Fresher salads and less waste","explanation":"The paragraph directly states that salads tasted fresher and less produce was discarded.","difficulty":"medium","skillTag":"detail_multiple","afqtRelevant":true,"realismTier":"asvab_style","topic":"detail_multiple"},{"id":"afqt_pc_real_031","question":"Read the paragraph: The new policy did not punish workers for reporting mistakes. Instead, it encouraged quick reporting so problems could be corrected before they affected customers. The company believed hiding errors was more harmful than admitting them early. What is the best title for the paragraph?","options":["Early Reporting Helps Fix Problems","Workers Are Punished for All Mistakes","Customers Should Ignore Errors","Policies Eliminate Every Mistake"],"answer":"Early Reporting Helps Fix Problems","explanation":"The paragraph focuses on encouraging early mistake reporting so problems can be corrected.","difficulty":"medium","skillTag":"title","afqtRelevant":true,"realismTier":"asvab_style","topic":"title"},{"id":"afqt_pc_real_032","question":"Read the paragraph: The metal expanded slightly when heated, making the part fit too tightly in the machine. After it cooled, the part returned to its original size and moved normally. What does the paragraph show about the metal?","options":["Its size changed with temperature","It melted completely","It was too weak to use","It became magnetic when cooled"],"answer":"Its size changed with temperature","explanation":"The metal expanded with heat and returned to original size after cooling.","difficulty":"medium","skillTag":"science_reading","afqtRelevant":true,"realismTier":"asvab_style","topic":"science_reading"},{"id":"afqt_pc_real_033","question":"Read the paragraph: The company tested two package designs. The cheaper design saved money but was damaged more often during shipping. The stronger design cost more at first but reduced refunds and replacements. What trade-off is described?","options":["Lower upfront cost versus fewer shipping problems","Faster shipping versus slower delivery","Larger packages versus smaller products","More refunds versus more replacements"],"answer":"Lower upfront cost versus fewer shipping problems","explanation":"The cheaper design saved money initially but caused more damage, while the stronger design cost more but reduced losses.","difficulty":"hard","skillTag":"compare_contrast","afqtRelevant":true,"realismTier":"asvab_style","topic":"compare_contrast"},{"id":"afqt_pc_real_034","question":"Read the paragraph: The technician documented each step of the repair, including the failed test at the beginning and the passing test at the end. This record helped another technician understand what had been changed. Why was the documentation useful?","options":["It showed the problem, the repair, and the final result","It replaced the need to test the machine","It proved no repair had been done","It made the machine run without power"],"answer":"It showed the problem, the repair, and the final result","explanation":"The documentation included the initial failed test, repair steps, and final passing test.","difficulty":"medium","skillTag":"purpose","afqtRelevant":true,"realismTier":"asvab_style","topic":"purpose"},{"id":"afqt_pc_real_035","question":"Read the paragraph: The school added a second lunch period because the cafeteria was overcrowded. After the change, students had shorter lines and more time to eat. What problem was the school trying to solve?","options":["Overcrowding during lunch","A shortage of teachers","Too much food waste","Early dismissal"],"answer":"Overcrowding during lunch","explanation":"The paragraph says the cafeteria was overcrowded, and the second lunch period reduced lines.","difficulty":"medium","skillTag":"problem_solution","afqtRelevant":true,"realismTier":"asvab_style","topic":"problem_solution"},{"id":"afqt_pc_real_036","question":"Read the paragraph: The training manual recommends checking tire pressure when tires are cold. Driving warms the tires and can temporarily increase the pressure reading. What could happen if pressure is checked immediately after a long drive?","options":["The reading may be higher than the cold-tire pressure","The tire pressure will always be zero","The tire will lose its tread immediately","The pressure gauge will measure speed instead"],"answer":"The reading may be higher than the cold-tire pressure","explanation":"The paragraph says warmed tires can temporarily increase the pressure reading.","difficulty":"hard","skillTag":"inference_technical","afqtRelevant":true,"realismTier":"asvab_style","topic":"inference_technical"},{"id":"afqt_pc_real_037","question":"Read the paragraph: The museum placed fragile artifacts behind glass. Visitors could still view the items, but they could not touch them. This arrangement protected the artifacts while allowing public access. Which statement best summarizes the arrangement?","options":["The glass protected artifacts without hiding them from visitors","The artifacts were removed from public display","Visitors were allowed to handle fragile items","The museum stopped protecting artifacts"],"answer":"The glass protected artifacts without hiding them from visitors","explanation":"The artifacts remained visible but were protected from touching.","difficulty":"medium","skillTag":"summary","afqtRelevant":true,"realismTier":"asvab_style","topic":"summary"},{"id":"afqt_pc_real_038","question":"Read the paragraph: The driver noticed that the steering wheel pulled slightly to the right. At first, he blamed the road surface. When the same problem occurred on several different roads, he scheduled an alignment check. What changed the driver's mind?","options":["The problem happened on multiple roads","The road surface became smoother","The steering wheel stopped pulling","The vehicle ran out of fuel"],"answer":"The problem happened on multiple roads","explanation":"Because the issue appeared on several roads, the driver concluded it was likely the vehicle, not the road.","difficulty":"hard","skillTag":"evidence_selection","afqtRelevant":true,"realismTier":"asvab_style","topic":"evidence_selection"},{"id":"afqt_pc_real_039","question":"Read the paragraph: The notice stated that employees could use the side entrance during construction, but deliveries had to continue through the loading dock. The front entrance would reopen after the walkway was repaired. Which group was directed to use the loading dock?","options":["Delivery personnel","All employees","Construction inspectors only","Customers using the front entrance"],"answer":"Delivery personnel","explanation":"The notice says deliveries had to continue through the loading dock.","difficulty":"medium","skillTag":"detail","afqtRelevant":true,"realismTier":"asvab_style","topic":"detail"},{"id":"afqt_pc_real_040","question":"Read the paragraph: The team leader did not choose the fastest worker to train new employees. She chose the worker who explained procedures clearly and rarely skipped steps. What quality did the leader value most for the training role?","options":["Ability to explain procedures carefully","Ability to finish fastest","Willingness to skip steps","Preference for working alone"],"answer":"Ability to explain procedures carefully","explanation":"The leader chose someone who explained clearly and did not skip steps, showing training quality mattered more than speed.","difficulty":"medium","skillTag":"inference","afqtRelevant":true,"realismTier":"asvab_style","topic":"inference"}],"Mathematics Knowledge (MK)":[{"id":"asvab_mk_001","question":"What is 7 + 18?","options":["23","24","25","26"],"answer":"25","explanation":"Add 7 and 18 to get 25.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_002","question":"What is 45 - 19?","options":["24","25","26","27"],"answer":"26","explanation":"Subtract 19 from 45. The result is 26.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_003","question":"What is 8 x 12?","options":["84","92","96","108"],"answer":"96","explanation":"Multiply 8 by 12. The product is 96.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_004","question":"What is 144 divided by 12?","options":["10","11","12","14"],"answer":"12","explanation":"144 divided by 12 equals 12.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_005","question":"What is the value of 6 squared?","options":["12","18","36","64"],"answer":"36","explanation":"Six squared means 6 x 6, which equals 36.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_006","question":"What is the square root of 81?","options":["7","8","9","10"],"answer":"9","explanation":"The square root of 81 is 9 because 9 x 9 equals 81.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_007","question":"What is 3 cubed?","options":["6","9","18","27"],"answer":"27","explanation":"Three cubed means 3 x 3 x 3, which equals 27.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_008","question":"What is 2 to the 5th power?","options":["10","16","25","32"],"answer":"32","explanation":"2 to the 5th power means 2 x 2 x 2 x 2 x 2, which equals 32.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_009","question":"Which number is a prime number?","options":["9","15","17","21"],"answer":"17","explanation":"A prime number has exactly two factors, 1 and itself. The number 17 is prime.","skillTag":"factors_multiples_primes","topic":"factors_multiples_primes","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_010","question":"Which number is divisible by 3?","options":["41","52","63","74"],"answer":"63","explanation":"A number is divisible by 3 if the sum of its digits is divisible by 3. For 63, 6 + 3 = 9, which is divisible by 3.","skillTag":"factors_multiples_primes","topic":"factors_multiples_primes","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_011","question":"What is the greatest common factor of 12 and 18?","options":["3","4","6","9"],"answer":"6","explanation":"The factors common to 12 and 18 include 1, 2, 3, and 6. The greatest one is 6.","skillTag":"factors_multiples_primes","topic":"factors_multiples_primes","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_012","question":"What is the least common multiple of 4 and 6?","options":["8","10","12","24"],"answer":"12","explanation":"Multiples of 4 include 4, 8, and 12. Multiples of 6 include 6 and 12. The least common multiple is 12.","skillTag":"factors_multiples_primes","topic":"factors_multiples_primes","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_013","question":"Simplify the fraction 12/16.","options":["2/3","3/4","4/5","6/7"],"answer":"3/4","explanation":"Divide the numerator and denominator by 4. 12/16 simplifies to 3/4.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_014","question":"What is 1/2 + 1/4?","options":["1/4","2/4","3/4","1"],"answer":"3/4","explanation":"Convert 1/2 to 2/4. Then 2/4 + 1/4 = 3/4.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_015","question":"What is 3/5 - 1/5?","options":["1/5","2/5","3/10","4/5"],"answer":"2/5","explanation":"The denominators are the same, so subtract the numerators: 3 - 1 = 2. The answer is 2/5.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_016","question":"What is 2/3 x 3/4?","options":["1/2","2/5","3/7","5/6"],"answer":"1/2","explanation":"Multiply the numerators and denominators: 2 x 3 = 6 and 3 x 4 = 12. 6/12 simplifies to 1/2.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_017","question":"What is 3/4 divided by 1/2?","options":["3/8","1","3/2","2"],"answer":"3/2","explanation":"Dividing by 1/2 is the same as multiplying by 2. 3/4 x 2 = 6/4, which simplifies to 3/2.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_018","question":"Convert 0.75 to a fraction.","options":["1/4","1/2","3/4","4/5"],"answer":"3/4","explanation":"0.75 equals 75/100, which simplifies to 3/4.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_019","question":"Convert 3/8 to a decimal.","options":["0.125","0.25","0.375","0.625"],"answer":"0.375","explanation":"Divide 3 by 8. The result is 0.375.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_020","question":"Convert 45% to a decimal.","options":["0.045","0.45","4.5","45.0"],"answer":"0.45","explanation":"To convert a percent to a decimal, divide by 100. 45% becomes 0.45.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_021","question":"What is 20% of 150?","options":["20","25","30","35"],"answer":"30","explanation":"20% is 0.20. Multiply 0.20 by 150 to get 30.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_022","question":"What is 0.6 written as a percent?","options":["6%","16%","60%","600%"],"answer":"60%","explanation":"To convert a decimal to a percent, multiply by 100. 0.6 becomes 60%.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_023","question":"What is the value of x if x + 7 = 15?","options":["6","7","8","9"],"answer":"8","explanation":"Subtract 7 from both sides. x = 15 - 7, so x = 8.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_024","question":"What is the value of x if x - 9 = 14?","options":["5","19","23","25"],"answer":"23","explanation":"Add 9 to both sides. x = 14 + 9, so x = 23.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_025","question":"What is the value of x if 4x = 28?","options":["6","7","8","9"],"answer":"7","explanation":"Divide both sides by 4. x = 28/4, so x = 7.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_026","question":"What is the value of x if x/5 = 6?","options":["11","20","25","30"],"answer":"30","explanation":"Multiply both sides by 5. x = 6 x 5, so x = 30.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_027","question":"What is the value of x if 2x + 3 = 11?","options":["3","4","5","7"],"answer":"4","explanation":"Subtract 3 from both sides to get 2x = 8. Divide by 2 to get x = 4.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_028","question":"What is the value of x if 3x - 5 = 16?","options":["5","6","7","8"],"answer":"7","explanation":"Add 5 to both sides to get 3x = 21. Divide by 3 to get x = 7.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_029","question":"Simplify: 5x + 3x.","options":["8","8x","15x","15x2"],"answer":"8x","explanation":"Both terms are like terms. Add the coefficients: 5x + 3x = 8x.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_030","question":"Simplify: 7a - 2a.","options":["5","5a","9a","14a"],"answer":"5a","explanation":"Subtract the coefficients of the like terms. 7a - 2a = 5a.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_031","question":"Simplify: 3(x + 4).","options":["3x + 4","3x + 7","3x + 12","x + 12"],"answer":"3x + 12","explanation":"Distribute 3 to each term inside the parentheses: 3 times x is 3x, and 3 times 4 is 12.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_032","question":"Simplify: 2(5y - 3).","options":["10y - 3","10y - 6","7y - 3","5y - 6"],"answer":"10y - 6","explanation":"Distribute 2 to both terms: 2 times 5y is 10y, and 2 times -3 is -6.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_033","question":"What is the value of 4x + 2 when x = 3?","options":["10","12","14","18"],"answer":"14","explanation":"Substitute 3 for x: 4(3) + 2 = 12 + 2 = 14.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_034","question":"What is the value of x squared plus 5 when x = 4?","options":["13","16","21","25"],"answer":"21","explanation":"First square 4 to get 16. Then add 5 to get 21.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_035","question":"Solve for x: x + 4 = 2x - 6.","options":["6","8","10","12"],"answer":"10","explanation":"Subtract x from both sides to get 4 = x - 6. Add 6 to both sides to get x = 10.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_036","question":"Solve for x: 5x + 2 = 3x + 12.","options":["3","4","5","6"],"answer":"5","explanation":"Subtract 3x from both sides to get 2x + 2 = 12. Subtract 2 to get 2x = 10. Divide by 2 to get x = 5.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_037","question":"Which expression means 'five more than twice a number'?","options":["5x + 2","2x + 5","2(x + 5)","x/2 + 5"],"answer":"2x + 5","explanation":"Twice a number is 2x. Five more than that is 2x + 5.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_038","question":"Which expression means 'three less than a number'?","options":["3 - x","x - 3","3x","x + 3"],"answer":"x - 3","explanation":"Three less than a number means subtract 3 from the number, which is x - 3.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_039","question":"What is the slope of the line y = 3x + 2?","options":["2","3","5","6"],"answer":"3","explanation":"In slope-intercept form, y = mx + b, the slope is m. Here, m = 3.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_040","question":"What is the y-intercept of the line y = 4x - 7?","options":["-7","-4","4","7"],"answer":"-7","explanation":"In y = mx + b, the y-intercept is b. Here, b = -7.","skillTag":"linear_equations","topic":"linear_equations","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_041","question":"What is the slope of a horizontal line?","options":["0","1","-1","Undefined"],"answer":"0","explanation":"A horizontal line has no rise, so its slope is 0.","skillTag":"coordinate_geometry","topic":"coordinate_geometry","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_042","question":"What is the slope of a vertical line?","options":["0","1","-1","Undefined"],"answer":"Undefined","explanation":"A vertical line has zero run, and division by zero is undefined.","skillTag":"coordinate_geometry","topic":"coordinate_geometry","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_043","question":"What is the perimeter of a rectangle with length 10 and width 6?","options":["16","26","32","60"],"answer":"32","explanation":"Perimeter of a rectangle is 2l + 2w. 2(10) + 2(6) = 20 + 12 = 32.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_044","question":"What is the area of a rectangle with length 8 and width 5?","options":["13","26","40","80"],"answer":"40","explanation":"Area of a rectangle is length times width. 8 x 5 = 40.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_045","question":"What is the area of a square with side length 9?","options":["18","36","72","81"],"answer":"81","explanation":"Area of a square is side times side. 9 x 9 = 81.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_046","question":"What is the perimeter of a square with side length 7?","options":["14","21","28","49"],"answer":"28","explanation":"A square has four equal sides. 4 x 7 = 28.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_047","question":"What is the area of a triangle with base 12 and height 5?","options":["17","30","60","120"],"answer":"30","explanation":"Area of a triangle is 1/2 times base times height. 1/2 x 12 x 5 = 30.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_048","question":"What is the circumference of a circle with radius 7, using pi = 22/7?","options":["22","44","49","154"],"answer":"44","explanation":"Circumference is 2πr. Using π = 22/7 and r = 7 gives 2 x 22/7 x 7 = 44.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_049","question":"What is the area of a circle with radius 3, using pi = 3.14?","options":["9.42","18.84","28.26","36.14"],"answer":"28.26","explanation":"Area of a circle is πr squared. 3.14 x 3 x 3 = 28.26.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_050","question":"What is the diameter of a circle with radius 11?","options":["5.5","11","22","121"],"answer":"22","explanation":"Diameter is twice the radius. 2 x 11 = 22.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_051","question":"What is the radius of a circle with diameter 18?","options":["6","9","18","36"],"answer":"9","explanation":"Radius is half the diameter. 18 divided by 2 equals 9.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_052","question":"What is the volume of a rectangular prism with length 4, width 5, and height 6?","options":["15","60","90","120"],"answer":"120","explanation":"Volume is length times width times height. 4 x 5 x 6 = 120.","skillTag":"geometry_volume","topic":"geometry_volume","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_053","question":"What is the volume of a cube with side length 3?","options":["9","18","27","81"],"answer":"27","explanation":"Volume of a cube is side cubed. 3 x 3 x 3 = 27.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_054","question":"What is the sum of the interior angles of a triangle?","options":["90 degrees","180 degrees","270 degrees","360 degrees"],"answer":"180 degrees","explanation":"The interior angles of every triangle add up to 180 degrees.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_055","question":"What is the sum of the interior angles of a quadrilateral?","options":["90 degrees","180 degrees","270 degrees","360 degrees"],"answer":"360 degrees","explanation":"Any quadrilateral can be split into two triangles, so its angles add to 180 + 180 = 360 degrees.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_056","question":"If two angles are complementary and one angle is 35 degrees, what is the other angle?","options":["35 degrees","45 degrees","55 degrees","145 degrees"],"answer":"55 degrees","explanation":"Complementary angles add to 90 degrees. 90 - 35 = 55 degrees.","skillTag":"angles","topic":"angles","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_057","question":"If two angles are supplementary and one angle is 110 degrees, what is the other angle?","options":["60 degrees","70 degrees","80 degrees","90 degrees"],"answer":"70 degrees","explanation":"Supplementary angles add to 180 degrees. 180 - 110 = 70 degrees.","skillTag":"angles","topic":"angles","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_058","question":"What is the missing side of a right triangle with legs 6 and 8?","options":["10","12","14","16"],"answer":"10","explanation":"Use the Pythagorean theorem. 6 squared plus 8 squared equals 36 + 64 = 100, and the square root of 100 is 10.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_059","question":"Which set of side lengths can form a right triangle?","options":["3, 4, 5","4, 5, 6","5, 6, 7","6, 7, 8"],"answer":"3, 4, 5","explanation":"For a right triangle, a squared plus b squared equals c squared. 3 squared plus 4 squared equals 9 + 16 = 25, which is 5 squared.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_060","question":"What type of triangle has three equal sides?","options":["Scalene","Isosceles","Equilateral","Right"],"answer":"Equilateral","explanation":"An equilateral triangle has three equal sides and three equal angles.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_061","question":"What type of triangle has exactly two equal sides?","options":["Scalene","Isosceles","Equilateral","Obtuse"],"answer":"Isosceles","explanation":"An isosceles triangle has exactly two equal sides.","skillTag":"geometry_area_perimeter","topic":"geometry_area_perimeter","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_062","question":"What type of angle measures exactly 90 degrees?","options":["Acute angle","Right angle","Obtuse angle","Straight angle"],"answer":"Right angle","explanation":"A right angle measures exactly 90 degrees.","skillTag":"angles","topic":"angles","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_063","question":"What type of angle measures less than 90 degrees?","options":["Acute angle","Right angle","Obtuse angle","Straight angle"],"answer":"Acute angle","explanation":"An acute angle is any angle that measures less than 90 degrees.","skillTag":"angles","topic":"angles","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_064","question":"What type of angle measures more than 90 degrees but less than 180 degrees?","options":["Acute angle","Right angle","Obtuse angle","Reflex angle"],"answer":"Obtuse angle","explanation":"An obtuse angle is greater than 90 degrees and less than 180 degrees.","skillTag":"angles","topic":"angles","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_065","question":"What is the next number in the sequence: 2, 4, 8, 16, ?","options":["20","24","30","32"],"answer":"32","explanation":"Each number is multiplied by 2. 16 x 2 = 32.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_066","question":"What is the next number in the sequence: 5, 10, 15, 20, ?","options":["22","24","25","30"],"answer":"25","explanation":"Each number increases by 5. 20 + 5 = 25.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_067","question":"What is the next number in the sequence: 81, 27, 9, 3, ?","options":["0","1","2","6"],"answer":"1","explanation":"Each number is divided by 3. 3 divided by 3 equals 1.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_068","question":"What is the mean of 4, 8, 10, and 14?","options":["8","9","10","11"],"answer":"9","explanation":"Add the numbers to get 36. Divide by 4 numbers to get 9.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_069","question":"What is the median of 3, 7, 9, 12, and 20?","options":["7","9","12","20"],"answer":"9","explanation":"The median is the middle number when the values are in order. The middle number is 9.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_070","question":"What is the mode of 2, 4, 4, 6, 8?","options":["2","4","6","8"],"answer":"4","explanation":"The mode is the number that appears most often. The number 4 appears twice.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_071","question":"What is the range of 6, 12, 15, 20?","options":["9","12","14","26"],"answer":"14","explanation":"Range is the largest value minus the smallest value. 20 - 6 = 14.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_072","question":"What is 10 factorial divided by 9 factorial?","options":["1","9","10","90"],"answer":"10","explanation":"10 factorial equals 10 x 9 factorial. Dividing by 9 factorial leaves 10.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_073","question":"What is 5!?","options":["20","60","100","120"],"answer":"120","explanation":"5! means 5 x 4 x 3 x 2 x 1, which equals 120.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_074","question":"What is the probability of flipping heads on a fair coin?","options":["1/4","1/3","1/2","1"],"answer":"1/2","explanation":"A fair coin has two equally likely outcomes, heads and tails. The probability of heads is 1 out of 2.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_075","question":"What is the probability of rolling a 4 on a standard six-sided die?","options":["1/2","1/3","1/6","4/6"],"answer":"1/6","explanation":"A standard die has 6 possible outcomes, and only one of them is a 4.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_076","question":"What is the probability of rolling an even number on a standard six-sided die?","options":["1/6","1/3","1/2","2/3"],"answer":"1/2","explanation":"The even numbers are 2, 4, and 6. That is 3 favorable outcomes out of 6, which simplifies to 1/2.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_077","question":"Simplify: 10 - 2 x 3.","options":["4","16","24","30"],"answer":"4","explanation":"Use order of operations. Multiply first: 2 x 3 = 6. Then 10 - 6 = 4.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_078","question":"Simplify: (10 - 2) x 3.","options":["8","16","24","30"],"answer":"24","explanation":"Do the parentheses first: 10 - 2 = 8. Then multiply 8 x 3 = 24.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_079","question":"Simplify: 18 divided by 3 + 4.","options":["2","6","10","14"],"answer":"10","explanation":"Divide first: 18 divided by 3 = 6. Then add 4 to get 10.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_080","question":"Simplify: 4 + 3 squared.","options":["13","25","49","81"],"answer":"13","explanation":"Exponents come before addition. 3 squared is 9, and 4 + 9 = 13.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_081","question":"Simplify: 2 to the 3rd power plus 5.","options":["11","13","16","25"],"answer":"13","explanation":"2 to the 3rd power is 8. Add 5 to get 13.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_082","question":"What is 10 to the 3rd power?","options":["30","100","1,000","10,000"],"answer":"1,000","explanation":"10 to the 3rd power means 10 x 10 x 10, which equals 1,000.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_083","question":"Simplify: x squared times x cubed.","options":["x5","x6","x8","x9"],"answer":"x5","explanation":"When multiplying powers with the same base, add the exponents. x squared times x cubed equals x to the 5th power.","skillTag":"exponents_root
