 inside the cylinder as fuel burns and creates pressure.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_003","question":"What is the purpose of the crankshaft?","options":["To convert piston motion into rotary motion","To cool engine oil","To filter gasoline","To store electrical charge"],"answer":"To convert piston motion into rotary motion","explanation":"The crankshaft changes the piston's up-and-down motion into rotation that can help turn the wheels.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_004","question":"What connects the piston to the crankshaft?","options":["Connecting rod","Timing belt","Radiator hose","Spark plug wire"],"answer":"Connecting rod","explanation":"The connecting rod links the piston to the crankshaft and transfers force between them.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_005","question":"What is the main purpose of the camshaft?","options":["To open and close engine valves","To charge the battery","To cool the transmission","To inflate the tires"],"answer":"To open and close engine valves","explanation":"The camshaft controls when the intake and exhaust valves open and close.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_006","question":"What do intake valves allow into the engine cylinder?","options":["Air or air-fuel mixture","Exhaust gases only","Brake fluid","Coolant only"],"answer":"Air or air-fuel mixture","explanation":"Intake valves open to let air, or an air-fuel mixture, enter the cylinder.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_007","question":"What do exhaust valves allow out of the engine cylinder?","options":["Burned gases","Fresh fuel only","Engine oil","Battery acid"],"answer":"Burned gases","explanation":"Exhaust valves open to let burned gases leave the cylinder after combustion.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_008","question":"In a four-stroke gasoline engine, which stroke draws the air-fuel mixture into the cylinder?","options":["Intake stroke","Compression stroke","Power stroke","Exhaust stroke"],"answer":"Intake stroke","explanation":"During the intake stroke, the piston moves down and pulls the air-fuel mixture into the cylinder.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_009","question":"In a four-stroke gasoline engine, which stroke compresses the air-fuel mixture?","options":["Intake stroke","Compression stroke","Power stroke","Exhaust stroke"],"answer":"Compression stroke","explanation":"During the compression stroke, the piston moves upward and squeezes the air-fuel mixture.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_010","question":"In a four-stroke gasoline engine, which stroke produces useful force?","options":["Intake stroke","Compression stroke","Power stroke","Exhaust stroke"],"answer":"Power stroke","explanation":"During the power stroke, combustion pushes the piston downward and creates useful engine power.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_011","question":"What ignites the air-fuel mixture in most gasoline engines?","options":["Spark plug","Radiator cap","Fuel pump","Oil filter"],"answer":"Spark plug","explanation":"A spark plug creates an electric spark that ignites the compressed air-fuel mixture.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_012","question":"What type of ignition is used in a diesel engine?","options":["Compression ignition","Spark plug ignition","Battery ignition only","Magnetic ignition only"],"answer":"Compression ignition","explanation":"Diesel engines compress air until it becomes hot enough to ignite the fuel when it is injected.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_013","question":"What is the purpose of the fuel injector?","options":["To spray fuel into the engine","To cool the radiator","To hold the crankshaft in place","To remove exhaust gases"],"answer":"To spray fuel into the engine","explanation":"A fuel injector delivers a controlled spray of fuel into the intake air or combustion chamber.","skillTag":"fuel_ignition","topic":"fuel_ignition","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_014","question":"What is the purpose of the fuel pump?","options":["To move fuel from the tank to the engine","To pump coolant through the radiator","To circulate brake fluid","To inflate the tires"],"answer":"To move fuel from the tank to the engine","explanation":"The fuel pump sends fuel from the fuel tank toward the engine.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_015","question":"What does the air filter do?","options":["Removes dirt from air entering the engine","Cleans engine oil","Filters brake fluid","Stores gasoline"],"answer":"Removes dirt from air entering the engine","explanation":"The air filter traps dust and debris before air enters the engine.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_016","question":"What is the purpose of the engine oil?","options":["To lubricate moving engine parts","To make the battery stronger","To cool the tires","To clean the windshield"],"answer":"To lubricate moving engine parts","explanation":"Engine oil reduces friction and wear between moving parts inside the engine.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_017","question":"What part removes contaminants from engine oil?","options":["Oil filter","Fuel injector","Muffler","Thermostat"],"answer":"Oil filter","explanation":"The oil filter removes dirt, metal particles, and other contaminants from the oil.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_018","question":"What is the main purpose of the cooling system?","options":["To prevent the engine from overheating","To increase tire pressure","To polish the fuel tank","To charge the alternator"],"answer":"To prevent the engine from overheating","explanation":"The cooling system removes excess heat from the engine so it can operate safely.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_019","question":"What does the radiator do?","options":["Removes heat from coolant","Stores engine oil","Compresses fuel vapor","Controls brake pressure"],"answer":"Removes heat from coolant","explanation":"The radiator lets heat leave the coolant and transfer to the surrounding air.","skillTag":"lubrication_cooling","topic":"lubrication_cooling","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_020","question":"What does the water pump do in an engine cooling system?","options":["Circulates coolant through the engine and radiator","Pumps gasoline into the cylinders","Moves oil into the transmission","Inflates the spare tire"],"answer":"Circulates coolant through the engine and radiator","explanation":"The water pump moves coolant through the engine and radiator to control temperature.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_021","question":"What is the purpose of the thermostat in the cooling system?","options":["To regulate coolant flow based on temperature","To measure battery voltage","To clean fuel before combustion","To control tire rotation"],"answer":"To regulate coolant flow based on temperature","explanation":"The thermostat opens and closes to help the engine reach and maintain proper operating temperature.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_022","question":"What is antifreeze commonly mixed with to make engine coolant?","options":["Water","Gasoline","Brake fluid","Motor oil"],"answer":"Water","explanation":"Antifreeze is commonly mixed with water to make coolant that resists freezing and overheating.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_023","question":"What is the main purpose of the battery in a vehicle?","options":["To provide electrical power for starting and accessories","To cool the engine block","To store exhaust gases","To control tire alignment"],"answer":"To provide electrical power for starting and accessories","explanation":"The battery provides electrical energy to start the engine and power electrical components when needed.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_024","question":"What does the alternator do?","options":["Charges the battery and powers electrical systems while the engine runs","Compresses the air-fuel mixture","Filters engine coolant","Stops the vehicle during braking"],"answer":"Charges the battery and powers electrical systems while the engine runs","explanation":"The alternator generates electricity while the engine is running.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_025","question":"What does the starter motor do?","options":["Cranks the engine to start it","Cools the radiator","Opens the fuel cap","Measures exhaust temperature"],"answer":"Cranks the engine to start it","explanation":"The starter motor turns the engine over so combustion can begin.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_026","question":"What is the purpose of a vehicle's transmission?","options":["To transfer engine power to the wheels at different gear ratios","To remove water from gasoline","To filter exhaust gases","To store windshield washer fluid"],"answer":"To transfer engine power to the wheels at different gear ratios","explanation":"The transmission uses gears to match engine power and speed to driving conditions.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_027","question":"What does a clutch do in a manual transmission vehicle?","options":["Connects and disconnects the engine from the transmission","Pumps coolant through the radiator","Filters fuel before injection","Controls headlight brightness"],"answer":"Connects and disconnects the engine from the transmission","explanation":"The clutch lets the driver temporarily disconnect engine power from the transmission to shift gears.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_028","question":"What does a torque converter do in many automatic transmissions?","options":["Transfers engine power to the transmission using fluid coupling","Measures tire pressure","Filters engine air","Controls windshield wipers"],"answer":"Transfers engine power to the transmission using fluid coupling","explanation":"A torque converter uses transmission fluid to transfer power from the engine to the automatic transmission.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_029","question":"What is the purpose of the differential?","options":["Allows drive wheels to turn at different speeds during turns","Charges the battery while parked","Controls engine temperature","Stores brake fluid"],"answer":"Allows drive wheels to turn at different speeds during turns","explanation":"The differential lets the wheels rotate at different speeds when a vehicle turns.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_030","question":"What does the driveshaft usually do?","options":["Transfers power from the transmission to the differential","Pumps fuel into the engine","Filters air entering the cabin","Controls spark timing directly"],"answer":"Transfers power from the transmission to the differential","explanation":"In many vehicles, the driveshaft carries rotating power from the transmission to the differential.","skillTag":"drivetrain","topic":"drivetrain","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_031","question":"What is the purpose of brake pads?","options":["To press against rotors and create friction for stopping","To lubricate wheel bearings","To cool the radiator","To support the engine block"],"answer":"To press against rotors and create friction for stopping","explanation":"Brake pads clamp against rotors, creating friction that slows or stops the vehicle.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_032","question":"What does brake fluid transfer in a hydraulic brake system?","options":["Pressure from the brake pedal to the brakes","Fuel from the tank to the injectors","Air from the filter to the intake","Heat from the radiator to the engine"],"answer":"Pressure from the brake pedal to the brakes","explanation":"Brake fluid carries hydraulic pressure from the pedal to the brake components at the wheels.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_033","question":"What is a common sign of worn brake pads?","options":["Squealing or grinding during braking","Brighter headlights","More fuel in the tank","Cooler engine oil"],"answer":"Squealing or grinding during braking","explanation":"Worn brake pads often make squealing or grinding noises when the brakes are applied.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_034","question":"What is the purpose of the parking brake?","options":["To help hold a parked vehicle in place","To start the engine faster","To cool the transmission fluid","To clean the brake rotors"],"answer":"To help hold a parked vehicle in place","explanation":"The parking brake helps keep the vehicle from rolling when parked.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_035","question":"What is the purpose of shock absorbers?","options":["To control spring movement and improve ride stability","To ignite the air-fuel mixture","To charge the battery","To store coolant"],"answer":"To control spring movement and improve ride stability","explanation":"Shock absorbers dampen bouncing and help keep the tires in contact with the road.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_036","question":"What is the main function of a vehicle's suspension system?","options":["To support the vehicle and absorb road shocks","To filter gasoline","To control spark plug gap","To produce exhaust pressure"],"answer":"To support the vehicle and absorb road shocks","explanation":"The suspension supports the vehicle's weight and helps absorb bumps from the road.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_037","question":"What does wheel alignment affect most directly?","options":["Tire wear and vehicle handling","Fuel color","Battery acid level","Radiator cap pressure only"],"answer":"Tire wear and vehicle handling","explanation":"Proper alignment helps tires wear evenly and keeps the vehicle steering correctly.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_038","question":"What can low tire pressure cause?","options":["Poor fuel economy and uneven tire wear","Higher engine oil level","Stronger battery voltage","Cleaner exhaust automatically"],"answer":"Poor fuel economy and uneven tire wear","explanation":"Low tire pressure increases rolling resistance and can cause tires to wear unevenly.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_039","question":"What does tire tread help provide?","options":["Traction","Battery charging","Engine compression","Coolant flow"],"answer":"Traction","explanation":"Tire tread grips the road and helps move water away from the tire surface.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_040","question":"What is the purpose of rotating tires?","options":["To help tires wear more evenly","To increase engine compression","To clean the fuel injectors","To raise coolant temperature"],"answer":"To help tires wear more evenly","explanation":"Tire rotation moves tires to different positions so they wear more evenly over time.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_041","question":"What does the exhaust system do?","options":["Carries exhaust gases away from the engine","Stores fuel under pressure","Transfers brake force","Controls tire alignment"],"answer":"Carries exhaust gases away from the engine","explanation":"The exhaust system routes burned gases away from the engine and out of the vehicle.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_042","question":"What is the purpose of a muffler?","options":["To reduce exhaust noise","To increase oil pressure","To charge the battery","To cool the brake pads"],"answer":"To reduce exhaust noise","explanation":"The muffler reduces noise created by exhaust gases leaving the engine.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_043","question":"What does a catalytic converter help reduce?","options":["Harmful exhaust emissions","Tire pressure","Battery voltage","Coolant level"],"answer":"Harmful exhaust emissions","explanation":"A catalytic converter changes some harmful exhaust gases into less harmful gases.","skillTag":"vehicle_systems","topic":"vehicle_systems","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_044","question":"What is the purpose of the oxygen sensor?","options":["To monitor oxygen in the exhaust","To measure tire tread depth","To detect coolant leaks directly","To control windshield washer spray"],"answer":"To monitor oxygen in the exhaust","explanation":"The oxygen sensor helps the engine computer adjust the air-fuel mixture.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_045","question":"What does the check engine light usually indicate?","options":["The engine computer has detected a problem","The tires are always flat","The windshield washer fluid is full","The parking brake is always released"],"answer":"The engine computer has detected a problem","explanation":"The check engine light comes on when the onboard computer detects a fault in an engine or emissions-related system.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_046","question":"What is an OBD-II scan tool used for?","options":["Reading diagnostic trouble codes","Inflating tires","Changing engine oil automatically","Balancing wheels mechanically"],"answer":"Reading diagnostic trouble codes","explanation":"An OBD-II scan tool reads trouble codes stored by the vehicle's computer.","skillTag":"vehicle_systems","topic":"vehicle_systems","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_047","question":"What is the purpose of the timing belt or timing chain?","options":["To synchronize crankshaft and camshaft movement","To cool the fuel tank","To clean the exhaust pipe","To operate the brake lights only"],"answer":"To synchronize crankshaft and camshaft movement","explanation":"The timing belt or chain keeps the camshaft and crankshaft moving in the correct relationship.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_048","question":"What can happen if an engine overheats severely?","options":["Engine parts can warp or become damaged","The tires will automatically inflate","The battery will refill itself","The brakes will become unnecessary"],"answer":"Engine parts can warp or become damaged","explanation":"Severe overheating can damage engine parts such as the cylinder head, head gasket, or pistons.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_049","question":"What is engine compression?","options":["Pressure created when the air-fuel mixture is squeezed in the cylinder","The amount of coolant in the radiator","The thickness of tire tread","The weight of the transmission"],"answer":"Pressure created when the air-fuel mixture is squeezed in the cylinder","explanation":"Compression occurs when the piston squeezes the air-fuel mixture before ignition.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_050","question":"What does a compression test help check?","options":["The sealing condition of cylinders, valves, and piston rings","The brightness of headlights","The depth of tire tread","The amount of washer fluid"],"answer":"The sealing condition of cylinders, valves, and piston rings","explanation":"A compression test helps identify whether cylinders can hold pressure properly.","skillTag":"vehicle_systems","topic":"vehicle_systems","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_051","question":"What is the main purpose of a head gasket?","options":["To seal the cylinder head to the engine block","To clean fuel before combustion","To filter cabin air","To connect the tire to the rim"],"answer":"To seal the cylinder head to the engine block","explanation":"The head gasket seals combustion pressure, coolant passages, and oil passages between the cylinder head and engine block.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_052","question":"White smoke from the exhaust may indicate what problem?","options":["Coolant entering the combustion chamber","Low tire pressure","A clean air filter","A fully charged battery"],"answer":"Coolant entering the combustion chamber","explanation":"White exhaust smoke can be a sign that coolant is leaking into the combustion chamber.","skillTag":"lubrication_cooling","topic":"lubrication_cooling","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_053","question":"Blue smoke from the exhaust commonly indicates what?","options":["Engine oil is being burned","The tires are overinflated","The radiator is empty of air","The battery is too new"],"answer":"Engine oil is being burned","explanation":"Blue exhaust smoke often means oil is entering the combustion chamber and burning.","skillTag":"lubrication_cooling","topic":"lubrication_cooling","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_054","question":"Black smoke from the exhaust often indicates what?","options":["Too much fuel is being burned","The transmission is missing","The brakes are too cold","The tires have no tread"],"answer":"Too much fuel is being burned","explanation":"Black smoke often means the air-fuel mixture is too rich, meaning there is too much fuel.","skillTag":"fuel_ignition","topic":"fuel_ignition","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_055","question":"What does ABS stand for in an automotive braking system?","options":["Anti-lock braking system","Automatic battery sensor","Air balance switch","Axle bearing support"],"answer":"Anti-lock braking system","explanation":"ABS stands for anti-lock braking system, which helps prevent wheels from locking during hard braking.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_056","question":"What does power steering help the driver do?","options":["Turn the steering wheel with less effort","Stop the vehicle without brakes","Start the engine without a battery","Increase fuel pressure"],"answer":"Turn the steering wheel with less effort","explanation":"Power steering reduces the effort needed to turn the wheels.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_057","question":"What is the purpose of the serpentine belt?","options":["To drive engine accessories such as the alternator and power steering pump","To hold brake pads against rotors","To seal the fuel tank","To measure exhaust oxygen"],"answer":"To drive engine accessories such as the alternator and power steering pump","explanation":"The serpentine belt transfers engine rotation to accessories such as the alternator, water pump, or power steering pump depending on the vehicle.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_058","question":"What is the function of the PCV valve?","options":["To route crankcase vapors back into the engine intake","To increase tire pressure","To stop coolant from circulating","To control brake pad thickness"],"answer":"To route crankcase vapors back into the engine intake","explanation":"The PCV valve helps control crankcase vapors and sends them back into the intake to be burned.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_059","question":"What does a vehicle's VIN identify?","options":["The specific vehicle","The oil pressure only","The tire size only","The driver's license number"],"answer":"The specific vehicle","explanation":"A VIN, or vehicle identification number, is a unique code used to identify a specific vehicle.","skillTag":"vehicle_systems","topic":"vehicle_systems","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_060","question":"What is the safest way to lift a vehicle for underbody work?","options":["Use a proper jack and support the vehicle with jack stands","Use only the tire as support","Hold the vehicle by hand","Park halfway on a curb without supports"],"answer":"Use a proper jack and support the vehicle with jack stands","explanation":"A jack is for lifting, but jack stands are needed to safely support the vehicle while working underneath.","skillTag":"vehicle_systems","topic":"vehicle_systems","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_real_001","question":"An engine cranks normally but will not start. Which system is most directly involved in igniting the fuel-air mixture in a gasoline engine?","options":["Ignition system","Cooling system","Suspension system","Brake system"],"answer":"Ignition system","explanation":"Gasoline engines need spark at the right time to ignite the compressed fuel-air mixture.","skillTag":"ignition_fuel_systems","topic":"ignition_fuel_systems","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_002","question":"A temperature gauge rises into the hot range while driving. Which system should be checked first?","options":["Cooling system","Audio system","Steering column","Exhaust tip"],"answer":"Cooling system","explanation":"Overheating points to coolant level, radiator, thermostat, fan, water pump, or related cooling issues.","skillTag":"lubrication_cooling","topic":"lubrication_cooling","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_003","question":"Blue smoke from the exhaust often suggests that the engine may be burning:","options":["Oil","Brake fluid only","Coolant only","Battery acid"],"answer":"Oil","explanation":"Blue exhaust smoke commonly indicates oil entering the combustion chamber.","skillTag":"engine_diagnostics","topic":"engine_diagnostics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_004","question":"A squealing noise when braking most likely points to a problem in the:","options":["Brake system","Fuel tank","Radiator cap","Air filter housing"],"answer":"Brake system","explanation":"Brake squeal often comes from worn pads, glazed parts, or brake hardware vibration.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_005","question":"If a vehicle pulls to one side while driving on a straight road, one likely cause is:","options":["Improper wheel alignment","Full fuel tank","Clean air filter","New windshield wipers"],"answer":"Improper wheel alignment","explanation":"Alignment, tire pressure, or brake drag can cause pulling. Alignment is a common likely cause.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_006","question":"The alternator primarily:","options":["Charges the battery and powers electrical systems while the engine runs","Stores gasoline","Compresses air in the cylinders","Controls coolant flow"],"answer":"Charges the battery and powers electrical systems while the engine runs","explanation":"The alternator generates electrical power when driven by the engine.","skillTag":"charging_starting_systems","topic":"charging_starting_systems","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_007","question":"A clicking sound when turning the key, with dim lights, most likely indicates:","options":["Weak battery or poor battery connection","Broken muffler","Low tire tread","Dirty windshield"],"answer":"Weak battery or poor battery connection","explanation":"Clicking and dim lights often point to insufficient electrical power for the starter.","skillTag":"charging_starting_systems","topic":"charging_starting_systems","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_008","question":"The thermostat in a cooling system mainly:","options":["Regulates coolant flow based on temperature","Filters engine oil","Ignites the fuel mixture","Measures tire pressure"],"answer":"Regulates coolant flow based on temperature","explanation":"The thermostat opens and closes to help the engine reach and maintain proper operating temperature.","skillTag":"lubrication_cooling","topic":"lubrication_cooling","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_009","question":"Engine oil that is very low can cause serious damage because oil:","options":["Lubricates moving parts and reduces friction","Inflates tires","Starts the radio","Cleans only the windshield"],"answer":"Lubricates moving parts and reduces friction","explanation":"Low oil can increase friction, heat, and wear inside the engine.","skillTag":"lubrication_cooling","topic":"lubrication_cooling","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_010","question":"The transmission is responsible for:","options":["Changing gear ratios between the engine and drive wheels","Cooling the radiator","Filtering exhaust gas only","Creating spark at the plugs"],"answer":"Changing gear ratios between the engine and drive wheels","explanation":"A transmission changes speed and torque relationships so the vehicle can accelerate and cruise efficiently.","skillTag":"drivetrain_transmission","topic":"drivetrain_transmission","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_011","question":"A catalytic converter is part of which system?","options":["Exhaust/emissions system","Brake hydraulic system","Cooling system","Steering system"],"answer":"Exhaust/emissions system","explanation":"A catalytic converter reduces harmful exhaust emissions.","skillTag":"exhaust_emissions","topic":"exhaust_emissions","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_012","question":"Uneven tire wear on the inside edges of both front tires may suggest:","options":["Alignment problem","Full coolant reservoir","Clean fuel injectors","New brake pads"],"answer":"Alignment problem","explanation":"Camber or toe alignment problems can cause uneven tire wear patterns.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_013","question":"The purpose of anti-lock brakes is to:","options":["Help prevent wheel lockup during hard braking","Increase engine horsepower","Reduce fuel evaporation","Cool the transmission fluid"],"answer":"Help prevent wheel lockup during hard braking","explanation":"ABS rapidly modulates brake pressure to help maintain steering control during hard stops.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_014","question":"The air filter is important because dirty incoming air can:","options":["Increase engine wear and reduce performance","Increase tire pressure","Recharge the battery","Tighten loose belts"],"answer":"Increase engine wear and reduce performance","explanation":"Air filters keep dirt from entering the engine and help maintain proper airflow.","skillTag":"ignition_fuel_systems","topic":"ignition_fuel_systems","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_015","question":"A fuel injector that is clogged would most directly affect:","options":["Fuel delivery to the engine","Wheel alignment","Headlight aim","Brake pad thickness"],"answer":"Fuel delivery to the engine","explanation":"Fuel injectors spray fuel into the intake or combustion chamber. A clog can cause misfire or poor performance.","skillTag":"ignition_fuel_systems","topic":"ignition_fuel_systems","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_016","question":"The power steering system is designed to:","options":["Reduce effort needed to turn the wheels","Increase spark voltage","Open exhaust valves","Store engine coolant"],"answer":"Reduce effort needed to turn the wheels","explanation":"Power steering assists the driver in turning the steering mechanism.","skillTag":"brakes_tires_steering","topic":"brakes_tires_steering","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_017","question":"A slipping clutch in a manual transmission may cause:","options":["Engine speed to rise without matching vehicle acceleration","The radiator to freeze instantly","Headlights to brighten","Brake fluid to boil every time"],"answer":"Engine speed to rise without matching vehicle acceleration","explanation":"A slipping clutch fails to fully transfer engine torque to the transmission.","skillTag":"drivetrain_transmission","topic":"drivetrain_transmission","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_018","question":"The radiator removes heat mainly by transferring it from coolant to:","options":["Air passing through the radiator","Brake pads","Battery terminals","Engine oil filter only"],"answer":"Air passing through the radiator","explanation":"Hot coolant flows through the radiator, where heat transfers to passing air.","skillTag":"lubrication_cooling","topic":"lubrication_cooling","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_019","question":"A serpentine belt commonly drives accessories such as the:","options":["Alternator and power steering pump","Spark plug electrodes","Brake pads","Fuel in the tank"],"answer":"Alternator and power steering pump","explanation":"The belt transfers engine rotation to accessories.","skillTag":"charging_starting_systems","topic":"charging_starting_systems","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ai_real_020","question":"The oxygen sensor helps the engine computer adjust:","options":["Air-fuel mixture","Tire balance","Brake rotor thickness","Wheelbase length"],"answer":"Air-fuel mixture","explanation":"Oxygen sensors monitor exhaust oxygen so the computer can adjust fuel delivery.","skillTag":"exhaust_emissions","topic":"exhaust_emissions","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"}],"Shop Information (SI)":[{"id":"asvab_si_001","question":"What tool is commonly used to measure short distances very accurately?","options":["Micrometer","Hammer","Chisel","Pliers"],"answer":"Micrometer","explanation":"A micrometer is used for very precise measurements, especially of thickness or diameter.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_002","question":"What tool is used to tighten or loosen nuts and bolts?","options":["Wrench","File","Chisel","Saw"],"answer":"Wrench","explanation":"A wrench grips nuts and bolts so they can be tightened or loosened.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_003","question":"What type of screwdriver is used for screws with a cross-shaped slot?","options":["Phillips screwdriver","Flathead screwdriver","Torx screwdriver","Hex key"],"answer":"Phillips screwdriver","explanation":"A Phillips screwdriver fits screws with a cross-shaped recess.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_004","question":"What type of screwdriver is used for screws with a single straight slot?","options":["Flathead screwdriver","Phillips screwdriver","Allen wrench","Socket wrench"],"answer":"Flathead screwdriver","explanation":"A flathead screwdriver fits screws with one straight slot.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_005","question":"What tool is best for gripping, bending, or cutting wire?","options":["Pliers","Level","Plane","Square"],"answer":"Pliers","explanation":"Pliers are designed to grip objects and can often bend or cut wire depending on the type.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_006","question":"What tool is used to check whether a surface is horizontal or vertical?","options":["Level","File","Clamp","Punch"],"answer":"Level","explanation":"A level uses a bubble or digital reading to show whether a surface is level or plumb.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_007","question":"What tool is used to mark a straight line across wood before cutting?","options":["Square","Hammer","Socket","Awl"],"answer":"Square","explanation":"A square helps mark straight lines and right angles accurately.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_008","question":"What tool is used to smooth or shape metal by rubbing it across the surface?","options":["File","Wrench","Drill","Tape measure"],"answer":"File","explanation":"A file removes small amounts of material to smooth, shape, or deburr metal.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_009","question":"What tool is used to make holes in wood, metal, or plastic?","options":["Drill","Chisel","Clamp","Sander"],"answer":"Drill","explanation":"A drill rotates a drill bit to create holes in materials.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_010","question":"What part of a drill actually cuts the hole?","options":["Drill bit","Chuck key","Handle","Trigger"],"answer":"Drill bit","explanation":"The drill bit is the cutting tool that removes material to form the hole.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_011","question":"What is the purpose of a drill chuck?","options":["To hold the drill bit","To measure hole depth","To cool the motor","To sharpen the bit"],"answer":"To hold the drill bit","explanation":"The chuck grips the drill bit and keeps it centered while it spins.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_012","question":"What tool is used to hold workpieces tightly together while glue dries or while parts are being assembled?","options":["Clamp","Screwdriver","Awl","Brush"],"answer":"Clamp","explanation":"A clamp holds materials securely so they do not move during work.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_013","question":"What type of saw is commonly used to cut curves in wood?","options":["Jigsaw","Hacksaw","Rip saw","Back saw"],"answer":"Jigsaw","explanation":"A jigsaw uses a narrow blade that can follow curved cutting lines.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_014","question":"What type of saw is commonly used to cut metal?","options":["Hacksaw","Coping saw","Rip saw","Keyhole saw"],"answer":"Hacksaw","explanation":"A hacksaw has a fine-toothed blade designed for cutting metal and plastic.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_015","question":"What type of saw cut goes with the grain of wood?","options":["Rip cut","Crosscut","Miter cut","Bevel cut"],"answer":"Rip cut","explanation":"A rip cut runs in the same direction as the grain of the wood.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_016","question":"What type of saw cut goes across the grain of wood?","options":["Crosscut","Rip cut","Thread cut","Groove cut"],"answer":"Crosscut","explanation":"A crosscut goes across the wood grain.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_017","question":"What tool is used to cut internal threads in a hole?","options":["Tap","Die","File","Punch"],"answer":"Tap","explanation":"A tap cuts threads inside a hole so a bolt or screw can fit.","skillTag":"threading_fastening","topic":"threading_fastening","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_018","question":"What tool is used to cut external threads on a rod?","options":["Die","Tap","Chisel","Countersink"],"answer":"Die","explanation":"A die cuts external threads on rods, bolts, or similar round stock.","skillTag":"threading_fastening","topic":"threading_fastening","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_019","question":"What is the purpose of a center punch?","options":["To make a small starting mark before drilling","To tighten a nut","To measure an angle","To polish a surface"],"answer":"To make a small starting mark before drilling","explanation":"A center punch makes a small indentation that helps keep a drill bit from wandering.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_020","question":"What does a countersink bit do?","options":["Creates a cone-shaped recess for a screw head","Cuts internal threads","Measures wire diameter","Removes paint only"],"answer":"Creates a cone-shaped recess for a screw head","explanation":"A countersink allows a flat-head screw to sit flush with or below the surface.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_021","question":"What is the main purpose of safety glasses in a shop?","options":["To protect the eyes from flying particles","To improve hearing","To prevent slipping","To make tools lighter"],"answer":"To protect the eyes from flying particles","explanation":"Safety glasses protect eyes from chips, dust, sparks, and flying debris.","skillTag":"shop_safety","topic":"shop_safety","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_022","question":"What should you do before changing a blade on a power saw?","options":["Disconnect the power source","Increase the speed","Hold the trigger down","Remove all guards permanently"],"answer":"Disconnect the power source","explanation":"Disconnecting power prevents the saw from starting accidentally while the blade is being changed.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_023","question":"Why should loose clothing be avoided around rotating machinery?","options":["It can get caught in moving parts","It makes machinery quieter","It increases cutting accuracy","It cools the motor"],"answer":"It can get caught in moving parts","explanation":"Loose clothing can become tangled in rotating parts and cause serious injury.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_024","question":"What is the safest way to carry a sharp hand tool?","options":["With the sharp edge pointed down and away from the body","With the sharp edge pointed at another person","By the blade","In a pocket with the edge exposed"],"answer":"With the sharp edge pointed down and away from the body","explanation":"Pointing the sharp edge away reduces the chance of cutting yourself or others.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_025","question":"What is the purpose of a machine guard?","options":["To protect the operator from moving parts","To make the machine heavier","To increase electrical current","To sharpen the blade"],"answer":"To protect the operator from moving parts","explanation":"Machine guards reduce the risk of contact with blades, belts, gears, and other moving parts.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_026","question":"What type of hammer is commonly used for general carpentry?","options":["Claw hammer","Ball-peen hammer","Sledgehammer","Mallet"],"answer":"Claw hammer","explanation":"A claw hammer is used to drive nails and pull nails from wood.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_027","question":"What type of hammer is commonly used for shaping metal or striking punches?","options":["Ball-peen hammer","Claw hammer","Rubber mallet","Dead blow hammer"],"answer":"Ball-peen hammer","explanation":"A ball-peen hammer is commonly used in metalworking and for striking punches or chisels.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_028","question":"What tool is used to cut or shape wood by striking it with a mallet?","options":["Chisel","Level","Socket","Tape measure"],"answer":"Chisel","explanation":"A chisel has a sharp edge used to cut or shape wood, often with help from a mallet.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_029","question":"What is sandpaper used for?","options":["Smoothing surfaces","Measuring angles","Tightening bolts","Cutting threads"],"answer":"Smoothing surfaces","explanation":"Sandpaper has abrasive grit that smooths or prepares surfaces.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_030","question":"What does a lower sandpaper grit number usually mean?","options":["Coarser abrasive","Finer abrasive","No abrasive","Waterproof paper only"],"answer":"Coarser abrasive","explanation":"Lower grit numbers mean larger abrasive particles, which remove material faster but leave rougher surfaces.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_031","question":"What does a higher sandpaper grit number usually mean?","options":["Finer abrasive","Coarser abrasive","Thicker wood","Larger screws"],"answer":"Finer abrasive","explanation":"Higher grit numbers use smaller abrasive particles and produce a smoother finish.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_032","question":"What fastener is commonly driven into wood with a hammer?","options":["Nail","Bolt","Washer","Nut"],"answer":"Nail","explanation":"A nail is usually driven into wood with a hammer.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_033","question":"What fastener usually requires a nut to secure two parts together?","options":["Bolt","Nail","Staple","Rivet only"],"answer":"Bolt","explanation":"A bolt often passes through parts and is secured with a nut.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_034","question":"What is the purpose of a washer?","options":["To spread load and protect the surface under a fastener","To cut threads into metal","To drill holes","To sharpen saw teeth"],"answer":"To spread load and protect the surface under a fastener","explanation":"A washer spreads pressure from a bolt or nut and can help prevent surface damage.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_035","question":"What is a lock washer used for?","options":["To help prevent a nut or bolt from loosening","To measure bolt length","To cut metal","To polish wood"],"answer":"To help prevent a nut or bolt from loosening","explanation":"A lock washer helps keep fasteners tight by resisting loosening from vibration.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_036","question":"What is the purpose of a vise?","options":["To hold a workpiece firmly","To measure voltage","To sharpen drill bits automatically","To store nails"],"answer":"To hold a workpiece firmly","explanation":"A vise clamps a workpiece so it stays still while being cut, filed, drilled, or assembled.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_037","question":"What tool is used to measure long distances in a shop or construction setting?","options":["Tape measure","Center punch","Screwdriver","Socket"],"answer":"Tape measure","explanation":"A tape measure is flexible and commonly used to measure longer lengths.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_038","question":"What does a caliper measure?","options":["Inside, outside, or depth dimensions","Electrical current only","Wood grain direction only","Thread color"],"answer":"Inside, outside, or depth dimensions","explanation":"Calipers can measure outside diameter, inside diameter, thickness, and depth.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_039","question":"What tool is used to measure or mark angles?","options":["Protractor","Pipe wrench","C-clamp","Sledgehammer"],"answer":"Protractor","explanation":"A protractor is used to measure or lay out angles in degrees.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_040","question":"What is a bevel cut?","options":["A cut made at an angle through the thickness of the material","A cut made only with scissors","A cut that follows wood grain exactly","A hole drilled straight down"],"answer":"A cut made at an angle through the thickness of the material","explanation":"A bevel cut changes the angle of the edge by cutting through the material's thickness at an angle.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_041","question":"What is a miter cut?","options":["An angled cut across the face of a board","A hole made by a drill","A thread cut inside a nut","A weld bead"],"answer":"An angled cut across the face of a board","explanation":"A miter cut is commonly used to join pieces at an angle, such as picture frame corners.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_042","question":"What tool is commonly used to make repeated angled cuts in wood trim?","options":["Miter saw","Pipe cutter","Bench grinder","Hand file"],"answer":"Miter saw","explanation":"A miter saw is designed to make accurate crosscuts and angled cuts.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_043","question":"What is the purpose of a bench grinder?","options":["To sharpen, grind, or shape metal","To measure board length","To glue wood together","To tighten screws"],"answer":"To sharpen, grind, or shape metal","explanation":"A bench grinder uses abrasive wheels to remove metal, sharpen tools, or shape parts.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_044","question":"What should be worn when using a grinder?","options":["Eye protection","Loose gloves near the wheel","Open-toed shoes","Dangling jewelry"],"answer":"Eye protection","explanation":"Grinding can throw sparks and particles, so eye protection is required.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_045","question":"What is the purpose of cutting oil when drilling metal?","options":["To reduce heat and friction","To make the drill bit dull","To paint the hole","To increase rust instantly"],"answer":"To reduce heat and friction","explanation":"Cutting oil cools and lubricates the drill bit, helping it cut better and last longer.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_046","question":"What is a pilot hole?","options":["A small hole drilled before inserting a screw or larger bit","A hole used only in aircraft","A crack in a saw blade","A slot in a hammer"],"answer":"A small hole drilled before inserting a screw or larger bit","explanation":"A pilot hole guides a screw or larger drill bit and helps prevent splitting.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_047","question":"Why is a pilot hole often drilled before driving a screw into wood?","options":["To reduce splitting and make the screw easier to drive","To weaken the screw","To make the wood heavier","To remove the screw threads"],"answer":"To reduce splitting and make the screw easier to drive","explanation":"A pilot hole gives the screw a path and lowers the chance of splitting the wood.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_048","question":"What does the term 'deburring' mean?","options":["Removing rough edges after cutting or drilling","Adding threads to a bolt","Measuring board thickness","Painting a surface"],"answer":"Removing rough edges after cutting or drilling","explanation":"Deburring removes sharp or rough edges left after machining, cutting, or drilling.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_049","question":"What is the purpose of a wood plane?","options":["To shave and smooth wood surfaces","To drill holes in steel","To measure electrical resistance","To cut threads on pipe"],"answer":"To shave and smooth wood surfaces","explanation":"A plane removes thin layers of wood to flatten, smooth, or shape a surface.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_050","question":"What is plywood made of?","options":["Thin layers of wood glued together","Melted steel fibers","Solid plastic only","Concrete and sand"],"answer":"Thin layers of wood glued together","explanation":"Plywood is made from thin wood veneers glued in layers for strength.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_051","question":"What is hardwood usually made from?","options":["Deciduous trees","Rubber only","Melted plastic","Soft metal"],"answer":"Deciduous trees","explanation":"Hardwood generally comes from deciduous trees, such as oak, maple, and walnut.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_052","question":"What is softwood usually made from?","options":["Coniferous trees","Iron ore","Glass fiber","Ceramic powder"],"answer":"Coniferous trees","explanation":"Softwood generally comes from coniferous trees, such as pine, fir, and spruce.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_053","question":"What is the purpose of primer before painting?","options":["To help paint stick and provide a better surface","To remove all color from paint","To make paint dry slower forever","To cut metal"],"answer":"To help paint stick and provide a better surface","explanation":"Primer prepares the surface so paint adheres better and looks more even.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_054","question":"What is welding?","options":["Joining materials by heating them until they fuse","Measuring wood with a tape","Driving nails into concrete","Sanding paint from metal"],"answer":"Joining materials by heating them until they fuse","explanation":"Welding uses heat, pressure, or both to join materials, usually metals.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_055","question":"What protective equipment is especially important when welding?","options":["Welding helmet","Baseball cap","Cotton shorts","Open-toed shoes"],"answer":"Welding helmet","explanation":"A welding helmet protects the eyes and face from bright arc light, sparks, and heat.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_056","question":"What is soldering commonly used for?","options":["Joining small metal parts or electrical connections","Cutting lumber","Sharpening drill bits","Measuring tire pressure"],"answer":"Joining small metal parts or electrical connections","explanation":"Soldering joins parts using melted solder, commonly in electrical work and light metal joining.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_057","question":"What is brazing?","options":["Joining metals using a filler metal that melts above soldering temperature","Cutting wood across the grain","Measuring screw pitch","Removing rust with sandpaper only"],"answer":"Joining metals using a filler metal that melts above soldering temperature","explanation":"Brazing joins metals with a filler metal that melts at a higher temperature than solder but does not melt the base metals.","skillTag":"shop_terms","topic":"shop_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_058","question":"What does a pipe wrench grip best?","options":["Round pipe","Small finishing nails","Flat glass sheets","Wood trim only"],"answer":"Round pipe","explanation":"A pipe wrench has serrated jaws designed to grip round pipe.","skillTag":"hand_tools","topic":"hand_tools","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_059","question":"What is the purpose of Teflon tape on pipe threads?","options":["To help seal threaded pipe joints","To sharpen the pipe","To make the pipe conduct electricity","To measure pipe length"],"answer":"To help seal threaded pipe joints","explanation":"Teflon tape helps seal threaded pipe connections and reduce leaks.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_060","question":"What should you do with oily rags to reduce fire risk?","options":["Store or dispose of them in a proper metal safety container","Pile them near sparks","Leave them under direct heat","Mix them with sawdust on the floor"],"answer":"Store or dispose of them in a proper metal safety container","explanation":"Oily rags can catch fire if handled carelessly, so they should be placed in an approved safety container.","skillTag":"shop_safety","topic":"shop_safety","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_si_real_001","question":"A board must be cut at a 45-degree angle for a picture frame. Which cut is this?","options":["Miter cut","Rip cut","Thread cut","Plumb cut"],"answer":"Miter cut","explanation":"A miter cut is an angled cut commonly used for corners and frames.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_002","question":"Which tool is best for checking whether two surfaces meet at a right angle?","options":["Try square","Pipe wrench","Center punch","File card"],"answer":"Try square","explanation":"A try square checks and marks 90-degree angles.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_003","question":"A drill bit keeps wandering before cutting into metal. What tool should be used first?","options":["Center punch","Paint brush","Level","Pipe cutter"],"answer":"Center punch","explanation":"A center punch creates a small starting indentation to keep the bit from drifting.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_004","question":"When using a hacksaw, the teeth should usually point:","options":["Forward, away from the handle","Backward, toward the handle","Sideways only","Upward at all times"],"answer":"Forward, away from the handle","explanation":"Most hacksaws cut on the forward stroke, so the teeth point away from the handle.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_005","question":"A tap is used to:","options":["Cut internal threads","Cut external threads","Measure voltage","Sharpen a saw"],"answer":"Cut internal threads","explanation":"A tap cuts threads inside a hole for a screw or bolt.","skillTag":"threading_fastening","topic":"threading_fastening","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_006","question":"A die is used to:","options":["Cut external threads","Cut internal threads","Measure fluid level","Check wall plumb"],"answer":"Cut external threads","explanation":"A die cuts threads on the outside of a rod or bolt.","skillTag":"threading_fastening","topic":"threading_fastening","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_007","question":"Which measuring tool is best for measuring outside diameter with high precision?","options":["Micrometer","Claw hammer","Wood rasp","Level"],"answer":"Micrometer","explanation":"A micrometer measures small dimensions such as thickness or diameter very precisely.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_008","question":"Before operating a grinder, the user should primarily wear:","options":["Eye protection","Loose gloves only","Open-toe shoes","Wet sleeves"],"answer":"Eye protection","explanation":"Grinding can throw sparks and particles, making eye protection critical.","skillTag":"shop_safety","topic":"shop_safety","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_009","question":"A file should generally be cleaned with a:","options":["File card","Socket wrench","Paint roller","Soldering iron"],"answer":"File card","explanation":"A file card removes metal filings from file teeth.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_010","question":"Which tool is used to hold a workpiece firmly on a bench?","options":["Vise","Tape measure","Awl","Pencil"],"answer":"Vise","explanation":"A vise clamps work securely while cutting, filing, or assembling.","skillTag":"holding_clamping","topic":"holding_clamping","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_011","question":"A countersink bit is used to:","options":["Create a tapered recess for a screw head","Cut internal threads","Measure board moisture","Bend sheet metal only"],"answer":"Create a tapered recess for a screw head","explanation":"Countersinking lets a flat-head screw sit flush or below the surface.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_012","question":"Which saw is usually best for cutting across the grain of wood?","options":["Crosscut saw","Rip saw","Coping saw only","Hacksaw only"],"answer":"Crosscut saw","explanation":"A crosscut saw is designed to cut across wood grain.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_013","question":"A rip saw is designed to cut:","options":["With the grain","Across the grain","Only metal pipe","Only ceramic tile"],"answer":"With the grain","explanation":"Rip cuts run parallel to the grain of the wood.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_014","question":"Which fastener is commonly tightened with an Allen wrench?","options":["Socket-head screw","Slotted screw only","Phillips screw only","Nail"],"answer":"Socket-head screw","explanation":"Allen wrenches fit hex socket fasteners.","skillTag":"threading_fastening","topic":"threading_fastening","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_015","question":"A level is used to check whether a surface is:","options":["Horizontal or vertical","Electrically charged","Threaded properly","Hot enough to weld"],"answer":"Horizontal or vertical","explanation":"Levels check level and plumb surfaces.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_016","question":"When drilling metal, cutting oil is often used to:","options":["Reduce heat and friction","Make the bit dull faster","Increase electrical voltage","Remove all torque"],"answer":"Reduce heat and friction","explanation":"Cutting oil lubricates the cut and helps control heat.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_017","question":"A clamp should be used when a workpiece might:","options":["Move during cutting or gluing","Increase voltage","Become magnetic automatically","Measure too long"],"answer":"Move during cutting or gluing","explanation":"Clamps secure material and improve accuracy and safety.","skillTag":"holding_clamping","topic":"holding_clamping","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_018","question":"Which tool is best for removing small burrs from a metal edge?","options":["File","Ball-peen hammer","Tape measure","Level"],"answer":"File","explanation":"A file smooths and deburrs metal edges.","skillTag":"cutting_drilling_tools","topic":"cutting_drilling_tools","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_019","question":"What is the safest first action before changing a power-tool blade?","options":["Disconnect power","Increase speed","Hold the trigger down","Wet the tool"],"answer":"Disconnect power","explanation":"Disconnecting power prevents accidental startup while servicing the tool.","skillTag":"shop_safety","topic":"shop_safety","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_si_real_020","question":"A plumb line is used to determine:","options":["True vertical","Exact voltage","Thread pitch","Fuel pressure"],"answer":"True vertical","explanation":"A plumb line uses gravity to establish a vertical reference.","skillTag":"measurement_layout","topic":"measurement_layout","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"}],"Mechanical Comprehension (MC)":[{"id":"asvab_mc_001","question":"What is the main purpose of a simple machine?","options":["To make work easier by changing force or direction","To create energy from nothing","To remove all friction","To stop gravity"],"answer":"To make work easier by changing force or direction","explanation":"Simple machines help make work easier by changing the size or direction of a force.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_002","question":"Which simple machine is a ramp?","options":["Inclined plane","Pulley","Wheel and axle","Lever"],"answer":"Inclined plane","explanation":"A ramp is an inclined plane because it is a sloped surface used to move objects more easily.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_003","question":"What is the purpose of an inclined plane?","options":["To reduce the force needed to lift an object","To increase gravity","To make an object weigh more","To stop motion completely"],"answer":"To reduce the force needed to lift an object","explanation":"An inclined plane spreads lifting work over a longer distance, so less force is needed.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_004","question":"Which tool is an example of a lever?","options":["Crowbar","Screw","Pulley wheel","Ramp"],"answer":"Crowbar","explanation":"A crowbar is a lever because it pivots around a point to move or lift an object.","skillTag":"levers","topic":"levers","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_005","question":"What is the fixed point around which a lever turns called?","options":["Fulcrum","Load","Effort","Gear"],"answer":"Fulcrum","explanation":"The fulcrum is the pivot point of a lever.","skillTag":"levers","topic":"levers","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_006","question":"In a lever, the object being moved is called the:","options":["Load","Fulcrum","Spring","Axle"],"answer":"Load","explanation":"The load is the weight or resistance that the lever is trying to move.","skillTag":"levers","topic":"levers","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_007","question":"In a first-class lever, where is the fulcrum located?","options":["Between the effort and the load","At the same place as the load","Only at the end of the load","Behind the wheel"],"answer":"Between the effort and the load","explanation":"A first-class lever has the fulcrum between the effort force and the load.","skillTag":"levers","topic":"levers","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_008","question":"Which item is an example of a first-class lever?","options":["Seesaw","Wheelbarrow","Fishing rod","Ramp"],"answer":"Seesaw","explanation":"A seesaw has the fulcrum in the middle, with force and load on opposite sides.","skillTag":"levers","topic":"levers","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_009","question":"Which item is an example of a second-class lever?","options":["Wheelbarrow","Seesaw","Tweezers","Fishing rod"],"answer":"Wheelbarrow","explanation":"A wheelbarrow is a second-class lever because the load is between the fulcrum and the effort.","skillTag":"levers","topic":"levers","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_010","question":"Which item is an example of a third-class lever?","options":["Fishing rod","Seesaw","Bottle opener","Wheelbarrow"],"answer":"Fishing rod","explanation":"A fishing rod is a third-class lever because the effort is applied between the fulcrum and the load.","skillTag":"levers","topic":"levers","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_011","question":"What is mechanical advantage?","options":["The amount a machine multiplies force","The weight of the machine","The speed of gravity","The amount of fuel in a tank"],"answer":"The amount a machine multiplies force","explanation":"Mechanical advantage tells how much a machine increases the applied force.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_012","question":"If a machine has a mechanical advantage greater than 1, what does it do?","options":["Multiplies force","Eliminates work","Creates free energy","Stops all motion"],"answer":"Multiplies force","explanation":"A mechanical advantage greater than 1 means the output force is larger than the input force.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_013","question":"What is work in mechanical terms?","options":["Force applied over a distance","Force with no movement","Weight divided by time","Speed multiplied by heat"],"answer":"Force applied over a distance","explanation":"Work is done when a force moves an object through a distance.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_014","question":"What is power?","options":["The rate at which work is done","The total weight of an object","The distance an object falls","The amount of friction only"],"answer":"The rate at which work is done","explanation":"Power measures how quickly work is performed.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_015","question":"Which unit is commonly used to measure force?","options":["Newton","Watt","Volt","Liter"],"answer":"Newton","explanation":"Force is commonly measured in newtons.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_016","question":"Which unit is commonly used to measure work or energy?","options":["Joule","Ampere","Ohm","Degree"],"answer":"Joule","explanation":"Work and energy are commonly measured in joules.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_017","question":"Which unit is commonly used to measure power?","optio
