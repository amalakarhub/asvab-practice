question":"Which protocol is commonly used to retrieve email from a mail server while keeping messages on the server?","options":["IMAP","ARP","ICMP","NTP only"],"answer":"IMAP","explanation":"IMAP allows email clients to access and manage messages stored on a mail server.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_035","question":"Which protocol is commonly used to transfer files but does not encrypt by default?","options":["FTP","HTTPS","SSH","SFTP"],"answer":"FTP","explanation":"FTP transfers files but does not encrypt traffic by default, making it less secure than SFTP or FTPS.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_036","question":"Which protocol provides secure remote command-line access?","options":["SSH","Telnet","HTTP","SMTP"],"answer":"SSH","explanation":"SSH provides encrypted remote access to a command-line shell.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_037","question":"Why is Telnet considered insecure?","options":["It sends data in plaintext","It only works on printers","It cannot connect to networks","It deletes user accounts by default"],"answer":"It sends data in plaintext","explanation":"Telnet does not encrypt traffic, so usernames, passwords, and commands can be exposed.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_038","question":"What is ARP used for?","options":["Mapping an IP address to a MAC address","Encrypting web traffic","Assigning domain names","Compressing files"],"answer":"Mapping an IP address to a MAC address","explanation":"ARP helps devices find the MAC address associated with an IP address on a local network.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_039","question":"What is ICMP commonly used for?","options":["Network diagnostics and error messages","File encryption only","Printing documents","Creating user accounts"],"answer":"Network diagnostics and error messages","explanation":"ICMP is used for network messages, including those used by ping.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_040","question":"Which port is commonly used by HTTP?","options":["80","22","25","443"],"answer":"80","explanation":"HTTP commonly uses TCP port 80.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_041","question":"Which port is commonly used by HTTPS?","options":["443","21","23","53"],"answer":"443","explanation":"HTTPS commonly uses TCP port 443.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_042","question":"Which port is commonly used by DNS?","options":["53","80","110","3389"],"answer":"53","explanation":"DNS commonly uses port 53.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_043","question":"Which port is commonly used by SSH?","options":["22","21","25","143"],"answer":"22","explanation":"SSH commonly uses TCP port 22.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_044","question":"Which port is commonly used by SMTP?","options":["25","53","67","443"],"answer":"25","explanation":"SMTP commonly uses port 25 for mail transfer between servers.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_045","question":"Which port is commonly used by Remote Desktop Protocol?","options":["3389","143","22","110"],"answer":"3389","explanation":"Remote Desktop Protocol, or RDP, commonly uses TCP port 3389.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_046","question":"What does the CIA triad stand for in cybersecurity?","options":["Confidentiality, Integrity, Availability","Control, Internet, Access","Cyber, Identity, Authentication","Compression, Installation, Analysis"],"answer":"Confidentiality, Integrity, Availability","explanation":"The CIA triad is a basic security model focused on protecting confidentiality, integrity, and availability.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_047","question":"Which security goal protects information from unauthorized viewing?","options":["Confidentiality","Availability","Redundancy","Compression"],"answer":"Confidentiality","explanation":"Confidentiality means keeping sensitive information private and accessible only to authorized users.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_048","question":"Which security goal ensures data has not been improperly changed?","options":["Integrity","Availability","Portability","Latency"],"answer":"Integrity","explanation":"Integrity means data remains accurate, complete, and protected from unauthorized modification.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_049","question":"Which security goal ensures systems and data are accessible when needed?","options":["Availability","Obfuscation","Compression","Fragmentation"],"answer":"Availability","explanation":"Availability means authorized users can access systems and data when needed.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_050","question":"What is authentication?","options":["Verifying a user's identity","Giving every user administrator rights","Deleting unused files","Encrypting a monitor"],"answer":"Verifying a user's identity","explanation":"Authentication checks whether a user or system is who it claims to be.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_051","question":"What is authorization?","options":["Determining what an authenticated user is allowed to access","Changing a password to plaintext","Removing all account restrictions","Testing a keyboard"],"answer":"Determining what an authenticated user is allowed to access","explanation":"Authorization controls what resources and actions a verified user is permitted to use.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_052","question":"What is multifactor authentication?","options":["Using two or more types of proof to verify identity","Using the same password on many sites","Logging in without a username","Disabling account security"],"answer":"Using two or more types of proof to verify identity","explanation":"Multifactor authentication uses more than one factor, such as a password and a one-time code.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_053","question":"Which is the strongest password?","options":["T9!vQ2#pL7z@","password","12345678","john1980"],"answer":"T9!vQ2#pL7z@","explanation":"A strong password is long, hard to guess, and uses a mix of characters.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_054","question":"What is phishing?","options":["A scam that tricks users into revealing information","A way to speed up a processor","A method for cooling servers","A type of monitor cable"],"answer":"A scam that tricks users into revealing information","explanation":"Phishing uses fake messages, websites, or calls to trick people into giving up sensitive information.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_055","question":"What should you do if you receive an unexpected email asking you to click a link and enter your password?","options":["Do not click the link and verify through an official source","Click the link immediately","Forward it to all coworkers","Reply with your password"],"answer":"Do not click the link and verify through an official source","explanation":"Unexpected login links may be phishing. It is safer to verify through an official website or trusted contact method.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_056","question":"What is malware?","options":["Software designed to harm or misuse systems","A hardware cooling device","A secure backup method","A type of keyboard"],"answer":"Software designed to harm or misuse systems","explanation":"Malware is malicious software, such as viruses, worms, ransomware, and spyware.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_057","question":"What type of malware spreads by attaching itself to legitimate files or programs?","options":["Virus","Firewall","Patch","Hypervisor"],"answer":"Virus","explanation":"A virus spreads by attaching to files or programs and running when the host is executed.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_058","question":"What type of malware can spread across networks without needing a user to run an infected file?","options":["Worm","Cookie","Driver","Patch"],"answer":"Worm","explanation":"A worm can self-replicate and spread over networks without direct user action.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_059","question":"What type of malware locks or encrypts files and demands payment?","options":["Ransomware","Firmware","Freeware","Middleware"],"answer":"Ransomware","explanation":"Ransomware blocks access to data, often by encryption, and demands payment for recovery.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_060","question":"What type of malware secretly records user activity or gathers information?","options":["Spyware","Compiler","Router","Patch"],"answer":"Spyware","explanation":"Spyware is designed to monitor users or collect information without permission.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_061","question":"What is a Trojan horse in cybersecurity?","options":["Malware disguised as legitimate software","A secure encryption algorithm","A type of network cable","A password manager"],"answer":"Malware disguised as legitimate software","explanation":"A Trojan appears useful or harmless but contains malicious code.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_062","question":"What is social engineering?","options":["Manipulating people to reveal information or perform unsafe actions","Writing code for social media apps only","Designing office buildings","Testing computer fans"],"answer":"Manipulating people to reveal information or perform unsafe actions","explanation":"Social engineering attacks people instead of just technology, often using trust, fear, or urgency.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_063","question":"What is encryption?","options":["Converting readable data into unreadable form without a key","Deleting files permanently","Increasing screen resolution","Testing memory speed"],"answer":"Converting readable data into unreadable form without a key","explanation":"Encryption protects data by making it unreadable unless the correct key is used.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_064","question":"What is hashing commonly used for?","options":["Creating a fixed-length value to verify data integrity","Increasing hard drive size","Changing a monitor cable","Assigning IP addresses automatically"],"answer":"Creating a fixed-length value to verify data integrity","explanation":"A hash produces a fixed-length value that can help verify whether data has changed.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_065","question":"Why should passwords usually be stored as hashes instead of plaintext?","options":["Hashes help protect passwords if the database is exposed","Hashes make passwords easier to read","Hashes remove the need for usernames","Hashes turn passwords into IP addresses"],"answer":"Hashes help protect passwords if the database is exposed","explanation":"Stored hashes make it harder for attackers to learn the original passwords.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_066","question":"What is a digital certificate used for?","options":["To help verify the identity of a website or system","To increase RAM capacity","To format a hard drive","To replace a network cable"],"answer":"To help verify the identity of a website or system","explanation":"Digital certificates help prove identity and support encrypted connections such as HTTPS.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_067","question":"What does VPN stand for?","options":["Virtual Private Network","Verified Public Name","Visual Packet Number","Variable Power Node"],"answer":"Virtual Private Network","explanation":"A VPN creates an encrypted connection, often used to securely access a private network over the internet.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_068","question":"What is the main purpose of antivirus software?","options":["To detect and help remove malicious software","To increase monitor brightness","To create wireless networks","To replace the operating system"],"answer":"To detect and help remove malicious software","explanation":"Antivirus software scans for and helps remove malware.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_069","question":"What is a software patch?","options":["An update that fixes bugs or security problems","A type of keyboard shortcut","A physical repair to a monitor","A network cable connector"],"answer":"An update that fixes bugs or security problems","explanation":"Patches update software to fix errors, close vulnerabilities, or improve performance.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_070","question":"Why are regular backups important?","options":["They help restore data after loss or damage","They prevent all phishing emails","They make passwords unnecessary","They remove the need for updates"],"answer":"They help restore data after loss or damage","explanation":"Backups provide copies of data that can be restored after deletion, corruption, hardware failure, or ransomware.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_071","question":"What is the principle of least privilege?","options":["Users should have only the access needed to do their jobs","Every user should be an administrator","Passwords should never expire","All files should be public"],"answer":"Users should have only the access needed to do their jobs","explanation":"Least privilege limits access to reduce damage from mistakes, misuse, or compromised accounts.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_072","question":"What is a denial-of-service attack?","options":["An attack that tries to make a system unavailable","A backup method","A secure login process","A way to increase disk space"],"answer":"An attack that tries to make a system unavailable","explanation":"A denial-of-service attack overwhelms or disrupts a service so legitimate users cannot access it.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_073","question":"What is a botnet?","options":["A group of compromised devices controlled by an attacker","A secure password vault","A type of monitor","A printer driver"],"answer":"A group of compromised devices controlled by an attacker","explanation":"A botnet is made of infected devices that can be remotely controlled for attacks or spam.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_074","question":"What does SQL stand for?","options":["Structured Query Language","Secure Queue Link","System Quality Logic","Standard Quick Login"],"answer":"Structured Query Language","explanation":"SQL is a language used to create, query, and manage relational databases.","skillTag":"databases_sql","topic":"databases_sql","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_075","question":"Which SQL command is commonly used to retrieve data from a database?","options":["SELECT","SEND","PING","BOOT"],"answer":"SELECT","explanation":"SELECT retrieves data from one or more database tables.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_076","question":"Which SQL command is commonly used to add new data to a table?","options":["INSERT","TRACE","COMPILE","SCAN"],"answer":"INSERT","explanation":"INSERT adds new rows of data to a database table.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_077","question":"What is SQL injection?","options":["An attack that inserts malicious SQL into an input field","A method for charging a laptop","A way to increase screen size","A type of wireless antenna"],"answer":"An attack that inserts malicious SQL into an input field","explanation":"SQL injection tries to manipulate database queries through unsafe user input.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_078","question":"What is a database table made of?","options":["Rows and columns","Cables and ports","Fans and heat sinks","Pixels and frames"],"answer":"Rows and columns","explanation":"A database table stores data in rows and columns.","skillTag":"databases_sql","topic":"databases_sql","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_079","question":"What is a primary key in a database?","options":["A field that uniquely identifies each record","A password used for Wi-Fi","A cable that connects a printer","A backup file extension"],"answer":"A field that uniquely identifies each record","explanation":"A primary key uniquely identifies each row in a database table.","skillTag":"databases_sql","topic":"databases_sql","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_080","question":"What is a Boolean value?","options":["A true or false value","A type of monitor cable","A compressed image file","A wireless signal strength number only"],"answer":"A true or false value","explanation":"A Boolean has one of two values, usually true or false.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_081","question":"In programming, what is a variable?","options":["A named storage location for data","A physical computer fan","A network switch port","A type of malware only"],"answer":"A named storage location for data","explanation":"A variable stores a value that a program can use or change.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_082","question":"What does an if statement do in programming?","options":["Runs code only when a condition is true","Deletes the operating system","Creates a network cable","Turns off the CPU"],"answer":"Runs code only when a condition is true","explanation":"An if statement controls program flow by checking a condition.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_083","question":"What is a loop used for in programming?","options":["Repeating a block of code","Cooling the processor","Encrypting a hard drive only","Assigning a MAC address"],"answer":"Repeating a block of code","explanation":"A loop repeats instructions until a condition is met or a set number of repetitions is complete.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_084","question":"What is an array?","options":["A collection of values stored under one name","A physical keyboard layout only","A type of firewall rule","A network cable tester"],"answer":"A collection of values stored under one name","explanation":"An array stores multiple values in an ordered collection.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_085","question":"What is a function in programming?","options":["A reusable block of code that performs a task","A type of power connector","A temporary network outage","A password attack"],"answer":"A reusable block of code that performs a task","explanation":"A function groups code so it can be reused when needed.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_086","question":"What will the expression 5 + 3 * 2 evaluate to in most programming languages?","options":["11","16","13","10"],"answer":"11","explanation":"Multiplication happens before addition. 3 * 2 is 6, and 5 + 6 is 11.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_087","question":"What does HTML primarily define?","options":["The structure of web page content","The encryption key of a router","The speed of a CPU","The physical layout of a motherboard"],"answer":"The structure of web page content","explanation":"HTML is used to structure text, links, images, headings, and other web page content.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_088","question":"What does CSS primarily control on a web page?","options":["Visual style and layout","Hard drive partitions","Network routing tables","Processor voltage"],"answer":"Visual style and layout","explanation":"CSS controls appearance, including colors, fonts, spacing, and layout.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_089","question":"What is JavaScript commonly used for?","options":["Adding interactivity to web pages","Replacing all computer hardware","Encrypting power cables","Formatting hard drives only"],"answer":"Adding interactivity to web pages","explanation":"JavaScript is commonly used to make web pages interactive and dynamic.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_090","question":"What is virtualization?","options":["Running a simulated computer environment on physical hardware","Physically doubling a CPU","Deleting unused files","Turning a monitor into a router"],"answer":"Running a simulated computer environment on physical hardware","explanation":"Virtualization allows virtual machines to run on a host computer.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_091","question":"What is a hypervisor?","options":["Software or firmware that creates and manages virtual machines","A type of malware scanner only","A high-resolution monitor","A wireless access point"],"answer":"Software or firmware that creates and manages virtual machines","explanation":"A hypervisor allows multiple virtual machines to share physical hardware.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_092","question":"What is cloud computing?","options":["Using remote servers to store, process, or manage data","Using only offline floppy disks","Running software without electricity","Connecting a monitor to a keyboard"],"answer":"Using remote servers to store, process, or manage data","explanation":"Cloud computing provides computing resources over a network, often the internet.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_093","question":"Which cloud model provides virtual machines, storage, and networking resources?","options":["Infrastructure as a Service","Keyboard as a Service","Display as a Service","Cable as a Service"],"answer":"Infrastructure as a Service","explanation":"Infrastructure as a Service, or IaaS, provides basic computing infrastructure such as virtual machines and storage.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_094","question":"What is a client-server model?","options":["A model where clients request services from servers","A model where every device has no network","A model where printers control all computers","A model where users cannot access files"],"answer":"A model where clients request services from servers","explanation":"In a client-server model, client devices request resources or services from servers.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_095","question":"What is bandwidth?","options":["The amount of data that can be transmitted over a connection in a given time","The physical weight of a computer","The number of keys on a keyboard","The brightness of a monitor"],"answer":"The amount of data that can be transmitted over a connection in a given time","explanation":"Bandwidth measures the capacity of a connection to carry data.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_096","question":"What is latency?","options":["Delay before data begins to transfer or respond","The amount of RAM installed","A type of malware","The length of a password"],"answer":"Delay before data begins to transfer or respond","explanation":"Latency is the delay between sending a request and receiving a response.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_097","question":"What does packet loss mean?","options":["Some data packets fail to reach their destination","All files are permanently deleted","A hard drive gains storage space","A monitor loses brightness"],"answer":"Some data packets fail to reach their destination","explanation":"Packet loss occurs when some network packets do not arrive successfully.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_098","question":"Which troubleshooting step should usually come first when a computer has no internet connection?","options":["Check physical connections and Wi-Fi status","Replace the CPU immediately","Delete the operating system","Open the power supply"],"answer":"Check physical connections and Wi-Fi status","explanation":"Basic checks, such as cable connection, Wi-Fi status, and power, should be done before advanced troubleshooting.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_099","question":"A user can access websites by IP address but not by domain name. What is the most likely problem?","options":["DNS problem","Keyboard failure","Monitor failure","Low battery in mouse"],"answer":"DNS problem","explanation":"If IP addresses work but domain names do not, DNS name resolution is likely failing.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_100","question":"A computer receives an IP address starting with 169.254 after trying to connect to a network. What does this often indicate?","options":["The computer could not obtain an address from DHCP","The computer has a public web server","The monitor cable is loose","The keyboard driver is missing"],"answer":"The computer could not obtain an address from DHCP","explanation":"A 169.254 address is commonly self-assigned when a device cannot get an address from a DHCP server.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_real_001","question":"A user receives an email asking them to reset a password through an unfamiliar link. What is the safest first action?","options":["Do not click; verify through an official channel","Click quickly before it expires","Forward it to all coworkers","Enter the old password to test it"],"answer":"Do not click; verify through an official channel","explanation":"Suspicious password-reset links are common phishing tactics. Verify using a trusted site or contact path.","skillTag":"cybersecurity_scenarios","topic":"cybersecurity_scenarios","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_002","question":"A server should allow web traffic but block unnecessary inbound services. Which control is most directly used?","options":["Firewall rule","Spreadsheet formula","Monitor brightness","Keyboard shortcut"],"answer":"Firewall rule","explanation":"Firewall rules control allowed or blocked network traffic.","skillTag":"networking_security","topic":"networking_security","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_003","question":"A user can ping 8.8.8.8 but cannot open websites by name. What is the likely issue?","options":["DNS resolution problem","Bad keyboard","Broken monitor","CPU overheating"],"answer":"DNS resolution problem","explanation":"If IP connectivity works but names fail, DNS is a likely cause.","skillTag":"networking","topic":"networking","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_004","question":"Which password is strongest?","options":["T7!river-Window-92","password123","Aldrin2026","qwerty!!"],"answer":"T7!river-Window-92","explanation":"The strongest choice is longer and includes varied character types without being a common pattern.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_005","question":"A database query uses parameterized input. This mainly helps prevent:","options":["SQL injection","Screen burn-in","Packet loss","Low disk space"],"answer":"SQL injection","explanation":"Parameterized queries separate data from executable SQL logic.","skillTag":"databases_sql","topic":"databases_sql","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_006","question":"A help desk technician should give a user only the permissions needed for the job. This is called:","options":["Least privilege","Load balancing","Overclocking","Defragmentation"],"answer":"Least privilege","explanation":"Least privilege reduces risk by limiting access to what is necessary.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_007","question":"Which port is commonly associated with HTTPS?","options":["443","22","25","53"],"answer":"443","explanation":"HTTPS commonly uses TCP port 443.","skillTag":"networking","topic":"networking","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_008","question":"Which port is commonly associated with SSH?","options":["22","80","110","3389"],"answer":"22","explanation":"SSH commonly uses TCP port 22 for secure remote shell access.","skillTag":"networking","topic":"networking","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_009","question":"A system log shows repeated failed login attempts from one source. What is the most likely concern?","options":["Brute-force attempt","Normal screen refresh","Printer calibration","Memory upgrade"],"answer":"Brute-force attempt","explanation":"Repeated failed logins can indicate someone is trying many password guesses.","skillTag":"cybersecurity_scenarios","topic":"cybersecurity_scenarios","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_010","question":"What is multi-factor authentication?","options":["Using two or more different proof types to verify identity","Using the same password twice","Logging in without credentials","Changing the monitor cable"],"answer":"Using two or more different proof types to verify identity","explanation":"MFA combines factors such as something you know, have, or are.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_011","question":"In incident response, what should usually happen before wiping an affected system?","options":["Preserve relevant evidence and follow procedure","Post details publicly","Ignore the alert","Delete all logs first"],"answer":"Preserve relevant evidence and follow procedure","explanation":"Evidence and logs may be needed to understand the incident. Follow the organization's response process.","skillTag":"incident_response","topic":"incident_response","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_012","question":"A file extension changes unexpectedly and a ransom note appears. This suggests:","options":["Ransomware","Normal patching","DNS caching","A clean backup"],"answer":"Ransomware","explanation":"Ransomware often encrypts files and demands payment for recovery.","skillTag":"cybersecurity_scenarios","topic":"cybersecurity_scenarios","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_013","question":"Which backup approach is safest against local hardware failure?","options":["Keep a separate backup copy off the device","Store the only copy on the same drive","Rename the file only","Empty the recycle bin"],"answer":"Keep a separate backup copy off the device","explanation":"A separate backup protects against drive failure or local damage.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_014","question":"What does authentication verify?","options":["Who the user is","What permissions the user has after login","How fast the CPU runs","Whether the screen is bright"],"answer":"Who the user is","explanation":"Authentication verifies identity. Authorization determines allowed access.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_015","question":"What does authorization determine?","options":["What an authenticated user is allowed to access","Whether a password is typed correctly","Whether a cable is copper","How much RAM is installed"],"answer":"What an authenticated user is allowed to access","explanation":"Authorization controls permissions after identity is established.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_016","question":"A device receives address 169.254.x.x. What most likely failed?","options":["DHCP address assignment","Monitor refresh rate","SQL indexing","Password complexity"],"answer":"DHCP address assignment","explanation":"169.254.x.x is commonly an automatic private address when DHCP fails.","skillTag":"networking","topic":"networking","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_017","question":"Which command would commonly test connectivity to a host?","options":["ping","mkdir","chmod","format"],"answer":"ping","explanation":"Ping sends ICMP echo requests to test reachability.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_018","question":"Which command can show network path hops on Windows?","options":["tracert","copy","rename","notepad"],"answer":"tracert","explanation":"tracert shows the route packets take to a destination.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_019","question":"In cloud computing, the shared responsibility model means:","options":["Security duties are split between provider and customer","The provider handles every customer task","The customer handles physical data center power","No one is responsible for data"],"answer":"Security duties are split between provider and customer","explanation":"Cloud providers and customers each own different security responsibilities.","skillTag":"cloud_fundamentals","topic":"cloud_fundamentals","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_020","question":"A company wants to reduce damage if one password is stolen. Which control helps most?","options":["Multi-factor authentication","Lower screen brightness","Larger monitor","More printer paper"],"answer":"Multi-factor authentication","explanation":"MFA can prevent access even if a password is compromised.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_021","question":"A SIEM is mainly used to:","options":["Collect and analyze security logs","Increase CPU clock speed","Physically lock doors only","Format USB drives"],"answer":"Collect and analyze security logs","explanation":"SIEM tools centralize logs and help detect security events.","skillTag":"incident_response","topic":"incident_response","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_022","question":"A subnet mask helps determine:","options":["Which part of an IP address identifies the network","Which monitor is active","Which file is encrypted","Which keyboard language is installed"],"answer":"Which part of an IP address identifies the network","explanation":"Subnet masks separate network and host portions of an IP address.","skillTag":"networking","topic":"networking","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_023","question":"A user reports a slow computer after installing unknown software. What is a reasonable first security step?","options":["Disconnect or isolate if compromise is suspected, then scan according to procedure","Give the software administrator rights","Disable all logs","Share the software installer"],"answer":"Disconnect or isolate if compromise is suspected, then scan according to procedure","explanation":"Isolation can prevent spread while investigation and scanning occur.","skillTag":"incident_response","topic":"incident_response","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_024","question":"Which is an example of personally identifiable information?","options":["Social Security number","CPU temperature","Screen resolution","Default gateway only"],"answer":"Social Security number","explanation":"A Social Security number can identify a person and must be protected.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_025","question":"A hash is commonly used to:","options":["Verify data integrity","Increase monitor size","Assign an IP by DHCP","Cool the CPU"],"answer":"Verify data integrity","explanation":"Hashes produce a fixed output that changes when the input data changes.","skillTag":"security_basics","topic":"security_basics","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_026","question":"Encryption mainly protects data by:","options":["Making it unreadable without the proper key","Deleting all copies","Increasing file size only","Changing file ownership only"],"answer":"Making it unreadable without the proper key","explanation":"Encryption transforms data so unauthorized users cannot read it without the key.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_027","question":"A vulnerability is best described as:","options":["A weakness that could be exploited","A confirmed attack only","A backup file","A successful login"],"answer":"A weakness that could be exploited","explanation":"A vulnerability is a weakness that a threat could exploit.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_028","question":"A patch is commonly applied to:","options":["Fix bugs or security vulnerabilities","Create a monitor cable","Make a password shorter","Erase all backups"],"answer":"Fix bugs or security vulnerabilities","explanation":"Patches update software to correct problems or reduce risk.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_029","question":"Which is the best example of phishing?","options":["A fake email impersonating a bank to steal login details","A fan cooling a CPU","A file copied to a backup drive","A printer running out of paper"],"answer":"A fake email impersonating a bank to steal login details","explanation":"Phishing uses deception to steal information or trigger unsafe actions.","skillTag":"cybersecurity_scenarios","topic":"cybersecurity_scenarios","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ictl_real_030","question":"If a user should not install unauthorized software, the policy is mainly trying to reduce:","options":["Malware and configuration risk","Keyboard wear","Screen glare","Mouse speed"],"answer":"Malware and configuration risk","explanation":"Unauthorized software may introduce malware, licensing problems, or unstable configurations.","skillTag":"security_basics","topic":"security_basics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"}]};

const STORAGE_KEY = 'asvab_ictl_trainer_progress_v2';
function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveProgress(history){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-25))); }
  catch(e){}
}
function clearSavedProgress(){
  const history = loadProgress();
  if(!history.length){ alert('No saved progress records to clear.'); return; }
  if(confirm('Clear all saved progress records on this browser? This cannot be undone.')){
    localStorage.removeItem(STORAGE_KEY);
    renderHome();
  }
}
function summarizeSession(){
  const totalCorrect = state.results.reduce((s,r)=>s+r.correct,0);
  const totalQs = state.results.reduce((s,r)=>s+r.total,0);
  const totalOvertime = state.results.reduce((s,r)=>s+r.overtime,0);
  return {
    date:new Date().toISOString(),
    modeName:state.modeName,
    totalCorrect,
    totalQs,
    accuracy:percent(totalCorrect,totalQs),
    overtime:totalOvertime,
    categories:state.results.map(r=>({category:r.category, correct:r.correct, total:r.total, accuracy:percent(r.correct,r.total), overtime:r.overtime}))

function shuffleArray(array){

  const minutes = Math.max(5, Math.ceil(questions.length * 1.25));
