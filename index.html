s","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_084","question":"Simplify: x to the 6th power divided by x squared.","options":["x2","x3","x4","x8"],"answer":"x4","explanation":"When dividing powers with the same base, subtract the exponents. 6 - 2 = 4.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_085","question":"What is any nonzero number raised to the 0 power?","options":["0","1","The same number","Undefined"],"answer":"1","explanation":"Any nonzero number raised to the 0 power equals 1.","skillTag":"exponents_roots","topic":"exponents_roots","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_086","question":"What is the absolute value of -12?","options":["-12","-6","0","12"],"answer":"12","explanation":"Absolute value is distance from zero. The distance of -12 from zero is 12.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_087","question":"Which number is the largest?","options":["-3","-1","0","-5"],"answer":"0","explanation":"Zero is greater than all negative numbers listed.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_088","question":"What is -6 + 14?","options":["-20","-8","8","20"],"answer":"8","explanation":"Starting at -6 and adding 14 gives 8.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_089","question":"What is -4 x 7?","options":["-28","-11","11","28"],"answer":"-28","explanation":"A negative number times a positive number is negative. 4 x 7 = 28, so the answer is -28.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_090","question":"What is -24 divided by -6?","options":["-6","-4","4","6"],"answer":"4","explanation":"A negative number divided by a negative number is positive. 24 divided by 6 equals 4.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_091","question":"What is the reciprocal of 5?","options":["-5","1/5","5/1","0"],"answer":"1/5","explanation":"The reciprocal of a number is 1 divided by that number. The reciprocal of 5 is 1/5.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_092","question":"What is the reciprocal of 3/7?","options":["3/7","7/3","-3/7","10/7"],"answer":"7/3","explanation":"To find the reciprocal of a fraction, switch the numerator and denominator. The reciprocal of 3/7 is 7/3.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_093","question":"What is 2.5 + 3.75?","options":["5.25","6.00","6.25","6.75"],"answer":"6.25","explanation":"Add the decimals: 2.50 + 3.75 = 6.25.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_094","question":"What is 7.2 - 4.8?","options":["1.6","2.2","2.4","3.4"],"answer":"2.4","explanation":"Subtract 4.8 from 7.2. The result is 2.4.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_095","question":"What is 0.4 x 0.5?","options":["0.02","0.2","2.0","20"],"answer":"0.2","explanation":"4 x 5 = 20, and there are two decimal places total, so the answer is 0.20, or 0.2.","skillTag":"fractions_decimals_percents","topic":"fractions_decimals_percents","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_096","question":"What is 6.4 divided by 0.8?","options":["0.8","4","8","12"],"answer":"8","explanation":"6.4 divided by 0.8 equals 8 because 0.8 x 8 = 6.4.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_097","question":"What is 1 kilometer equal to in meters?","options":["10 meters","100 meters","1,000 meters","10,000 meters"],"answer":"1,000 meters","explanation":"One kilometer equals 1,000 meters.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_098","question":"What is 1 meter equal to in centimeters?","options":["10 centimeters","100 centimeters","1,000 centimeters","10,000 centimeters"],"answer":"100 centimeters","explanation":"One meter equals 100 centimeters.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_099","question":"How many inches are in 3 feet?","options":["12 inches","24 inches","36 inches","48 inches"],"answer":"36 inches","explanation":"There are 12 inches in 1 foot. 3 x 12 = 36 inches.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_mk_100","question":"How many ounces are in 2 pounds?","options":["16 ounces","24 ounces","32 ounces","40 ounces"],"answer":"32 ounces","explanation":"There are 16 ounces in 1 pound. 2 x 16 = 32 ounces.","skillTag":"arithmetic_basics","topic":"arithmetic_basics","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"afqt_mk_real_001","question":"Simplify: 3(2x - 5) + 4x","options":["10x - 15","6x - 1","10x + 15","2x - 15"],"answer":"10x - 15","explanation":"Distribute first: 3(2x - 5) = 6x - 15. Then add 4x to get 10x - 15.","difficulty":"medium","skillTag":"algebra_simplify","afqtRelevant":true,"realismTier":"asvab_style","topic":"algebra_simplify"},{"id":"afqt_mk_real_002","question":"Solve for x: 4x + 7 = 31","options":["5","6","7","8"],"answer":"6","explanation":"Subtract 7 from both sides: 4x = 24. Divide by 4, so x = 6.","difficulty":"medium","skillTag":"linear_equations","afqtRelevant":true,"realismTier":"asvab_style","topic":"linear_equations"},{"id":"afqt_mk_real_003","question":"Solve for y: 3y - 8 = 2y + 11","options":["11","17","19","21"],"answer":"19","explanation":"Subtract 2y from both sides: y - 8 = 11. Add 8, so y = 19.","difficulty":"medium","skillTag":"linear_equations","afqtRelevant":true,"realismTier":"asvab_style","topic":"linear_equations"},{"id":"afqt_mk_real_004","question":"What is the value of 2^4 + 3^2?","options":["17","20","25","34"],"answer":"25","explanation":"2^4 = 16 and 3^2 = 9. Add them: 16 + 9 = 25.","difficulty":"medium","skillTag":"exponents","afqtRelevant":true,"realismTier":"asvab_style","topic":"exponents"},{"id":"afqt_mk_real_005","question":"Simplify: x^3 · x^4","options":["x^7","x^12","2x^7","x"],"answer":"x^7","explanation":"When multiplying powers with the same base, add the exponents: 3 + 4 = 7.","difficulty":"medium","skillTag":"exponent_rules","afqtRelevant":true,"realismTier":"asvab_style","topic":"exponent_rules"},{"id":"afqt_mk_real_006","question":"Simplify: (a^5)/(a^2), where a is not zero.","options":["a^3","a^7","a^10","1/a^3"],"answer":"a^3","explanation":"When dividing powers with the same base, subtract exponents: 5 - 2 = 3.","difficulty":"medium","skillTag":"exponent_rules","afqtRelevant":true,"realismTier":"asvab_style","topic":"exponent_rules"},{"id":"afqt_mk_real_007","question":"What is the square root of 196?","options":["12","13","14","16"],"answer":"14","explanation":"14 × 14 = 196, so the square root of 196 is 14.","difficulty":"medium","skillTag":"radicals","afqtRelevant":true,"realismTier":"asvab_style","topic":"radicals"},{"id":"afqt_mk_real_008","question":"Simplify: √50","options":["5√2","25√2","10√5","2√25"],"answer":"5√2","explanation":"50 = 25 × 2. The square root of 25 is 5, so √50 = 5√2.","difficulty":"hard","skillTag":"radicals","afqtRelevant":true,"realismTier":"asvab_style","topic":"radicals"},{"id":"afqt_mk_real_009","question":"What is 3/4 + 2/3?","options":["5/7","17/12","13/12","5/12"],"answer":"17/12","explanation":"Use common denominator 12: 3/4 = 9/12 and 2/3 = 8/12. Add to get 17/12.","difficulty":"medium","skillTag":"fractions","afqtRelevant":true,"realismTier":"asvab_style","topic":"fractions"},{"id":"afqt_mk_real_010","question":"What is 5/6 - 1/4?","options":["7/12","2/3","3/10","4/2"],"answer":"7/12","explanation":"Use common denominator 12: 5/6 = 10/12 and 1/4 = 3/12. Subtract to get 7/12.","difficulty":"medium","skillTag":"fractions","afqtRelevant":true,"realismTier":"asvab_style","topic":"fractions"},{"id":"afqt_mk_real_011","question":"What is 2/5 divided by 3/10?","options":["4/3","3/4","1/5","5/6"],"answer":"4/3","explanation":"Divide by multiplying by the reciprocal: 2/5 × 10/3 = 20/15 = 4/3.","difficulty":"hard","skillTag":"fractions","afqtRelevant":true,"realismTier":"asvab_style","topic":"fractions"},{"id":"afqt_mk_real_012","question":"Which decimal is equal to 7/8?","options":["0.625","0.75","0.875","0.925"],"answer":"0.875","explanation":"7 divided by 8 equals 0.875.","difficulty":"medium","skillTag":"decimal_conversion","afqtRelevant":true,"realismTier":"asvab_style","topic":"decimal_conversion"},{"id":"afqt_mk_real_013","question":"Convert 0.032 to a percent.","options":["0.32%","3.2%","32%","320%"],"answer":"3.2%","explanation":"Multiply the decimal by 100 to convert to percent: 0.032 × 100 = 3.2%.","difficulty":"medium","skillTag":"percent_conversion","afqtRelevant":true,"realismTier":"asvab_style","topic":"percent_conversion"},{"id":"afqt_mk_real_014","question":"What is 18% of 250?","options":["35","40","45","50"],"answer":"45","explanation":"18% = 0.18. Multiply 0.18 × 250 = 45.","difficulty":"medium","skillTag":"percent","afqtRelevant":true,"realismTier":"asvab_style","topic":"percent"},{"id":"afqt_mk_real_015","question":"A number is increased from 40 to 50. What is the percent increase?","options":["10%","20%","25%","30%"],"answer":"25%","explanation":"The increase is 10. Divide by the original 40: 10/40 = 0.25, or 25%.","difficulty":"hard","skillTag":"percent_change","afqtRelevant":true,"realismTier":"asvab_style","topic":"percent_change"},{"id":"afqt_mk_real_016","question":"If 5 pencils cost $3.75, what is the cost of one pencil?","options":["$0.65","$0.70","$0.75","$0.80"],"answer":"$0.75","explanation":"Divide total cost by quantity: $3.75 ÷ 5 = $0.75.","difficulty":"medium","skillTag":"unit_rate","afqtRelevant":true,"realismTier":"asvab_style","topic":"unit_rate"},{"id":"afqt_mk_real_017","question":"Solve the proportion: 3/5 = x/20","options":["8","10","12","15"],"answer":"12","explanation":"Since 5 × 4 = 20, multiply 3 by 4 to get x = 12.","difficulty":"medium","skillTag":"proportions","afqtRelevant":true,"realismTier":"asvab_style","topic":"proportions"},{"id":"afqt_mk_real_018","question":"The ratio of red to blue marbles is 4:7. If there are 33 marbles total, how many are blue?","options":["12","18","21","28"],"answer":"21","explanation":"There are 11 total ratio parts. 33 ÷ 11 = 3 per part. Blue is 7 parts, so 7 × 3 = 21.","difficulty":"medium","skillTag":"ratios","afqtRelevant":true,"realismTier":"asvab_style","topic":"ratios"},{"id":"afqt_mk_real_019","question":"What is the area of a triangle with base 12 inches and height 9 inches?","options":["21 square inches","54 square inches","72 square inches","108 square inches"],"answer":"54 square inches","explanation":"Triangle area = 1/2 × base × height. 1/2 × 12 × 9 = 54.","difficulty":"medium","skillTag":"geometry_area","afqtRelevant":true,"realismTier":"asvab_style","topic":"geometry_area"},{"id":"afqt_mk_real_020","question":"What is the circumference of a circle with radius 6? Use π = 3.14.","options":["18.84","37.68","75.36","113.04"],"answer":"37.68","explanation":"Circumference = 2πr. 2 × 3.14 × 6 = 37.68.","difficulty":"medium","skillTag":"circle_geometry","afqtRelevant":true,"realismTier":"asvab_style","topic":"circle_geometry"},{"id":"afqt_mk_real_021","question":"A rectangle has length 14 and width 5. What is its perimeter?","options":["19","38","70","98"],"answer":"38","explanation":"Perimeter = 2l + 2w = 2(14) + 2(5) = 28 + 10 = 38.","difficulty":"medium","skillTag":"geometry_perimeter","afqtRelevant":true,"realismTier":"asvab_style","topic":"geometry_perimeter"},{"id":"afqt_mk_real_022","question":"A right triangle has legs of 9 and 12. What is the length of the hypotenuse?","options":["13","15","18","21"],"answer":"15","explanation":"Use the Pythagorean theorem: 9^2 + 12^2 = 81 + 144 = 225. √225 = 15.","difficulty":"medium","skillTag":"pythagorean_theorem","afqtRelevant":true,"realismTier":"asvab_style","topic":"pythagorean_theorem"},{"id":"afqt_mk_real_023","question":"What is the volume of a rectangular box that is 8 inches long, 5 inches wide, and 3 inches high?","options":["16 cubic inches","40 cubic inches","120 cubic inches","160 cubic inches"],"answer":"120 cubic inches","explanation":"Volume = length × width × height = 8 × 5 × 3 = 120.","difficulty":"medium","skillTag":"volume","afqtRelevant":true,"realismTier":"asvab_style","topic":"volume"},{"id":"afqt_mk_real_024","question":"What is the slope of the line through points (2, 3) and (6, 11)?","options":["1","2","4","8"],"answer":"2","explanation":"Slope = change in y divided by change in x: (11 - 3)/(6 - 2) = 8/4 = 2.","difficulty":"hard","skillTag":"slope","afqtRelevant":true,"realismTier":"asvab_style","topic":"slope"},{"id":"afqt_mk_real_025","question":"Which equation has a slope of 3 and a y-intercept of -2?","options":["y = 3x - 2","y = -2x + 3","y = x - 2","y = 2x - 3"],"answer":"y = 3x - 2","explanation":"Slope-intercept form is y = mx + b, where m is slope and b is y-intercept.","difficulty":"hard","skillTag":"slope_intercept","afqtRelevant":true,"realismTier":"asvab_style","topic":"slope_intercept"},{"id":"afqt_mk_real_026","question":"What is the value of 6 + 3 × 4?","options":["24","18","16","15"],"answer":"18","explanation":"Use order of operations: multiply first, 3 × 4 = 12, then add 6 to get 18.","difficulty":"medium","skillTag":"order_of_operations","afqtRelevant":true,"realismTier":"asvab_style","topic":"order_of_operations"},{"id":"afqt_mk_real_027","question":"What is the value of (18 - 6) ÷ 3 + 4?","options":["6","8","10","12"],"answer":"8","explanation":"Parentheses first: 18 - 6 = 12. Then 12 ÷ 3 = 4. Add 4 to get 8.","difficulty":"medium","skillTag":"order_of_operations","afqtRelevant":true,"realismTier":"asvab_style","topic":"order_of_operations"},{"id":"afqt_mk_real_028","question":"Factor: x^2 + 7x + 12","options":["(x + 3)(x + 4)","(x + 2)(x + 6)","(x - 3)(x - 4)","(x + 1)(x + 12)"],"answer":"(x + 3)(x + 4)","explanation":"Find two numbers that multiply to 12 and add to 7. Those numbers are 3 and 4.","difficulty":"hard","skillTag":"factoring","afqtRelevant":true,"realismTier":"asvab_style","topic":"factoring"},{"id":"afqt_mk_real_029","question":"Expand: (x + 5)(x - 2)","options":["x^2 + 3x - 10","x^2 - 7x - 10","x^2 + 7x + 10","x^2 - 3x + 10"],"answer":"x^2 + 3x - 10","explanation":"Multiply each part: x^2 - 2x + 5x - 10 = x^2 + 3x - 10.","difficulty":"hard","skillTag":"expanding_binomials","afqtRelevant":true,"realismTier":"asvab_style","topic":"expanding_binomials"},{"id":"afqt_mk_real_030","question":"If 2x/3 = 10, what is x?","options":["10","12","15","30"],"answer":"15","explanation":"Multiply both sides by 3: 2x = 30. Divide by 2, so x = 15.","difficulty":"medium","skillTag":"linear_equations","afqtRelevant":true,"realismTier":"asvab_style","topic":"linear_equations"},{"id":"afqt_mk_real_031","question":"What is the median of 8, 12, 5, 20, and 15?","options":["8","12","15","20"],"answer":"12","explanation":"Put the numbers in order: 5, 8, 12, 15, 20. The middle value is 12.","difficulty":"medium","skillTag":"statistics","afqtRelevant":true,"realismTier":"asvab_style","topic":"statistics"},{"id":"afqt_mk_real_032","question":"What is the mean of 6, 10, 14, and 18?","options":["10","11","12","13"],"answer":"12","explanation":"Add the values: 6 + 10 + 14 + 18 = 48. Divide by 4 to get 12.","difficulty":"medium","skillTag":"statistics","afqtRelevant":true,"realismTier":"asvab_style","topic":"statistics"},{"id":"afqt_mk_real_033","question":"A bag contains 5 red, 3 blue, and 2 green balls. What is the probability of randomly selecting a blue ball?","options":["1/5","3/10","1/2","3/7"],"answer":"3/10","explanation":"There are 10 total balls and 3 are blue, so the probability is 3/10.","difficulty":"medium","skillTag":"probability","afqtRelevant":true,"realismTier":"asvab_style","topic":"probability"},{"id":"afqt_mk_real_034","question":"If an angle measures 37 degrees, what is its complementary angle?","options":["37 degrees","53 degrees","90 degrees","143 degrees"],"answer":"53 degrees","explanation":"Complementary angles add to 90 degrees. 90 - 37 = 53 degrees.","difficulty":"medium","skillTag":"angles","afqtRelevant":true,"realismTier":"asvab_style","topic":"angles"},{"id":"afqt_mk_real_035","question":"If two supplementary angles are 5x and 4x degrees, what is x?","options":["10","20","30","40"],"answer":"20","explanation":"Supplementary angles add to 180 degrees. 5x + 4x = 180, so 9x = 180 and x = 20.","difficulty":"hard","skillTag":"angles","afqtRelevant":true,"realismTier":"asvab_style","topic":"angles"},{"id":"afqt_mk_real_036","question":"What is the value of |-9| + |-4|?","options":["-13","-5","5","13"],"answer":"13","explanation":"Absolute value is distance from zero. |-9| = 9 and |-4| = 4, so the sum is 13.","difficulty":"medium","skillTag":"absolute_value","afqtRelevant":true,"realismTier":"asvab_style","topic":"absolute_value"},{"id":"afqt_mk_real_037","question":"Which number is the greatest?","options":["0.6","5/8","0.58","3/5"],"answer":"5/8","explanation":"Convert to decimals: 0.6 = 0.60, 5/8 = 0.625, 0.58 = 0.58, and 3/5 = 0.60. The greatest is 0.625.","difficulty":"hard","skillTag":"number_comparison","afqtRelevant":true,"realismTier":"asvab_style","topic":"number_comparison"},{"id":"afqt_mk_real_038","question":"What is 4.8 ÷ 0.6?","options":["0.8","8","80","2.88"],"answer":"8","explanation":"Move the decimal one place in both numbers: 48 ÷ 6 = 8.","difficulty":"medium","skillTag":"decimal_operations","afqtRelevant":true,"realismTier":"asvab_style","topic":"decimal_operations"},{"id":"afqt_mk_real_039","question":"Simplify: 0.25 × 0.4","options":["0.01","0.1","1.0","10"],"answer":"0.1","explanation":"25 hundredths times 4 tenths equals 100 thousandths, which is 0.100 or 0.1.","difficulty":"medium","skillTag":"decimal_operations","afqtRelevant":true,"realismTier":"asvab_style","topic":"decimal_operations"},{"id":"afqt_mk_real_040","question":"If x = -3, what is the value of x^2 - 2x?","options":["3","9","15","-15"],"answer":"15","explanation":"Substitute -3: (-3)^2 - 2(-3) = 9 + 6 = 15.","difficulty":"hard","skillTag":"evaluate_expressions","afqtRelevant":true,"realismTier":"asvab_style","topic":"evaluate_expressions"},{"id":"afqt_mk_real_041","question":"Which expression represents 'five less than twice a number n'?","options":["2n - 5","5 - 2n","2(n - 5)","5n - 2"],"answer":"2n - 5","explanation":"Twice a number is 2n. Five less than that is 2n - 5.","difficulty":"medium","skillTag":"translate_expression","afqtRelevant":true,"realismTier":"asvab_style","topic":"translate_expression"},{"id":"afqt_mk_real_042","question":"Solve: 2(x + 4) = 18","options":["5","7","9","13"],"answer":"5","explanation":"Divide both sides by 2: x + 4 = 9. Subtract 4, so x = 5.","difficulty":"medium","skillTag":"linear_equations","afqtRelevant":true,"realismTier":"asvab_style","topic":"linear_equations"},{"id":"afqt_mk_real_043","question":"If 3x - 2 < 10, which inequality gives x?","options":["x < 4","x > 4","x < 8/3","x > 8/3"],"answer":"x < 4","explanation":"Add 2 to both sides: 3x < 12. Divide by 3, so x < 4.","difficulty":"hard","skillTag":"inequalities","afqtRelevant":true,"realismTier":"asvab_style","topic":"inequalities"},{"id":"afqt_mk_real_044","question":"What is the greatest common factor of 36 and 60?","options":["6","9","12","18"],"answer":"12","explanation":"36 = 2 × 2 × 3 × 3 and 60 = 2 × 2 × 3 × 5. The common product is 12.","difficulty":"medium","skillTag":"factors_multiples","afqtRelevant":true,"realismTier":"asvab_style","topic":"factors_multiples"},{"id":"afqt_mk_real_045","question":"What is the least common multiple of 8 and 12?","options":["16","20","24","96"],"answer":"24","explanation":"Multiples of 8 include 8, 16, 24. Multiples of 12 include 12, 24. The least common multiple is 24.","difficulty":"medium","skillTag":"factors_multiples","afqtRelevant":true,"realismTier":"asvab_style","topic":"factors_multiples"},{"id":"afqt_mk_real_046","question":"A square has an area of 81 square inches. What is the length of one side?","options":["8 inches","9 inches","18 inches","40.5 inches"],"answer":"9 inches","explanation":"Area of a square is side squared. Since 9 × 9 = 81, each side is 9 inches.","difficulty":"medium","skillTag":"geometry_area","afqtRelevant":true,"realismTier":"asvab_style","topic":"geometry_area"},{"id":"afqt_mk_real_047","question":"A cylinder has radius 3 and height 10. What is its volume? Use π = 3.14.","options":["94.2","188.4","282.6","314"],"answer":"282.6","explanation":"Cylinder volume = πr^2h. 3.14 × 3^2 × 10 = 3.14 × 9 × 10 = 282.6.","difficulty":"hard","skillTag":"volume","afqtRelevant":true,"realismTier":"asvab_style","topic":"volume"},{"id":"afqt_mk_real_048","question":"What is the distance between points (1, 2) and (4, 6)?","options":["3","4","5","7"],"answer":"5","explanation":"The horizontal change is 3 and the vertical change is 4. A 3-4-5 right triangle has distance 5.","difficulty":"hard","skillTag":"coordinate_geometry","afqtRelevant":true,"realismTier":"asvab_style","topic":"coordinate_geometry"},{"id":"afqt_mk_real_049","question":"If f(x) = 2x + 7, what is f(5)?","options":["10","12","17","19"],"answer":"17","explanation":"Substitute 5 for x: f(5) = 2(5) + 7 = 10 + 7 = 17.","difficulty":"medium","skillTag":"functions","afqtRelevant":true,"realismTier":"asvab_style","topic":"functions"},{"id":"afqt_mk_real_050","question":"Which value satisfies the equation x/4 + 3 = 9?","options":["12","18","24","36"],"answer":"24","explanation":"Subtract 3 from both sides: x/4 = 6. Multiply by 4, so x = 24.","difficulty":"medium","skillTag":"linear_equations","afqtRelevant":true,"realismTier":"asvab_style","topic":"linear_equations"}],"Electronics Information (EI)":[{"id":"asvab_ei_001","question":"What is electric current?","options":["The flow of electric charge","The opposition to motion","The amount of stored heat","The brightness of a lamp"],"answer":"The flow of electric charge","explanation":"Electric current is the movement of electric charge, usually electrons, through a conductor.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_002","question":"What unit is used to measure electric current?","options":["Volt","Ampere","Ohm","Watt"],"answer":"Ampere","explanation":"Current is measured in amperes, often shortened to amps.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_003","question":"What does voltage measure?","options":["Electrical pressure or potential difference","The weight of a wire","The speed of sound","The temperature of a circuit"],"answer":"Electrical pressure or potential difference","explanation":"Voltage is the electrical pressure that pushes current through a circuit.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_004","question":"What unit is used to measure resistance?","options":["Ampere","Volt","Ohm","Farad"],"answer":"Ohm","explanation":"Resistance is measured in ohms. Resistance opposes the flow of current.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_005","question":"Which equation represents Ohm's law?","options":["V = IR","P = I/R","R = VI","I = VR"],"answer":"V = IR","explanation":"Ohm's law states that voltage equals current multiplied by resistance.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_006","question":"A circuit has 12 volts and 4 ohms of resistance. What is the current?","options":["2 amps","3 amps","4 amps","8 amps"],"answer":"3 amps","explanation":"Use I = V/R. 12 volts divided by 4 ohms equals 3 amps.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_007","question":"A circuit has 24 volts and 6 amps of current. What is the resistance?","options":["2 ohms","4 ohms","6 ohms","12 ohms"],"answer":"4 ohms","explanation":"Use R = V/I. 24 volts divided by 6 amps equals 4 ohms.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_008","question":"A device uses 120 volts and draws 2 amps. How much power does it use?","options":["60 watts","120 watts","240 watts","360 watts"],"answer":"240 watts","explanation":"Power equals voltage times current. 120 times 2 equals 240 watts.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_009","question":"Which material is usually a good electrical conductor?","options":["Copper","Rubber","Glass","Plastic"],"answer":"Copper","explanation":"Copper is a metal that allows electrons to move easily, making it a good conductor.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_010","question":"Which material is usually a good electrical insulator?","options":["Aluminum","Copper","Rubber","Silver"],"answer":"Rubber","explanation":"Rubber resists the flow of electricity and is often used to insulate wires.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_011","question":"What is an open circuit?","options":["A circuit with a complete path","A circuit with a break in the path","A circuit with no resistance","A circuit with too much voltage only"],"answer":"A circuit with a break in the path","explanation":"An open circuit has a break, so current cannot flow through the circuit.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_012","question":"What is a closed circuit?","options":["A circuit with a complete path for current","A circuit with a broken wire","A circuit with no power source","A circuit with only insulation"],"answer":"A circuit with a complete path for current","explanation":"A closed circuit has a complete path, allowing current to flow.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_013","question":"In a series circuit, what is true about the current?","options":["It is the same through all components","It is zero through every component","It only flows through one branch","It changes direction randomly"],"answer":"It is the same through all components","explanation":"A series circuit has only one path, so the same current flows through each component.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_014","question":"In a parallel circuit, what is true about the voltage across each branch?","options":["It is the same across each branch","It is always zero","It doubles in every branch","It disappears after the first branch"],"answer":"It is the same across each branch","explanation":"In a parallel circuit, each branch is connected across the same voltage source.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_015","question":"What is the total resistance of 3 ohms and 5 ohms connected in series?","options":["1.875 ohms","2 ohms","8 ohms","15 ohms"],"answer":"8 ohms","explanation":"In series, resistances add directly. 3 ohms plus 5 ohms equals 8 ohms.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_016","question":"Two 6-ohm resistors are connected in parallel. What is the total resistance?","options":["3 ohms","6 ohms","9 ohms","12 ohms"],"answer":"3 ohms","explanation":"Two equal resistors in parallel have half the resistance of one resistor. Half of 6 ohms is 3 ohms.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_017","question":"What does a fuse do in a circuit?","options":["Stores electrical charge","Protects the circuit by melting when current is too high","Changes AC into DC","Increases resistance automatically"],"answer":"Protects the circuit by melting when current is too high","explanation":"A fuse opens the circuit when excessive current flows, helping prevent damage or fire.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_018","question":"How is a circuit breaker different from a fuse?","options":["A circuit breaker can usually be reset","A circuit breaker stores energy forever","A circuit breaker has no safety purpose","A circuit breaker only works with batteries"],"answer":"A circuit breaker can usually be reset","explanation":"A fuse must be replaced after it blows, but a circuit breaker can usually be reset.","skillTag":"electrical_safety","topic":"electrical_safety","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_019","question":"What is the purpose of grounding an electrical system?","options":["To provide a safe path for fault current","To increase the color of wires","To remove all voltage from batteries","To make current flow slower in every circuit"],"answer":"To provide a safe path for fault current","explanation":"Grounding gives stray or fault current a safer path to earth, reducing shock risk.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_020","question":"What is a short circuit?","options":["A circuit with a very low-resistance unintended path","A circuit with no source of power","A circuit with only one resistor","A circuit that is physically small"],"answer":"A circuit with a very low-resistance unintended path","explanation":"A short circuit lets current bypass the normal load, often causing very high current.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_021","question":"What does DC stand for?","options":["Direct current","Dual charge","Double circuit","Digital capacitor"],"answer":"Direct current","explanation":"DC means direct current, where current flows in one direction.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_022","question":"What does AC stand for?","options":["Alternating current","Active capacitor","Automatic circuit","Applied charge"],"answer":"Alternating current","explanation":"AC means alternating current, where current changes direction periodically.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_023","question":"Which source commonly provides DC power?","options":["Battery","Household wall outlet","Transformer alone","Antenna"],"answer":"Battery","explanation":"Batteries provide direct current because their polarity stays the same.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_024","question":"What type of current is usually supplied by household wall outlets in the United States?","options":["AC","DC","Static only","Pulsed light"],"answer":"AC","explanation":"Household outlets normally provide alternating current.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_025","question":"What unit is used to measure frequency?","options":["Ohm","Hertz","Farad","Watt"],"answer":"Hertz","explanation":"Frequency is measured in hertz, which means cycles per second.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_026","question":"What is the standard frequency of household AC power in the United States?","options":["30 hertz","50 hertz","60 hertz","120 hertz"],"answer":"60 hertz","explanation":"In the United States, standard household AC power has a frequency of 60 hertz.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_027","question":"What does a capacitor store?","options":["Electric charge","Mechanical force","Sound waves","Fuel"],"answer":"Electric charge","explanation":"A capacitor stores electrical energy as electric charge between its plates.","skillTag":"electronic_components","topic":"electronic_components","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_028","question":"What unit is used to measure capacitance?","options":["Farad","Ohm","Ampere","Henry"],"answer":"Farad","explanation":"Capacitance is measured in farads.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_029","question":"What does an inductor store energy in?","options":["A magnetic field","A glass tube","A chemical solution","A light beam"],"answer":"A magnetic field","explanation":"An inductor stores energy in a magnetic field created by current through a coil.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_030","question":"What unit is used to measure inductance?","options":["Henry","Farad","Watt","Volt"],"answer":"Henry","explanation":"Inductance is measured in henrys.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_031","question":"What does a resistor do?","options":["Limits or controls current","Stores light","Turns sound into fuel","Creates magnetism without current"],"answer":"Limits or controls current","explanation":"A resistor opposes current flow and can limit current in a circuit.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_032","question":"A resistor has color bands red, red, and brown. What is its resistance?","options":["22 ohms","220 ohms","2,200 ohms","22,000 ohms"],"answer":"220 ohms","explanation":"Red is 2, red is 2, and brown means multiply by 10. So the value is 22 times 10, or 220 ohms.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_033","question":"What does a diode normally do?","options":["Allows current to flow mainly in one direction","Stores mechanical energy","Measures wire length","Changes resistance to zero always"],"answer":"Allows current to flow mainly in one direction","explanation":"A diode is a semiconductor device that conducts current mostly in one direction.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_034","question":"What does LED stand for?","options":["Light-emitting diode","Low-energy device","Linear electric detector","Load equalizing diode"],"answer":"Light-emitting diode","explanation":"An LED is a diode that gives off light when current flows through it in the correct direction.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_035","question":"What happens if an LED is connected backward in a simple DC circuit?","options":["It usually will not light","It becomes a battery","It always gets brighter","It changes into a resistor"],"answer":"It usually will not light","explanation":"An LED conducts mainly in one direction, so it usually will not light if reverse-biased.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_036","question":"What is a transistor commonly used for?","options":["Amplifying or switching electronic signals","Storing water","Measuring weight","Insulating a wire only"],"answer":"Amplifying or switching electronic signals","explanation":"Transistors can act as electronic switches or amplifiers.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_037","question":"What are the three terminals of a bipolar junction transistor called?","options":["Base, collector, emitter","Gate, source, drain","Anode, cathode, grid","Input, output, ground"],"answer":"Base, collector, emitter","explanation":"A bipolar junction transistor has three terminals: base, collector, and emitter.","skillTag":"electronic_components","topic":"electronic_components","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_038","question":"What are the three terminals of a field-effect transistor commonly called?","options":["Gate, source, drain","Base, emitter, collector","Anode, cathode, plate","Line, load, neutral"],"answer":"Gate, source, drain","explanation":"A field-effect transistor, or FET, commonly has gate, source, and drain terminals.","skillTag":"electronic_components","topic":"electronic_components","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_039","question":"What does a transformer do?","options":["Changes AC voltage levels","Stores DC forever","Blocks all magnetic fields","Changes copper into rubber"],"answer":"Changes AC voltage levels","explanation":"A transformer uses electromagnetic induction to step AC voltage up or down.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_040","question":"A transformer with more turns on the secondary coil than the primary coil is what type?","options":["Step-up transformer","Step-down transformer","Isolation-free resistor","Shorted capacitor"],"answer":"Step-up transformer","explanation":"More turns on the secondary coil produces a higher secondary voltage, so it is a step-up transformer.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_041","question":"A transformer with fewer turns on the secondary coil than the primary coil is what type?","options":["Step-up transformer","Step-down transformer","Variable resistor","Fixed capacitor"],"answer":"Step-down transformer","explanation":"Fewer secondary turns produce a lower secondary voltage, so it is a step-down transformer.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_042","question":"Why does a basic transformer require changing current?","options":["Changing current creates a changing magnetic field","Changing current removes resistance completely","Changing current turns copper into insulation","Changing current prevents any voltage from forming"],"answer":"Changing current creates a changing magnetic field","explanation":"Transformers depend on a changing magnetic field to induce voltage in the secondary coil.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_043","question":"What device converts AC to DC?","options":["Rectifier","Transformer only","Antenna","Speaker"],"answer":"Rectifier","explanation":"A rectifier uses diodes or similar components to change AC into DC.","skillTag":"electronic_components","topic":"electronic_components","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_044","question":"What does a filter capacitor do in a DC power supply?","options":["Smooths voltage ripple","Increases wire length","Turns DC back into pure AC","Measures resistance directly"],"answer":"Smooths voltage ripple","explanation":"A filter capacitor charges and discharges to reduce variations in the rectified voltage.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_045","question":"What does a voltage regulator do?","options":["Maintains a steady output voltage","Stores radio waves","Cuts wire insulation","Measures mechanical speed only"],"answer":"Maintains a steady output voltage","explanation":"A voltage regulator keeps the output voltage close to a desired value despite changes in load or input.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_046","question":"What does a switch do in a circuit?","options":["Opens or closes the current path","Stores permanent charge","Measures frequency directly","Changes AC into radio waves"],"answer":"Opens or closes the current path","explanation":"A switch controls current by opening or closing the circuit.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_047","question":"What does SPST stand for?","options":["Single pole single throw","Single power safety terminal","Series parallel switching transformer","Simple phase signal tester"],"answer":"Single pole single throw","explanation":"SPST means single pole single throw, which is a basic on-off switch.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_048","question":"What does a relay use to open or close contacts?","options":["An electromagnet","A glass insulator only","A fuel pump","A permanent flame"],"answer":"An electromagnet","explanation":"A relay uses an electromagnet to move contacts and control another circuit.","skillTag":"electronic_components","topic":"electronic_components","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_049","question":"What is an electromagnet?","options":["A magnet produced by electric current","A resistor with no terminals","A wire that cannot conduct","A permanent plastic magnet"],"answer":"A magnet produced by electric current","explanation":"An electromagnet creates a magnetic field when current flows through a coil.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_050","question":"What happens to the magnetic field of an electromagnet if the current increases?","options":["The magnetic field becomes stronger","The magnetic field disappears instantly","The magnetic field becomes unrelated to current","The coil turns into an insulator"],"answer":"The magnetic field becomes stronger","explanation":"Increasing current through a coil generally increases the strength of the magnetic field.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_051","question":"What is the purpose of a solenoid?","options":["To convert electrical energy into linear motion","To store fuel","To measure humidity","To prevent all current flow"],"answer":"To convert electrical energy into linear motion","explanation":"A solenoid uses a coil to create motion, often pulling or pushing a metal plunger.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_052","question":"What does an electric motor do?","options":["Converts electrical energy into mechanical motion","Converts rubber into copper","Stores voltage with no current","Measures resistance only"],"answer":"Converts electrical energy into mechanical motion","explanation":"An electric motor uses magnetic forces to turn electrical energy into motion.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_053","question":"What does a generator do?","options":["Converts mechanical motion into electrical energy","Stores only static charge","Blocks all current","Measures sound only"],"answer":"Converts mechanical motion into electrical energy","explanation":"A generator uses motion and magnetic fields to produce electricity.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_054","question":"What is electromagnetic induction?","options":["Producing voltage with a changing magnetic field","Producing water with a resistor","Blocking current with copper","Removing magnetism from all metals"],"answer":"Producing voltage with a changing magnetic field","explanation":"Electromagnetic induction occurs when a changing magnetic field causes voltage in a conductor.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_055","question":"What is the purpose of a commutator in a DC motor?","options":["To reverse current direction in the armature at the proper time","To store charge like a capacitor","To lower temperature only","To act as a fuse"],"answer":"To reverse current direction in the armature at the proper time","explanation":"The commutator helps keep the motor spinning in one direction by reversing current at the right points.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_056","question":"What is the purpose of brushes in many DC motors?","options":["To transfer current to the rotating commutator","To clean dust from the motor case only","To store mechanical energy","To reduce voltage to zero"],"answer":"To transfer current to the rotating commutator","explanation":"Brushes provide electrical contact between the stationary circuit and the rotating commutator.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_057","question":"What instrument is used to measure voltage?","options":["Voltmeter","Ammeter","Ohmmeter","Watt-hour meter only"],"answer":"Voltmeter","explanation":"A voltmeter measures electrical potential difference, or voltage.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_058","question":"How should a voltmeter be connected to measure voltage across a component?","options":["In parallel with the component","In series with the component","Only to ground","Across an open air gap"],"answer":"In parallel with the component","explanation":"A voltmeter measures the voltage difference between two points, so it is connected in parallel.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_059","question":"What instrument is used to measure current?","options":["Ammeter","Voltmeter","Ohmmeter","Thermometer"],"answer":"Ammeter","explanation":"An ammeter measures electric current.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_060","question":"How should an ammeter be connected to measure current through a component?","options":["In series with the component","In parallel with the component","Across only the battery terminals","Not connected to the circuit"],"answer":"In series with the component","explanation":"An ammeter must be placed in the current path, so it is connected in series.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_061","question":"What instrument is used to measure resistance?","options":["Ohmmeter","Ammeter","Voltmeter","Compass"],"answer":"Ohmmeter","explanation":"An ohmmeter measures resistance in ohms.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_062","question":"Before measuring resistance with an ohmmeter, what should normally be done?","options":["Turn off power to the circuit","Increase the circuit voltage","Connect the meter to AC only","Short the battery terminals"],"answer":"Turn off power to the circuit","explanation":"Resistance should normally be measured with power off to protect the meter and avoid false readings.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_063","question":"What does a multimeter commonly measure?","options":["Voltage, current, and resistance","Only temperature","Only air pressure","Only wire color"],"answer":"Voltage, current, and resistance","explanation":"A multimeter commonly combines voltmeter, ammeter, and ohmmeter functions.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_064","question":"What does infinite resistance usually indicate?","options":["An open circuit","A perfect short circuit","Zero voltage always","Maximum current flow"],"answer":"An open circuit","explanation":"Infinite resistance means current cannot flow, which usually indicates an open circuit.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_065","question":"What does nearly zero resistance usually indicate between two points?","options":["A short or direct connection","A broken wire","A charged capacitor only","A high-voltage transformer"],"answer":"A short or direct connection","explanation":"Very low resistance means the two points are directly connected or nearly shorted.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_066","question":"What is continuity testing used to check?","options":["Whether a complete electrical path exists","Whether a wire is painted correctly","Whether a battery is heavy","Whether a resistor is hot"],"answer":"Whether a complete electrical path exists","explanation":"A continuity test checks if current can pass through a path.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_067","question":"What does an oscilloscope display?","options":["Voltage changes over time","Only wire length","Only resistance color bands","Mechanical weight"],"answer":"Voltage changes over time","explanation":"An oscilloscope shows how a voltage signal changes with time.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_068","question":"What is impedance?","options":["Opposition to AC current","A type of battery case","The color of a wire","The weight of a resistor"],"answer":"Opposition to AC current","explanation":"Impedance is the total opposition to alternating current, including resistance and reactance.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_069","question":"What is capacitive reactance?","options":["Opposition a capacitor offers to AC","The amount of heat in a fuse","The weight of a capacitor","The voltage of a battery only"],"answer":"Opposition a capacitor offers to AC","explanation":"Capacitive reactance is how much a capacitor opposes alternating current.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_070","question":"As frequency increases, what happens to capacitive reactance?","options":["It decreases","It increases","It becomes infinite always","It becomes resistance-free"],"answer":"It decreases","explanation":"A capacitor offers less opposition to AC as frequency increases.","skillTag":"electronic_components","topic":"electronic_components","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_071","question":"As frequency increases, what happens to inductive reactance?","options":["It increases","It decreases","It becomes zero always","It becomes unrelated to frequency"],"answer":"It increases","explanation":"An inductor offers more opposition to AC as frequency increases.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_072","question":"What type of circuit allows low frequencies to pass but reduces high frequencies?","options":["Low-pass filter","High-pass filter","Band-stop switch","Full-wave rectifier"],"answer":"Low-pass filter","explanation":"A low-pass filter passes lower frequencies and reduces higher frequencies.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_073","question":"What type of circuit allows high frequencies to pass but reduces low frequencies?","options":["High-pass filter","Low-pass filter","Ground fault interrupter","Step-down transformer"],"answer":"High-pass filter","explanation":"A high-pass filter passes higher frequencies and reduces lower frequencies.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_074","question":"What is resonance in an LC circuit?","options":["The frequency where inductive and capacitive effects balance","The point where current must be zero forever","The moment a fuse melts","The color code of a capacitor"],"answer":"The frequency where inductive and capacitive effects balance","explanation":"At resonance, the inductor and capacitor reactances are equal in size and opposite in effect.","skillTag":"electronic_components","topic":"electronic_components","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_075","question":"What does RMS voltage describe for AC?","options":["The effective heating value of the AC voltage","The maximum voltage only","The minimum voltage only","The voltage after all resistance is removed"],"answer":"The effective heating value of the AC voltage","explanation":"RMS voltage tells the equivalent DC value that would produce the same heating effect.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_076","question":"For a sine wave, what is the peak-to-peak voltage?","options":["The difference between the positive peak and negative peak","Only the RMS value","Only the average value","The resistance of the circuit"],"answer":"The difference between the positive peak and negative peak","explanation":"Peak-to-peak voltage measures from the highest positive point to the lowest negative point.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_077","question":"What is the function of an antenna?","options":["To transmit or receive electromagnetic waves","To store electrical charge like a battery","To block all radio signals","To measure resistance only"],"answer":"To transmit or receive electromagnetic waves","explanation":"An antenna converts electrical signals to radio waves or radio waves back into electrical signals.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_078","question":"What is modulation used for in radio communication?","options":["To place information onto a carrier wave","To stop all current flow","To reduce a battery to zero volts","To make wire insulation thicker"],"answer":"To place information onto a carrier wave","explanation":"Modulation changes a carrier wave so it can carry information such as voice or data.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_079","question":"What does AM stand for in radio transmission?","options":["Amplitude modulation","Alternating magnetism","Automatic meter","Active motor"],"answer":"Amplitude modulation","explanation":"AM means amplitude modulation, where the carrier wave's amplitude is varied.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_080","question":"What does FM stand for in radio transmission?","options":["Frequency modulation","Fixed magnetism","Fast meter","Full motor"],"answer":"Frequency modulation","explanation":"FM means frequency modulation, where the carrier wave's frequency is varied.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_081","question":"What does a speaker do?","options":["Converts electrical signals into sound","Converts sound into fuel","Stores DC voltage","Measures current"],"answer":"Converts electrical signals into sound","explanation":"A speaker uses electrical signals to move a cone or diaphragm, producing sound waves.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_082","question":"What does a microphone do?","options":["Converts sound into electrical signals","Converts electricity into gasoline","Blocks all sound waves","Measures resistance only"],"answer":"Converts sound into electrical signals","explanation":"A microphone changes sound vibrations into electrical signals.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_083","question":"What does an amplifier do?","options":["Increases the strength of a signal","Turns current into insulation","Removes all voltage from a circuit","Measures wire thickness only"],"answer":"Increases the strength of a signal","explanation":"An amplifier makes a signal stronger by increasing its voltage, current, or power.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_084","question":"What is gain in an amplifier?","options":["The ratio of output signal to input signal","The weight of the amplifier","The number of screws in the case","The total length of the power cord"],"answer":"The ratio of output signal to input signal","explanation":"Gain compares how much larger the output signal is than the input signal.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_085","question":"What is feedback in electronics?","options":["Returning part of an output signal to the input","Measuring battery weight","Painting a circuit board","Removing all wires"],"answer":"Returning part of an output signal to the input","explanation":"Feedback sends part of the output signal back to the input to affect circuit behavior.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_086","question":"What does negative feedback usually do in an amplifier?","options":["Improves stability and reduces distortion","Always destroys the amplifier","Makes every signal infinite","Removes the need for power"],"answer":"Improves stability and reduces distortion","explanation":"Negative feedback can make an amplifier more stable and reduce unwanted distortion.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_087","question":"What is a printed circuit board used for?","options":["Mounting and connecting electronic components","Cooling water in engines","Measuring tire pressure","Storing fuel"],"answer":"Mounting and connecting electronic components","explanation":"A printed circuit board holds components and connects them with conductive traces.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_088","question":"What is solder used for?","options":["Making electrical and mechanical connections","Insulating rubber gloves","Measuring AC frequency","Charging batteries only"],"answer":"Making electrical and mechanical connections","explanation":"Solder melts and hardens to join components and wires electrically and mechanically.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_089","question":"What is a cold solder joint?","options":["A poor solder connection","A perfect battery terminal","A type of fuse","A wire with no insulation"],"answer":"A poor solder connection","explanation":"A cold solder joint is weak or unreliable, often because the solder did not heat or flow properly.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_090","question":"What is static electricity?","options":["A buildup of electric charge on a surface","Current that flows only through water","Voltage that changes into sound","Resistance inside a transformer"],"answer":"A buildup of electric charge on a surface","explanation":"Static electricity is charge that builds up and stays in one place until discharged.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_091","question":"Why can electrostatic discharge damage electronic parts?","options":["It can send a sudden high-voltage pulse through components","It makes wires longer","It removes all magnetism from copper","It turns AC into DC safely"],"answer":"It can send a sudden high-voltage pulse through components","explanation":"Sensitive components can be damaged by sudden static discharge, even if the spark is small.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_092","question":"What is one purpose of an anti-static wrist strap?","options":["To safely drain static charge from a person","To increase body voltage","To measure current in a motor","To replace a fuse"],"answer":"To safely drain static charge from a person","explanation":"An anti-static wrist strap helps prevent static buildup from damaging electronic components.","skillTag":"electronics_terms","topic":"electronics_terms","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_093","question":"What color is commonly used for the hot wire in many U.S. AC power cords?","options":["Black","White","Green","Blue"],"answer":"Black","explanation":"In many U.S. AC power cords, black is commonly used for the hot conductor.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_094","question":"What color is commonly used for the neutral wire in many U.S. AC power cords?","options":["White","Black","Red","Orange"],"answer":"White","explanation":"In many U.S. AC power cords, white is commonly used for the neutral conductor.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_095","question":"What color is commonly used for the equipment grounding wire in many U.S. AC power cords?","options":["Green","Black","White","Purple"],"answer":"Green","explanation":"Green, or green with a yellow stripe, is commonly used for the equipment grounding conductor.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_096","question":"What should you do before working on an electrical circuit?","options":["Disconnect power and verify the circuit is de-energized","Wet your hands","Use the largest fuse available","Hold both conductors at once"],"answer":"Disconnect power and verify the circuit is de-energized","explanation":"Turning off and verifying power is off reduces the risk of shock and equipment damage.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_097","question":"Why should the correct fuse rating be used?","options":["To protect the circuit from excessive current","To make the circuit draw unlimited current","To remove all resistance","To make voltage disappear"],"answer":"To protect the circuit from excessive current","explanation":"A properly rated fuse opens the circuit before too much current can damage wires or components.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_098","question":"What is power measured in?","options":["Watts","Ohms","Amperes only","Farads"],"answer":"Watts","explanation":"Electrical power is measured in watts.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_099","question":"What is electrical energy commonly measured in on a utility bill?","options":["Kilowatt-hours","Ohms","Volts per inch","Farads per second"],"answer":"Kilowatt-hours","explanation":"Utility companies commonly measure electrical energy use in kilowatt-hours.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_100","question":"A 100-watt light bulb runs for 10 hours. How much energy does it use?","options":["0.1 kilowatt-hour","1 kilowatt-hour","10 kilowatt-hours","100 kilowatt-hours"],"answer":"1 kilowatt-hour","explanation":"100 watts is 0.1 kilowatt. 0.1 kilowatt times 10 hours equals 1 kilowatt-hour.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ei_real_001","question":"A 12-volt circuit has a 3-ohm resistor. What current flows through it?","options":["4 amps","9 amps","15 amps","36 amps"],"answer":"4 amps","explanation":"Use Ohm's law: I = V/R = 12/3 = 4 amps.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_002","question":"Two 10-ohm resistors are connected in series. What is the total resistance?","options":["20 ohms","10 ohms","5 ohms","100 ohms"],"answer":"20 ohms","explanation":"In series, resistances add directly: 10 + 10 = 20 ohms.","skillTag":"series_parallel_circuits","topic":"series_parallel_circuits","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_003","question":"Two identical 8-ohm resistors are connected in parallel. What is the total resistance?","options":["4 ohms","8 ohms","16 ohms","64 ohms"],"answer":"4 ohms","explanation":"Two equal resistors in parallel have half the resistance of one resistor.","skillTag":"series_parallel_circuits","topic":"series_parallel_circuits","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_004","question":"A lamp is rated at 60 watts on a 120-volt circuit. About how much current does it draw?","options":["0.5 amp","2 amps","60 amps","7,200 amps"],"answer":"0.5 amp","explanation":"Power equals voltage times current, so I = P/V = 60/120 = 0.5 amp.","skillTag":"power_energy","topic":"power_energy","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_005","question":"If one bulb burns out and the remaining bulbs stay lit, the bulbs are most likely wired in:","options":["Parallel","Series","Open circuit only","A short circuit"],"answer":"Parallel","explanation":"Parallel branches allow current to continue flowing through other branches if one branch opens.","skillTag":"series_parallel_circuits","topic":"series_parallel_circuits","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_006","question":"What device is commonly used to prevent excessive current from damaging a circuit?","options":["Fuse","Capacitor only","Transformer only","Antenna"],"answer":"Fuse","explanation":"A fuse melts and opens the circuit when current exceeds a safe level.","skillTag":"electrical_safety","topic":"electrical_safety","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_007","question":"A wire with damaged insulation is dangerous mainly because it can:","options":["Expose users to shock or cause a short","Increase memory speed","Convert DC to AC","Reduce all resistance to safe levels"],"answer":"Expose users to shock or cause a short","explanation":"Damaged insulation can allow unintended contact with energized conductors.","skillTag":"electrical_safety","topic":"electrical_safety","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_008","question":"A transformer is mainly used to change:","options":["AC voltage level","Chemical composition","Mechanical torque","Battery polarity permanently"],"answer":"AC voltage level","explanation":"Transformers step AC voltage up or down through electromagnetic induction.","skillTag":"components_devices","topic":"components_devices","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_009","question":"What happens to current if voltage increases and resistance stays the same?","options":["Current increases","Current decreases","Current becomes zero","Current turns into power"],"answer":"Current increases","explanation":"By I = V/R, current rises when voltage rises and resistance is constant.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_010","question":"A capacitor primarily stores energy in:","options":["An electric field","A magnetic gear","A fuel mixture","A hydraulic fluid"],"answer":"An electric field","explanation":"Capacitors store electrical energy in an electric field between plates.","skillTag":"components_devices","topic":"components_devices","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_011","question":"A diode normally allows current to flow:","options":["Mostly in one direction","Equally in every direction","Only through wood","Only without voltage"],"answer":"Mostly in one direction","explanation":"A diode conducts primarily in one direction and blocks in the opposite direction.","skillTag":"components_devices","topic":"components_devices","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_012","question":"Which tool should be used to measure voltage in a circuit?","options":["Voltmeter","Micrometer","Torque wrench","Hydrometer only"],"answer":"Voltmeter","explanation":"A voltmeter measures potential difference between two points.","skillTag":"measurement_troubleshooting","topic":"measurement_troubleshooting","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_013","question":"If a circuit has an unintended low-resistance path, it is called a:","options":["Short circuit","Grounded neutral only","Capacitive load","Step-up circuit"],"answer":"Short circuit","explanation":"A short circuit bypasses the intended load and can cause dangerously high current.","skillTag":"electrical_safety","topic":"electrical_safety","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_014","question":"Why should an ammeter be placed in series with the circuit load?","options":["It must measure the current flowing through the path","It must block all current","It measures voltage without contact","It stores charge for later"],"answer":"It must measure the current flowing through the path","explanation":"An ammeter measures current, so the current must pass through the meter.","skillTag":"measurement_troubleshooting","topic":"measurement_troubleshooting","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_015","question":"In a household outlet, the ground wire is intended to:","options":["Provide a safer fault-current path","Power the light under normal use","Increase voltage above rated value","Replace the fuse"],"answer":"Provide a safer fault-current path","explanation":"Grounding gives fault current a lower-resistance safety path and helps protective devices operate.","skillTag":"electrical_safety","topic":"electrical_safety","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_016","question":"A resistor color code indicates resistance value. The purpose of the color bands is to show:","options":["Resistance and tolerance","Wire insulation thickness only","AC frequency only","Battery age"],"answer":"Resistance and tolerance","explanation":"Color bands mark the resistor value and tolerance range.","skillTag":"components_devices","topic":"components_devices","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_017","question":"A circuit that has a break in the conductor and no complete path is:","options":["Open","Closed","Parallel only","Grounded only"],"answer":"Open","explanation":"An open circuit has a broken path, so current cannot flow.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_018","question":"Which component can turn electrical energy into mechanical rotation?","options":["Electric motor","Capacitor","Fuse","Resistor only"],"answer":"Electric motor","explanation":"An electric motor uses electromagnetic forces to produce rotation.","skillTag":"components_devices","topic":"components_devices","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_019","question":"Alternating current differs from direct current because AC:","options":["Changes direction periodically","Always flows in one direction","Cannot power devices","Has no voltage"],"answer":"Changes direction periodically","explanation":"AC reverses direction at a regular frequency. DC flows in one direction.","skillTag":"ac_dc_fundamentals","topic":"ac_dc_fundamentals","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ei_real_020","question":"If resistance doubles while voltage stays the same, current will:","options":["Be cut in half","Double","Stay the same","Become infinite"],"answer":"Be cut in half","explanation":"Current is inversely proportional to resistance when voltage is constant.","skillTag":"electrical_basics_ohms_law","topic":"electrical_basics_ohms_law","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"}],"Automotive Information (AI)":[{"id":"asvab_ai_001","question":"What is the main purpose of an engine in an automobile?","options":["To convert fuel energy into mechanical power","To store brake fluid","To cool the passenger compartment","To measure tire pressure"],"answer":"To convert fuel energy into mechanical power","explanation":"An engine burns fuel and converts that energy into mechanical power that moves the vehicle.","skillTag":"engine_basics","topic":"engine_basics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ai_002","question":"What part of an engine moves up and down inside the cylinder?","options":["Piston","Radiator","Alternator","Flywheel"],"answer":"Piston","explanation":"The piston moves up and down
