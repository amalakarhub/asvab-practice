question":"A store has 450 items in stock. If 2/9 of the items are sold, how many are sold?","options":["75","90","100","125"],"answer":"100","explanation":"One-ninth of 450 is 50. Two-ninths is 2 x 50 = 100.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_082","question":"A bus travels 18 miles in 30 minutes. What is its speed in miles per hour?","options":["24 miles per hour","30 miles per hour","36 miles per hour","40 miles per hour"],"answer":"36 miles per hour","explanation":"Thirty minutes is half an hour. If the bus travels 18 miles in half an hour, it travels 36 miles in one hour.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_083","question":"A tank drains at 8 gallons per minute. How many gallons drain in 15 minutes?","options":["100 gallons","110 gallons","120 gallons","130 gallons"],"answer":"120 gallons","explanation":"Multiply the drain rate by time. 8 x 15 = 120 gallons.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_084","question":"A recipe needs 1 1/2 cups of flour. How much flour is needed for 4 batches?","options":["4 cups","5 cups","6 cups","8 cups"],"answer":"6 cups","explanation":"One and one-half cups times 4 equals 6 cups.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_085","question":"A box contains 96 screws. If 3/4 of them are used, how many screws are left?","options":["16","24","32","72"],"answer":"24","explanation":"Three-fourths of 96 is 72 used. 96 minus 72 leaves 24 screws.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_086","question":"A factory makes 2,400 units in 8 hours. At the same rate, how many units does it make in 5 hours?","options":["1,200","1,400","1,500","1,600"],"answer":"1,500","explanation":"The factory makes 2,400 divided by 8 = 300 units per hour. In 5 hours, it makes 300 x 5 = 1,500 units.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_087","question":"A student answers 45 questions correctly out of 60. What percent are correct?","options":["65%","70%","75%","80%"],"answer":"75%","explanation":"Divide 45 by 60 to get 0.75, which is 75%.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_088","question":"A road crew repairs 3/10 of a road on Monday and 2/5 of the road on Tuesday. What fraction of the road has been repaired?","options":["1/2","7/10","3/4","4/5"],"answer":"7/10","explanation":"Convert 2/5 to 4/10. Then 3/10 + 4/10 = 7/10.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_089","question":"A road crew repairs 3/10 of a road on Monday and 2/5 of the road on Tuesday. What fraction of the road remains unrepaired?","options":["1/10","2/10","3/10","4/10"],"answer":"3/10","explanation":"They repaired 7/10 of the road. The remaining part is 1 - 7/10 = 3/10.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_090","question":"A phone plan costs $35 per month plus $0.10 per text message. If a customer sends 250 text messages, what is the total monthly cost?","options":["$50","$55","$60","$65"],"answer":"$60","explanation":"Text charges are 250 x $0.10 = $25. Add the $35 monthly charge to get $60.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_091","question":"A box of 18 identical bolts weighs 9 pounds. How much does each bolt weigh?","options":["1/4 pound","1/2 pound","2 pounds","3 pounds"],"answer":"1/2 pound","explanation":"Divide total weight by number of bolts. 9 divided by 18 equals 1/2 pound per bolt.","skillTag":"unit_conversion","topic":"unit_conversion","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_092","question":"A shipment contains 240 boxes. If 15% are damaged, how many boxes are not damaged?","options":["36","180","204","216"],"answer":"204","explanation":"Fifteen percent of 240 is 36 damaged boxes. 240 minus 36 equals 204 not damaged.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_093","question":"A tank contains 72 gallons of water. If 1/3 is drained, how many gallons remain?","options":["24 gallons","36 gallons","48 gallons","54 gallons"],"answer":"48 gallons","explanation":"One-third of 72 is 24 gallons drained. 72 minus 24 equals 48 gallons remaining.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_094","question":"A store sells 5 packs of paper for $17.50. What is the cost of 8 packs at the same rate?","options":["$24.00","$26.50","$28.00","$30.00"],"answer":"$28.00","explanation":"Each pack costs $17.50 divided by 5, or $3.50. Eight packs cost 8 x $3.50 = $28.00.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_095","question":"The ratio of adults to children at an event is 4:7. If there are 33 people total, how many children are there?","options":["12","18","21","24"],"answer":"21","explanation":"The ratio has 11 total parts. Each part equals 33 divided by 11, or 3. Children make up 7 parts, so 7 x 3 = 21.","skillTag":"ratios_proportions","topic":"ratios_proportions","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_096","question":"A worker completes 5 tasks in 2 hours. At the same rate, how many tasks can the worker complete in 8 hours?","options":["15","18","20","25"],"answer":"20","explanation":"Eight hours is 4 times as long as 2 hours. The worker completes 5 x 4 = 20 tasks.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_097","question":"A store sells a radio for $72 after discounting it by 20%. What was the original price?","options":["$80","$84","$90","$96"],"answer":"$90","explanation":"After a 20% discount, the sale price is 80% of the original. $72 divided by 0.80 equals $90.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_098","question":"A 12-foot board is cut into pieces that are each 18 inches long. How many pieces can be cut from the board?","options":["6","8","10","12"],"answer":"8","explanation":"Twelve feet equals 144 inches. 144 divided by 18 equals 8 pieces.","skillTag":"unit_conversion","topic":"unit_conversion","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_099","question":"A group travels 135 miles in 2.5 hours. What is the average speed?","options":["45 miles per hour","50 miles per hour","54 miles per hour","60 miles per hour"],"answer":"54 miles per hour","explanation":"Average speed equals distance divided by time. 135 divided by 2.5 equals 54 miles per hour.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_100","question":"A rectangular garden has an area of 96 square feet. If its length is 12 feet, what is its width?","options":["6 feet","8 feet","10 feet","12 feet"],"answer":"8 feet","explanation":"Area equals length times width. Divide 96 by 12 to get a width of 8 feet.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"afqt_ar_real_001","question":"A mechanic charges $45 for the first hour of labor and $30 for each additional hour. If a repair takes 4 hours, what is the labor charge?","options":["$90","$120","$135","$165"],"answer":"$135","explanation":"The first hour costs $45. The next 3 hours cost 3 × $30 = $90. Total is $45 + $90 = $135.","difficulty":"medium","skillTag":"multi_step_money","afqtRelevant":true,"realismTier":"asvab_style","topic":"multi_step_money"},{"id":"afqt_ar_real_002","question":"A truck travels 180 miles in 3 hours, then 120 miles in 2 hours. What is its average speed for the whole trip?","options":["50 mph","55 mph","60 mph","65 mph"],"answer":"60 mph","explanation":"Total distance is 300 miles and total time is 5 hours. Average speed = 300 ÷ 5 = 60 mph.","difficulty":"medium","skillTag":"average_rate","afqtRelevant":true,"realismTier":"asvab_style","topic":"average_rate"},{"id":"afqt_ar_real_003","question":"A jacket is on sale for $72 after a 20% discount. What was the original price?","options":["$86.40","$90","$92","$96"],"answer":"$90","explanation":"After a 20% discount, the sale price is 80% of the original. 72 ÷ 0.80 = 90.","difficulty":"hard","skillTag":"reverse_percent","afqtRelevant":true,"realismTier":"asvab_style","topic":"reverse_percent"},{"id":"afqt_ar_real_004","question":"A water tank is 3/5 full. After 24 gallons are added, it is 4/5 full. What is the tank's full capacity?","options":["96 gallons","120 gallons","144 gallons","160 gallons"],"answer":"120 gallons","explanation":"The added 24 gallons equals 1/5 of the tank. Full capacity is 24 × 5 = 120 gallons.","difficulty":"hard","skillTag":"fractions_capacity","afqtRelevant":true,"realismTier":"asvab_style","topic":"fractions_capacity"},{"id":"afqt_ar_real_005","question":"A team of 6 workers can complete a job in 10 days. At the same rate, how many days would 15 workers take?","options":["3 days","4 days","5 days","6 days"],"answer":"4 days","explanation":"The job requires 6 × 10 = 60 worker-days. With 15 workers, 60 ÷ 15 = 4 days.","difficulty":"medium","skillTag":"work_rate","afqtRelevant":true,"realismTier":"asvab_style","topic":"work_rate"},{"id":"afqt_ar_real_006","question":"A recipe uses 2 cups of rice for every 5 cups of water. How many cups of water are needed for 7 cups of rice?","options":["12.5","15","17.5","20"],"answer":"17.5","explanation":"The water-to-rice ratio is 5/2. For 7 cups of rice, water = 7 × 5/2 = 17.5 cups.","difficulty":"medium","skillTag":"ratios","afqtRelevant":true,"realismTier":"asvab_style","topic":"ratios"},{"id":"afqt_ar_real_007","question":"A store buys a tool for $64 and sells it for $80. What is the percent markup based on the store's cost?","options":["16%","20%","25%","30%"],"answer":"25%","explanation":"Markup is $80 - $64 = $16. Divide by cost: 16 ÷ 64 = 0.25, or 25%.","difficulty":"hard","skillTag":"percent_markup","afqtRelevant":true,"realismTier":"asvab_style","topic":"percent_markup"},{"id":"afqt_ar_real_008","question":"A car uses 12 gallons of gas to travel 336 miles. At that rate, how far can it travel on 15 gallons?","options":["390 miles","405 miles","420 miles","450 miles"],"answer":"420 miles","explanation":"Miles per gallon = 336 ÷ 12 = 28. With 15 gallons, distance = 28 × 15 = 420 miles.","difficulty":"medium","skillTag":"unit_rate","afqtRelevant":true,"realismTier":"asvab_style","topic":"unit_rate"},{"id":"afqt_ar_real_009","question":"The average of three test scores is 84. Two scores are 79 and 88. What is the third score?","options":["82","84","85","88"],"answer":"85","explanation":"Three scores averaging 84 total 84 × 3 = 252. The known scores total 167. The missing score is 252 - 167 = 85.","difficulty":"medium","skillTag":"missing_average","afqtRelevant":true,"realismTier":"asvab_style","topic":"missing_average"},{"id":"afqt_ar_real_010","question":"A rectangular lot is 45 feet long and 30 feet wide. If fencing costs $8 per foot, what is the cost to fence the lot?","options":["$600","$900","$1,200","$10,800"],"answer":"$1,200","explanation":"Perimeter = 2(45) + 2(30) = 150 feet. Cost = 150 × $8 = $1,200.","difficulty":"medium","skillTag":"perimeter_cost","afqtRelevant":true,"realismTier":"asvab_style","topic":"perimeter_cost"},{"id":"afqt_ar_real_011","question":"A map scale shows 1 inch equals 25 miles. Two towns are 3.6 inches apart on the map. How far apart are they?","options":["72 miles","84 miles","90 miles","100 miles"],"answer":"90 miles","explanation":"Multiply the map distance by the scale: 3.6 × 25 = 90 miles.","difficulty":"medium","skillTag":"scale","afqtRelevant":true,"realismTier":"asvab_style","topic":"scale"},{"id":"afqt_ar_real_012","question":"A printer completes 18 pages in 3 minutes. How many pages can it print in 25 minutes at the same rate?","options":["125","135","150","180"],"answer":"150","explanation":"The printer makes 18 ÷ 3 = 6 pages per minute. In 25 minutes, it prints 6 × 25 = 150 pages.","difficulty":"medium","skillTag":"unit_rate","afqtRelevant":true,"realismTier":"asvab_style","topic":"unit_rate"},{"id":"afqt_ar_real_013","question":"A worker earns $17.50 per hour for 40 hours and 1.5 times that rate for 6 overtime hours. What is the worker's total pay?","options":["$805.00","$857.50","$875.00","$927.50"],"answer":"$857.50","explanation":"Regular pay is 40 × $17.50 = $700. Overtime rate is $26.25, and 6 hours is $157.50. Total is $857.50.","difficulty":"hard","skillTag":"wages_overtime","afqtRelevant":true,"realismTier":"asvab_style","topic":"wages_overtime"},{"id":"afqt_ar_real_014","question":"A box contains 48 bolts. If 3/8 of them are used, how many bolts remain?","options":["18","24","30","36"],"answer":"30","explanation":"3/8 of 48 is 18 used. Remaining bolts = 48 - 18 = 30.","difficulty":"medium","skillTag":"fraction_remaining","afqtRelevant":true,"realismTier":"asvab_style","topic":"fraction_remaining"},{"id":"afqt_ar_real_015","question":"A 15-foot board is cut into pieces that are each 2.5 feet long. How many pieces can be made?","options":["5","6","7","8"],"answer":"6","explanation":"Divide total length by piece length: 15 ÷ 2.5 = 6 pieces.","difficulty":"medium","skillTag":"division_units","afqtRelevant":true,"realismTier":"asvab_style","topic":"division_units"},{"id":"afqt_ar_real_016","question":"A bank account increases from $800 to $920. What is the percent increase?","options":["12%","15%","18%","20%"],"answer":"15%","explanation":"The increase is $120. Divide by the original amount: 120 ÷ 800 = 0.15, or 15%.","difficulty":"medium","skillTag":"percent_change","afqtRelevant":true,"realismTier":"asvab_style","topic":"percent_change"},{"id":"afqt_ar_real_017","question":"A pump fills 2/3 of a tank in 12 minutes. At the same rate, how long will it take to fill the whole tank?","options":["16 minutes","18 minutes","20 minutes","24 minutes"],"answer":"18 minutes","explanation":"If 2/3 takes 12 minutes, then 1/3 takes 6 minutes. The whole tank, 3/3, takes 18 minutes.","difficulty":"hard","skillTag":"fraction_rate","afqtRelevant":true,"realismTier":"asvab_style","topic":"fraction_rate"},{"id":"afqt_ar_real_018","question":"A shipment has 240 items. If 5% are damaged, how many items are not damaged?","options":["12","216","228","235"],"answer":"228","explanation":"5% of 240 is 12 damaged items. Not damaged = 240 - 12 = 228.","difficulty":"medium","skillTag":"percent_remaining","afqtRelevant":true,"realismTier":"asvab_style","topic":"percent_remaining"},{"id":"afqt_ar_real_019","question":"A runner completes 3.5 miles in 28 minutes. What is the runner's pace per mile?","options":["7 minutes","8 minutes","9 minutes","10 minutes"],"answer":"8 minutes","explanation":"Pace = total time ÷ distance = 28 ÷ 3.5 = 8 minutes per mile.","difficulty":"medium","skillTag":"pace","afqtRelevant":true,"realismTier":"asvab_style","topic":"pace"},{"id":"afqt_ar_real_020","question":"A ladder reaches a window 12 feet above the ground. The base of the ladder is 5 feet from the wall. How long is the ladder?","options":["12 feet","13 feet","15 feet","17 feet"],"answer":"13 feet","explanation":"This forms a right triangle with legs 5 and 12. The hypotenuse is 13 because 5^2 + 12^2 = 169 and √169 = 13.","difficulty":"medium","skillTag":"pythagorean_word_problem","afqtRelevant":true,"realismTier":"asvab_style","topic":"pythagorean_word_problem"},{"id":"afqt_ar_real_021","question":"A class has 28 students. The ratio of students who passed to students who failed is 5:2. How many students passed?","options":["10","16","20","24"],"answer":"20","explanation":"The ratio has 7 total parts. Each part is 28 ÷ 7 = 4. Passed students are 5 parts, so 5 × 4 = 20.","difficulty":"medium","skillTag":"ratio_parts","afqtRelevant":true,"realismTier":"asvab_style","topic":"ratio_parts"},{"id":"afqt_ar_real_022","question":"A machine produces 75 parts in 5 minutes. How long will it take to produce 240 parts at the same rate?","options":["12 minutes","14 minutes","16 minutes","18 minutes"],"answer":"16 minutes","explanation":"The machine produces 75 ÷ 5 = 15 parts per minute. Time for 240 parts is 240 ÷ 15 = 16 minutes.","difficulty":"medium","skillTag":"unit_rate","afqtRelevant":true,"realismTier":"asvab_style","topic":"unit_rate"},{"id":"afqt_ar_real_023","question":"A shirt costs $36 after a 10% sales tax is added. What was the price before tax?","options":["$30.60","$32.40","$32.73","$34.00"],"answer":"$32.73","explanation":"The final price is 110% of the original. Original price = 36 ÷ 1.10 = 32.727..., or about $32.73.","difficulty":"hard","skillTag":"reverse_tax","afqtRelevant":true,"realismTier":"asvab_style","topic":"reverse_tax"},{"id":"afqt_ar_real_024","question":"A 60-pound mixture contains 20% salt. How many pounds of salt are in the mixture?","options":["8","10","12","15"],"answer":"12","explanation":"20% of 60 is 0.20 × 60 = 12 pounds.","difficulty":"medium","skillTag":"percent_of_amount","afqtRelevant":true,"realismTier":"asvab_style","topic":"percent_of_amount"},{"id":"afqt_ar_real_025","question":"A tank contains 40 gallons of fuel. If fuel is used at a rate of 2.5 gallons per hour, how much fuel remains after 6 hours?","options":["15 gallons","20 gallons","25 gallons","30 gallons"],"answer":"25 gallons","explanation":"Fuel used is 2.5 × 6 = 15 gallons. Remaining fuel is 40 - 15 = 25 gallons.","difficulty":"medium","skillTag":"rate_remaining","afqtRelevant":true,"realismTier":"asvab_style","topic":"rate_remaining"},{"id":"afqt_ar_real_026","question":"Two numbers have a sum of 54. One number is twice the other. What is the smaller number?","options":["18","24","27","36"],"answer":"18","explanation":"Let the smaller number be x. The larger is 2x. Then x + 2x = 54, so 3x = 54 and x = 18.","difficulty":"medium","skillTag":"word_to_equation","afqtRelevant":true,"realismTier":"asvab_style","topic":"word_to_equation"},{"id":"afqt_ar_real_027","question":"A car rental costs $35 per day plus $0.20 per mile. What is the cost for 3 days and 250 miles?","options":["$85","$105","$155","$185"],"answer":"$155","explanation":"Daily cost is 3 × $35 = $105. Mileage cost is 250 × $0.20 = $50. Total is $155.","difficulty":"medium","skillTag":"linear_cost","afqtRelevant":true,"realismTier":"asvab_style","topic":"linear_cost"},{"id":"afqt_ar_real_028","question":"A rope is 7 yards long. How many 18-inch pieces can be cut from it?","options":["10","12","14","16"],"answer":"14","explanation":"7 yards = 21 feet = 252 inches. 252 ÷ 18 = 14 pieces.","difficulty":"hard","skillTag":"unit_conversion","afqtRelevant":true,"realismTier":"asvab_style","topic":"unit_conversion"},{"id":"afqt_ar_real_029","question":"A shelf holds 9 boxes, and each box holds 24 cans. If 5 shelves are full, how many cans are there?","options":["120","216","900","1,080"],"answer":"1,080","explanation":"One shelf holds 9 × 24 = 216 cans. Five shelves hold 216 × 5 = 1,080 cans.","difficulty":"medium","skillTag":"multi_step_multiplication","afqtRelevant":true,"realismTier":"asvab_style","topic":"multi_step_multiplication"},{"id":"afqt_ar_real_030","question":"A number decreased by 30% is 84. What was the original number?","options":["100","110","120","130"],"answer":"120","explanation":"After a 30% decrease, 70% of the original remains. 84 ÷ 0.70 = 120.","difficulty":"hard","skillTag":"reverse_percent","afqtRelevant":true,"realismTier":"asvab_style","topic":"reverse_percent"},{"id":"afqt_ar_real_031","question":"A group orders 4 pizzas. Each pizza has 8 slices. If 20 slices are eaten, what fraction of the pizza remains?","options":["1/4","3/8","1/2","5/8"],"answer":"3/8","explanation":"Total slices are 4 × 8 = 32. Remaining slices are 32 - 20 = 12. 12/32 simplifies to 3/8.","difficulty":"medium","skillTag":"fraction_remaining","afqtRelevant":true,"realismTier":"asvab_style","topic":"fraction_remaining"},{"id":"afqt_ar_real_032","question":"A train leaves at 9:15 a.m. and arrives at 12:45 p.m. It travels 210 miles. What is its average speed?","options":["50 mph","55 mph","60 mph","65 mph"],"answer":"60 mph","explanation":"From 9:15 to 12:45 is 3.5 hours. Average speed = 210 ÷ 3.5 = 60 mph.","difficulty":"hard","skillTag":"time_rate_distance","afqtRelevant":true,"realismTier":"asvab_style","topic":"time_rate_distance"},{"id":"afqt_ar_real_033","question":"A worker can pack 32 boxes in 4 hours. Another worker can pack 45 boxes in 5 hours. Together, how many boxes can they pack in one hour?","options":["15","16","17","18"],"answer":"17","explanation":"First worker packs 32 ÷ 4 = 8 boxes per hour. Second packs 45 ÷ 5 = 9 boxes per hour. Together they pack 17 per hour.","difficulty":"hard","skillTag":"combined_rates","afqtRelevant":true,"realismTier":"asvab_style","topic":"combined_rates"},{"id":"afqt_ar_real_034","question":"A store sells batteries in packs of 6 for $8.40. What is the cost of 15 batteries at the same rate?","options":["$18.00","$19.50","$21.00","$22.50"],"answer":"$21.00","explanation":"One battery costs $8.40 ÷ 6 = $1.40. Fifteen batteries cost 15 × $1.40 = $21.00.","difficulty":"medium","skillTag":"unit_price","afqtRelevant":true,"realismTier":"asvab_style","topic":"unit_price"},{"id":"afqt_ar_real_035","question":"The price of a part rises from $48 to $60, then drops by 10%. What is the final price?","options":["$52.00","$54.00","$55.20","$58.00"],"answer":"$54.00","explanation":"After rising to $60, a 10% drop is $6. Final price is $60 - $6 = $54.","difficulty":"hard","skillTag":"sequential_percent","afqtRelevant":true,"realismTier":"asvab_style","topic":"sequential_percent"},{"id":"afqt_ar_real_036","question":"A rectangular floor is 12 feet by 15 feet. Tiles cover 3 square feet each. How many tiles are needed to cover the floor?","options":["45","60","90","180"],"answer":"60","explanation":"Floor area is 12 × 15 = 180 square feet. Each tile covers 3 square feet, so 180 ÷ 3 = 60 tiles.","difficulty":"medium","skillTag":"area_application","afqtRelevant":true,"realismTier":"asvab_style","topic":"area_application"},{"id":"afqt_ar_real_037","question":"A package weighs 4 pounds 10 ounces. Another weighs 3 pounds 14 ounces. What is their total weight?","options":["7 lb 8 oz","8 lb 4 oz","8 lb 8 oz","9 lb 0 oz"],"answer":"8 lb 8 oz","explanation":"Add pounds and ounces: 4 lb 10 oz + 3 lb 14 oz = 7 lb 24 oz. Since 16 oz = 1 lb, 24 oz = 1 lb 8 oz, so total is 8 lb 8 oz.","difficulty":"hard","skillTag":"unit_conversion_weight","afqtRelevant":true,"realismTier":"asvab_style","topic":"unit_conversion_weight"},{"id":"afqt_ar_real_038","question":"A tank is filled at 6 gallons per minute and drained at 2 gallons per minute at the same time. How many gallons are added to the tank in 15 minutes?","options":["30","45","60","90"],"answer":"60","explanation":"Net fill rate is 6 - 2 = 4 gallons per minute. In 15 minutes, 4 × 15 = 60 gallons are added.","difficulty":"medium","skillTag":"net_rate","afqtRelevant":true,"realismTier":"asvab_style","topic":"net_rate"},{"id":"afqt_ar_real_039","question":"A phone costs $600. A buyer pays 15% down and finances the rest. How much is financed?","options":["$90","$450","$510","$585"],"answer":"$510","explanation":"The down payment is 15% of $600, or $90. The financed amount is $600 - $90 = $510.","difficulty":"medium","skillTag":"percent_remaining","afqtRelevant":true,"realismTier":"asvab_style","topic":"percent_remaining"},{"id":"afqt_ar_real_040","question":"A storage room has 18 boxes. Each box contains 12 folders, and each folder contains 25 sheets. How many sheets are in the room?","options":["4,500","5,400","6,000","7,200"],"answer":"5,400","explanation":"Multiply boxes, folders, and sheets: 18 × 12 × 25 = 216 × 25 = 5,400 sheets.","difficulty":"medium","skillTag":"multi_step_multiplication","afqtRelevant":true,"realismTier":"asvab_style","topic":"multi_step_multiplication"}],"Word Knowledge (WK)":[{"id":"asvab_wk_001","question":"The word 'brief' most nearly means:","options":["Short","Heavy","Loud","Bright"],"answer":"Short","explanation":"'Brief' means lasting for a short time or using few words.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_002","question":"The word 'assist' most nearly means:","options":["Help","Hide","Delay","Argue"],"answer":"Help","explanation":"'Assist' means to help someone do something.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_003","question":"The word 'ancient' most nearly means:","options":["Very old","Very small","Very fast","Very quiet"],"answer":"Very old","explanation":"'Ancient' describes something from a very long time ago.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_004","question":"The word 'rapid' most nearly means:","options":["Fast","Weak","Careful","Empty"],"answer":"Fast","explanation":"'Rapid' means moving or happening quickly.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_005","question":"The word 'purchase' most nearly means:","options":["Buy","Borrow","Break","Measure"],"answer":"Buy","explanation":"'Purchase' means to buy something.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_006","question":"The word 'difficult' most nearly means:","options":["Hard","Simple","Soft","Common"],"answer":"Hard","explanation":"'Difficult' means not easy to do, understand, or solve.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_007","question":"The word 'observe' most nearly means:","options":["Watch","Forget","Repair","Ignore"],"answer":"Watch","explanation":"'Observe' means to watch or notice carefully.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_008","question":"The word 'fragile' most nearly means:","options":["Easily broken","Very expensive","Hard to find","Full of water"],"answer":"Easily broken","explanation":"'Fragile' means delicate or easily damaged.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_009","question":"The word 'accurate' most nearly means:","options":["Correct","Late","Tiny","Angry"],"answer":"Correct","explanation":"'Accurate' means correct, exact, or free from mistakes.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_010","question":"The word 'combine' most nearly means:","options":["Join","Separate","Destroy","Choose"],"answer":"Join","explanation":"'Combine' means to bring two or more things together.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_011","question":"The word 'frequent' most nearly means:","options":["Often","Rare","Silent","Hidden"],"answer":"Often","explanation":"'Frequent' means happening often or many times.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_012","question":"The word 'expand' most nearly means:","options":["Grow larger","Move slower","Become darker","Fall apart"],"answer":"Grow larger","explanation":"'Expand' means to increase in size, amount, or range.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_013","question":"The word 'reduce' most nearly means:","options":["Make smaller","Make louder","Make faster","Make cleaner"],"answer":"Make smaller","explanation":"'Reduce' means to make something smaller or less.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_014","question":"The word 'require' most nearly means:","options":["Need","Offer","Avoid","Guess"],"answer":"Need","explanation":"'Require' means to need something or make something necessary.","skillTag":"basic_synonyms","topic":"basic_synonyms","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_015","question":"The word 'select' most nearl fficient' means enough to meet a need or requirement.","skillTag":"intermediate_vocabulary","topic":"intermediate_vocabulary","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_wk_050","question":"The word 'vacant' most nearly means:","options":["Empty","Crowded","Noisy","Broken"],"answer":"Empty","explanation":"'Vacant' means empty or not occupied.","skillTag":"intermediate_vocabulary","topic":"intermediate_vocabulary","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"afqt_wk_real_001","question":"The word 'concise' most nearly means:","options":["Brief and clear","Angry and loud","Old and damaged","Slow and careful"],"answer":"Brief and clear","explanation":"'Concise' means expressed in few words while still being clear.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_002","question":"The word 'reluctant' most nearly means:","options":["Unwilling","Generous","Certain","Careless"],"answer":"Unwilling","explanation":"'Reluctant' means hesitant or not willing to do something.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_003","question":"The word 'deteriorate' most nearly means:","options":["Become worse","Begin again","Move quickly","Explain clearly"],"answer":"Become worse","explanation":"To deteriorate is to decline in condition or quality.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_004","question":"The word 'scrutinize' most nearly means:","options":["Examine closely","Ignore completely","Repair quickly","Divide evenly"],"answer":"Examine closely","explanation":"'Scrutinize' means to inspect or examine something carefully.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_r wer":"Confirm as true","explanation":"To verify is to check and confirm that something is accurate or true.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_011","question":"The word 'imminent' most nearly means:","options":["About to happen","Difficult to lift","No longer legal","Already forgotten"],"answer":"About to happen","explanation":"'Imminent' describes something expected to happen very soon.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_012","question":"The word 'credible' most nearly means:","options":["Believable","Expensive","Harmless","Colorful"],"answer":"Believable","explanation":"A credible statement or source is believable and trustworthy.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_013","question":"The word 'inhibit' most nearly means:","options":["Hold back","Speed up","Point out","Write down"],"answer":"Hold back","explanation":"To inhibit something is to slow it, restrain it, or prevent it from acting freely.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_014","question":"The word 'tedious' most nearly means:","options":["Boring and long","Sharp and dangerous","Rare and costly","Bright and loud"],"answer":"Boring and long","explanation":"Tedious work is tiresome because it is long, dull, or repetitive.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_015","question":"The word 'feasible' most nearly means:","options":["Possible to do","Likely to fail","Hard to see","Already broken"],"answer":"Possible to do","explanation":"A feasible plan is practical and possible to carry out.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_016","question":"The word 'meticulous' most nearly means:","options":["Very careful and exact","Quick to anger","Unable to move","Poorly planned"],"answer":"Very careful and exact","explanation":"Meticulous work is done with close attention to details.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_017","question":"The word 'coherent' most nearly means:","options":["Clear and logical","Soft and flexible","Hidden from view","Likely to break"],"answer":"Clear and logical","explanation":"A coherent explanation is organized and makes sense.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_018","question":"The word 'relentless' most nearly means:","options":["Continuing without stopping","Easy to persuade","Small in amount","Weak in force"],"answer":"Continuing without stopping","explanation":"Relentless means persistent, constant, or not giving up.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_019","question":"The word 'prudent' most nearly means:","options":["Wise and careful","Loud and excited","Temporary","Careless"],"answer":"Wise and careful","explanation":"A prudent choice is sensible and made with good judgment.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_020","question":"The word 'adequate' most nearly means:","options":["Enough for the purpose","Too old to use","Difficult to explain","Completely empty"],"answer":"Enough for the purpose","explanation":"Adequate means sufficient or good enough to meet a need.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_021","question":"In the sentence, 'The supervisor gave a candid report about the delays,' the word 'candid' most nearly means:","options":["Honest","Lengthy","Confusing","Secret"],"answer":"Honest","explanation":"A candid report is direct and honest, even if the information is unpleasant.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_022","question":"In the sentence, 'The mechanic made a temporary repair until the correct part arrived,' the word 'temporary' most nearly means:","options":["Not permanent","Very expensive","Difficult to see","Improperly installed"],"answer":"Not permanent","explanation":"Temporary means lasting only for a limited time.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_023","question":"In the sentence, 'The evidence was insufficient to prove the claim,' the word 'insufficient' most nearly means:","options":["Not enough","Too heavy","Unusually bright","Completely accurate"],"answer":"Not enough","explanation":"Insufficient means lacking enough quantity or quality for a purpose.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_024","question":"In the sentence, 'The new rule was implemented after several accidents,' the word 'implemented' most nearly means:","options":["Put into effect","Repeated out loud","Forgotten on purpose","Measured carefully"],"answer":"Put into effect","explanation":"To implement a rule is to begin using or enforcing it.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_025","question":"In the sentence, 'The witness gave a vague description of the vehicle,' the word 'vague' most nearly means:","options":["Not clear","Very detailed","Completely false","Loudly stated"],"answer":"Not clear","explanation":"A vague description lacks clear details.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_026","question":"In the sentence, 'The team postponed the inspection because of severe weather,' the word 'postponed' most nearly means:","options":["Delayed","Completed","Cancelled forever","Approved"],"answer":"Delayed","explanation":"To postpone is to delay something until a later time.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_027","question":"In the sentence, 'The equipment failure was attributed to poor maintenance,' the word 'attributed' most nearly means:","options":["Connected as a cause","Hidden from view","Returned to storage","Checked for price"],"answer":"Connected as a cause","explanation":"If something is attributed to a cause, that cause is identified as the reason for it.","difficulty":"hard","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_028","question":"In the sentence, 'The instructions were explicit, so there was little room for confusion,' the word 'explicit' most nearly means:","options":["Clearly stated","Quickly forgotten","Poorly written","Secretly changed"],"answer":"Clearly stated","explanation":"Explicit instructions are clear, direct, and detailed.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_029","question":"In the sentence, 'The shortage of spare parts forced the crew to conserve supplies,' the word 'conserve' most nearly means:","options":["Use carefully to avoid waste","Throw away","Count twice","Replace immediately"],"answer":"Use carefully to avoid waste","explanation":"To conserve resources is to protect them from waste or overuse.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_030","question":"In the sentence, 'The contractor was liable for damage caused by careless work,' the word 'liable' most nearly means:","options":["Legally responsible","Highly skilled","Easily available","Unable to pay"],"answer":"Legally responsible","explanation":"Liable means legally responsible for something.","difficulty":"hard","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_031","question":"The word 'peril' most nearly means:","options":["Danger","Comfort","Payment","Agreement"],"answer":"Danger","explanation":"Peril means serious danger or risk.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_032","question":"The word 'compensate' most nearly means:","options":["Make up for","Take apart","Speak softly","Move backward"],"answer":"Make up for","explanation":"To compensate is to offset, pay for, or make up for something.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_033","question":"The word 'hostile' most nearly means:","options":["Unfriendly","Patient","Useful","Hidden"],"answer":"Unfriendly","explanation":"Hostile means unfriendly, opposing, or aggressive.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_034","question":"The word 'anticipate' most nearly means:","options":["Expect","Regret","Repair","Divide"],"answer":"Expect","explanation":"To anticipate is to expect or prepare for something before it happens.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_035","question":"The word 'emphasize' most nearly means:","options":["Stress the importance of","Hide completely","Make smaller","Prove false"],"answer":"Stress the importance of","explanation":"To emphasize something is to give it special importance or attention.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_036","question":"The word 'erratic' most nearly means:","options":["Unpredictable","Very accurate","Easy to repair","Deeply buried"],"answer":"Unpredictable","explanation":"Erratic behavior is irregular and hard to predict.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_037","question":"The word 'sustain' most nearly means:","options":["Maintain or support","Destroy quickly","Forget entirely","Measure roughly"],"answer":"Maintain or support","explanation":"To sustain something is to keep it going or support it over time.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_038","question":"The word 'discard' most nearly means:","options":["Throw away","Look closely","Begin again","Bring together"],"answer":"Throw away","explanation":"To discard something is to get rid of it.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_039","question":"The word 'precise' most nearly means:","options":["Exact","Ordinary","Late","Weak"],"answer":"Exact","explanation":"Precise means exact, accurate, or clearly defined.","difficulty":"medium","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_040","question":"The word 'deficient' most nearly means:","options":["Lacking enough","Very sharp","Recently cleaned","Fully prepared"],"answer":"Lacking enough","explanation":"Deficient means lacking a needed amount or quality.","difficulty":"hard","skillTag":"synonym","afqtRelevant":true,"realismTier":"asvab_style","topic":"synonym"},{"id":"afqt_wk_real_041","question":"In the sentence, 'The technician isolated the faulty cable before replacing it,' the word 'isolated' most nearly means:","options":["Separated from others","Made stronger","Covered with paint","Measured for length"],"answer":"Separated from others","explanation":"To isolate a faulty part means to identify and separate it from the rest of the system.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_042","question":"In the sentence, 'The captain rejected the proposal because it was impractical,' the word 'impractical' most nearly means:","options":["Not useful or realistic","Clearly written","Easy to complete","Already approved"],"answer":"Not useful or realistic","explanation":"Impractical means not sensible, useful, or realistic for the situation.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_043","question":"In the sentence, 'The company issued a revised schedule after the shipment was delayed,' the word 'revised' most nearly means:","options":["Changed or corrected","Hidden from workers","Made illegal","Sent overseas"],"answer":"Changed or corrected","explanation":"Revised means changed, updated, or corrected.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_044","question":"In the sentence, 'The officer's explanation was plausible, but it still needed proof,' the word 'plausible' most nearly means:","options":["Reasonable or believable","Completely proven","Obviously false","Too short"],"answer":"Reasonable or believable","explanation":"Plausible means seeming reasonable or believable, even if not yet proven.","difficulty":"hard","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_045","question":"In the sentence, 'The old pipes were susceptible to freezing during winter,' the word 'susceptible' most nearly means:","options":["Likely to be affected","Impossible to damage","Already replaced","Easy to locate"],"answer":"Likely to be affected","explanation":"Susceptible means likely or vulnerable to being affected by something.","difficulty":"hard","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_046","question":"In the sentence, 'The plan required continual monitoring to prevent errors,' the word 'continual' most nearly means:","options":["Repeated or ongoing","Rare","Final","Invisible"],"answer":"Repeated or ongoing","explanation":"Continual means happening repeatedly or continuing over time.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_047","question":"In the sentence, 'The warehouse used labels to distinguish hazardous materials from ordinary supplies,' the word 'distinguish' most nearly means:","options":["Tell apart","Carry away","Make heavier","Use up"],"answer":"Tell apart","explanation":"To distinguish things is to recognize how they are different.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_048","question":"In the sentence, 'The warning signs were intended to mitigate the risk of injury,' the word 'mitigate' most nearly means:","options":["Make less severe","Make more likely","Hide completely","Measure exactly"],"answer":"Make less severe","explanation":"To mitigate risk is to reduce its severity or impact.","difficulty":"hard","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_049","question":"In the sentence, 'The new procedure was mandatory for all workers,' the word 'mandatory' most nearly means:","options":["Required","Optional","Temporary","Secret"],"answer":"Required","explanation":"Mandatory means required or compulsory.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"},{"id":"afqt_wk_real_050","question":"In the sentence, 'The inspector found a minor defect that did not affect safety,' the word 'minor' most nearly means:","options":["Small or not serious","Hidden","Dangerous","Expensive"],"answer":"Small or not serious","explanation":"Minor means small in size, amount, or seriousness.","difficulty":"medium","skillTag":"context_meaning","afqtRelevant":true,"realismTier":"asvab_style","topic":"context_meaning"}],"Paragraph Comprehension (PC)":[{"id":"asvab_pc_001","question":"Read the paragraph: The city library extended its evening hours after many residents said they could not visit during the day. Since the change, more students and working adults have used the library after 6 p.m. What is the main idea of the paragraph?","options":["The library changed its hours to better serve residents","Students no longer visit the library during the day","The library removed its evening programs","Working adults do not like reading"],"answer":"The library changed its hours to better serve residents","explanation":"The paragraph explains that the library extended evening hours because residents needed more convenient access.","skillTag":"main_idea","topic":"main_idea","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_002","question":"Read the paragraph: Marcus checks the oil in his truck every other week. He also keeps a small notebook where he records repairs, mileage, and fuel use. His careful records help him notice problems before they become expensive. What can you infer about Marcus?","options":["He is careless with his truck","He takes vehicle maintenance seriously","He only drives on weekends","He dislikes keeping records"],"answer":"He takes vehicle maintenance seriously","explanation":"Marcus checks oil and tracks repairs, mileage, and fuel use, which shows he is careful about maintenance.","skillTag":"inference","topic":"inference","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_003","question":"Read the paragraph: During the storm, several branches fell across the road. The town crew arrived with saws and safety cones. Within an hour, traffic was moving normally again. What happened first?","options":["Traffic moved normally again","The town crew arrived","Branches fell across the road","Safety cones were removed"],"answer":"Branches fell across the road","explanation":"The paragraph begins by saying branches fell across the road during the storm, before the crew arrived.","skillTag":"sequence","topic":"sequence","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_004","question":"Read the paragraph: The new warehouse uses motion-sensor lights to reduce electricity use. The lights turn on only when someone enters an area and turn off automatically after several minutes. What is the purpose of the motion-sensor lights?","options":["To make the warehouse warmer","To reduce electricity use","To increase the number of workers","To keep doors locked"],"answer":"To reduce electricity use","explanation":"The paragraph directly states that the lights are used to reduce electricity use.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_005","question":"Read the paragraph: Carla thought the instructions for assembling the table were confusing. She read each step twice, sorted the screws by size, and laid out all the parts before beginning. By working slowly, she finished the table without mistakes. Which statement best describes Carla?","options":["She solved the problem by being organized","She ignored the instructions","She returned the table to the store","She finished quickly by guessing"],"answer":"She solved the problem by being organized","explanation":"Carla handled the confusing instructions by sorting parts, reading carefully, and working slowly.","skillTag":"inference","topic":"inference","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_006","question":"Read the paragraph: Some desert animals are active mostly at night. This behavior helps them avoid the extreme heat of the day and conserve water. What is the main reason some desert animals are active at night?","options":["To avoid daytime heat","To find more sunlight","To build larger homes","To scare predators"],"answer":"To avoid daytime heat","explanation":"The paragraph says nighttime activity helps desert animals avoid extreme daytime heat and conserve water.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_007","question":"Read the paragraph: After the factory installed new air filters, dust levels inside the building dropped sharply. Workers reported fewer breathing problems, and equipment needed less frequent cleaning. What was one result of installing the filters?","options":["Workers reported fewer breathing problems","The factory closed permanently","Equipment became harder to clean","Dust levels increased sharply"],"answer":"Workers reported fewer breathing problems","explanation":"The paragraph states that after the filters were installed, workers had fewer breathing problems.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_008","question":"Read the paragraph: The old bridge was narrow and difficult for large trucks to cross. After several complaints from drivers, the county approved a plan to build a wider bridge. What problem is the county trying to solve?","options":["The bridge is too narrow for some traffic","The river has dried up","Drivers want fewer roads","The county has too many bridges"],"answer":"The bridge is too narrow for some traffic","explanation":"The paragraph explains that large trucks had trouble crossing because the bridge was narrow.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_009","question":"Read the paragraph: Elena wanted to improve her typing speed. Each evening, she practiced for twenty minutes using timed exercises. After two months, she could type twice as many words per minute as before. What caused Elena's typing speed to improve?","options":["Daily practice","A shorter keyboard","Fewer assignments","A new desk"],"answer":"Daily practice","explanation":"The paragraph connects Elena's regular evening practice with her improved typing speed.","skillTag":"sequence","topic":"sequence","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_010","question":"Read the paragraph: The restaurant began labeling menu items that contained nuts, dairy, or wheat. Customers with food allergies said the labels helped them order safely and quickly. What is the best title for the paragraph?","options":["Menu Labels Help Customers Avoid Allergens","Restaurants Stop Serving Dinner","Customers Prefer Smaller Menus","Food Prices Rise Quickly"],"answer":"Menu Labels Help Customers Avoid Allergens","explanation":"The paragraph focuses on menu labels that help customers with allergies choose food safely.","skillTag":"main_idea","topic":"main_idea","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_011","question":"Read the paragraph: The mechanic listened to the engine before opening the hood. A clicking sound suggested that the battery connection might be loose. After tightening the cable, the engine started normally. What did the mechanic do after hearing the clicking sound?","options":["Tightened the cable","Painted the truck","Changed the tires","Washed the engine"],"answer":"Tightened the cable","explanation":"The mechanic identified a possible loose connection and tightened the cable, which fixed the problem.","skillTag":"inference","topic":"inference","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_012","question":"Read the paragraph: Many birds migrate when the seasons change. They travel to areas with better food supplies and safer nesting conditions. What does the word 'migrate' most likely mean in this paragraph?","options":["Move from one region to another","Sleep for the winter","Build stronger wings","Change color"],"answer":"Move from one region to another","explanation":"The paragraph says birds travel to other areas, so 'migrate' means to move from one region to another.","skillTag":"inference","topic":"inference","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_013","question":"Read the paragraph: The instructor reminded the trainees to wear gloves and goggles before entering the workshop. Sharp tools and flying particles could cause injuries if proper protection was not used. What is the instructor mainly concerned about?","options":["Safety","Speed","Decoration","Noise"],"answer":"Safety","explanation":"The instructor emphasizes protective gear because of possible injuries.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_014","question":"Read the paragraph: A small leak in a pipe may seem unimportant, but over time it can waste hundreds of gallons of water. Repairing leaks quickly helps reduce water bills and conserve resources. What is the author's point?","options":["Small leaks should be repaired quickly","Water bills cannot be reduced","Leaks improve pipe performance","All pipes should be replaced monthly"],"answer":"Small leaks should be repaired quickly","explanation":"The paragraph explains that small leaks waste water and cost money, so quick repair is important.","skillTag":"main_idea","topic":"main_idea","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_015","question":"Read the paragraph: The hiking trail was closed after heavy rain washed away part of the path. Park officials said it would reopen after repairs made the trail safe again. Why was the trail closed?","options":["Part of the path was washed away","The park ran out of maps","Hikers requested a longer trail","The weather became too sunny"],"answer":"Part of the path was washed away","explanation":"The paragraph states that heavy rain washed away part of the path, making repairs necessary.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_016","question":"Read the paragraph: The school cafeteria replaced plastic trays with reusable metal trays. Although the metal trays cost more at first, they reduced the amount of daily trash. What is one advantage of the metal trays?","options":["They reduce daily trash","They are thrown away after use","They are cheaper at first","They eliminate the need for lunch"],"answer":"They reduce daily trash","explanation":"The paragraph says the reusable trays lowered the amount of daily trash.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_017","question":"Read the paragraph: When the power went out, Jamal used a flashlight to find candles and matches. He then checked on his elderly neighbor to make sure she was safe. What can be inferred about Jamal?","options":["He is thoughtful and prepared","He caused the power outage","He dislikes his neighbor","He was unable to find light"],"answer":"He is thoughtful and prepared","explanation":"Jamal had a flashlight, found supplies, and checked on his neighbor, showing preparation and concern.","skillTag":"inference","topic":"inference","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_018","question":"Read the paragraph: The instruction manual warns users not to operate the machine without the guard in place. The guard keeps hands away from moving blades. What is the guard's purpose?","options":["To prevent injury","To make the machine louder","To sharpen the blades","To increase fuel use"],"answer":"To prevent injury","explanation":"The guard keeps hands away from moving blades, so its purpose is safety.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_019","question":"Read the paragraph: The delivery driver planned the route before leaving the warehouse. By grouping nearby stops together, she reduced fuel use and finished earlier than expected. What strategy helped the driver finish earlier?","options":["Grouping nearby stops together","Driving without a route","Returning to the warehouse after each stop","Skipping all small packages"],"answer":"Grouping nearby stops together","explanation":"The paragraph states that grouping nearby stops reduced fuel use and helped her finish early.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_020","question":"Read the paragraph: The museum placed signs near fragile exhibits asking visitors not to touch them. Oils from human hands can damage old paper, fabric, and paint. Why should visitors avoid touching the exhibits?","options":["Touching can damage them","The exhibits are too heavy","Visitors may get lost","The signs are decorative"],"answer":"Touching can damage them","explanation":"The paragraph explains that oils from hands can harm fragile materials.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_021","question":"Read the paragraph: The town added bike lanes on several busy streets. Officials hoped the lanes would make cycling safer and encourage more people to ride bikes instead of driving. What is one goal of adding bike lanes?","options":["To encourage more people to ride bikes","To remove all cars from town","To make streets narrower for trucks","To stop people from exercising"],"answer":"To encourage more people to ride bikes","explanation":"The paragraph directly says officials wanted to encourage more people to bike instead of drive.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_022","question":"Read the paragraph: Luis noticed that the office printer jammed whenever thick paper was used. He checked the settings and changed the paper type before printing again. The next print job finished without a jam. What was the likely cause of the printer problem?","options":["The paper setting was wrong for thick paper","The printer had no ink","The office had no electricity","The paper was too white"],"answer":"The paper setting was wrong for thick paper","explanation":"The printer worked after Luis changed the paper type setting, so the wrong setting was likely the cause.","skillTag":"sequence","topic":"sequence","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_023","question":"Read the paragraph: The nurse told patients to complete the full course of antibiotics, even if they felt better after a few days. Stopping early can allow some bacteria to survive and return stronger. What is the main instruction?","options":["Finish all prescribed antibiotics","Stop medicine as soon as symptoms improve","Take antibiotics only with juice","Avoid asking questions about medicine"],"answer":"Finish all prescribed antibiotics","explanation":"The nurse's main instruction is to complete the full course of antibiotics.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_024","question":"Read the paragraph: The shop owner lowered the price of winter coats in March. Since warmer weather was approaching, fewer customers were looking for heavy clothing. Why did the owner lower the price?","options":["Demand for winter coats was likely decreasing","The coats were damaged","The store stopped selling clothing","Customers wanted heavier coats"],"answer":"Demand for winter coats was likely decreasing","explanation":"Warmer weather means fewer people need winter coats, so lowering the price helps sell them.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_025","question":"Read the paragraph: Before painting the wall, Dana washed it, filled small holes, and taped the edges. These steps took extra time, but the finished paint job looked smooth and professional. What does the paragraph suggest?","options":["Preparation improves results","Painting should always be rushed","Walls should not be cleaned","Tape damages every wall"],"answer":"Preparation improves results","explanation":"Dana's careful preparation led to a better finished paint job.","skillTag":"inference","topic":"inference","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_026","question":"Read the paragraph: The farmer planted cover crops after the harvest. These plants protected the soil from erosion and added nutrients before the next growing season. What are cover crops used for?","options":["Protecting and improving soil","Feeding only large animals","Blocking all sunlight permanently","Replacing farm equipment"],"answer":"Protecting and improving soil","explanation":"The paragraph states that cover crops prevent erosion and add nutrients to the soil.","skillTag":"sequence","topic":"sequence","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_027","question":"Read the paragraph: The customer read several reviews before buying the drill. Many reviewers praised its battery life but said it was heavier than similar models. What is one possible disadvantage of the drill?","options":["It is heavier than similar models","It has poor battery life","It cannot drill holes","It has no reviews"],"answer":"It is heavier than similar models","explanation":"The paragraph says reviewers liked the battery life but noted the drill was heavier than similar models.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_028","question":"Read the paragraph: The coach told the team that skill alone would not win games. Players also needed discipline, teamwork, and steady effort during practice. What does the coach believe?","options":["Success requires more than skill","Practice is unnecessary","Teamwork hurts performance","Only the fastest player matters"],"answer":"Success requires more than skill","explanation":"The coach says skill alone is not enough and adds discipline, teamwork, and effort as important factors.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_029","question":"Read the paragraph: The office moved frequently used supplies to a cabinet near the copy machine. Employees no longer had to walk across the room for paper, folders, or staples. What was the result of moving the supplies?","options":["Employees saved time","Employees stopped using supplies","The copy machine was removed","The cabinet became empty"],"answer":"Employees saved time","explanation":"Because supplies were closer to where they were needed, employees did not have to walk as far.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_030","question":"Read the paragraph: The weather report warned of freezing temperatures overnight. Homeowners were advised to cover outdoor plants and disconnect garden hoses. What is the likely reason for this advice?","options":["Cold weather can damage plants and hoses","Plants grow faster in freezing weather","Garden hoses should always be connected","The weather would be hot and dry"],"answer":"Cold weather can damage plants and hoses","explanation":"The advice is connected to freezing temperatures, which can harm plants and damage hoses.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_031","question":"Read the paragraph: A strong password should not include obvious information such as a birthday or pet's name. It is safer to use a mix of letters, numbers, and symbols. What is the paragraph mainly about?","options":["Creating safer passwords","Choosing pet names","Remembering birthdays","Buying a new computer"],"answer":"Creating safer passwords","explanation":"The paragraph gives advice about making passwords harder to guess.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_032","question":"Read the paragraph: The electrician turned off the power at the breaker before replacing the outlet. This step prevented electric current from flowing through the wires while he worked. Why did the electrician turn off the power?","options":["To work safely","To make the outlet brighter","To test the wall color","To increase the current"],"answer":"To work safely","explanation":"Turning off the breaker stops current from flowing, which reduces the danger of electric shock.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_033","question":"Read the paragraph: The bakery opens at 5 a.m. so bread can be ready for morning customers. Bakers arrive even earlier to mix dough, heat ovens, and prepare displays. What can be concluded about the bakery?","options":["Preparation begins before the store opens","Bread is made only at night","Customers are not allowed in the morning","The bakery does not use ovens"],"answer":"Preparation begins before the store opens","explanation":"The paragraph says bakers arrive before 5 a.m. to prepare bread and displays.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_034","question":"Read the paragraph: The city planted trees along the sidewalk to provide shade. In summer, shaded sidewalks are cooler and more comfortable for pedestrians. What is the main benefit of the trees?","options":["They make sidewalks cooler","They block all traffic","They remove the need for roads","They prevent rain from falling"],"answer":"They make sidewalks cooler","explanation":"The paragraph explains that shade from trees makes sidewalks cooler and more comfortable.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_035","question":"Read the paragraph: Rosa compared prices at three stores before buying a microwave. One store offered the lowest price, but another included free delivery. Rosa chose the second store because delivery would have cost more than the price difference. Why did Rosa choose the second store?","options":["Free delivery made it the better deal","It had the highest microwave price","She did not compare prices","The microwave was used"],"answer":"Free delivery made it the better deal","explanation":"Although the second store did not have the lowest price, free delivery saved more money overall.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_036","question":"Read the paragraph: The new employee asked questions whenever a procedure was unclear. Her supervisor appreciated this because mistakes were easier to prevent than correct. What does the supervisor value?","options":["Asking questions to avoid mistakes","Guessing when confused","Working without instructions","Correcting mistakes slowly"],"answer":"Asking questions to avoid mistakes","explanation":"The supervisor appreciated questions because they helped prevent errors.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_037","question":"Read the paragraph: The fence was repaired after several cattle escaped through a broken section. The rancher added stronger posts and checked the remaining fence line for weak spots. What problem led to the repair?","options":["Cattle escaped through a broken section","The cattle needed more food","The rancher wanted a shorter fence","The posts were painted"],"answer":"Cattle escaped through a broken section","explanation":"The paragraph says the repair happened after cattle escaped through a broken part of the fence.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_038","question":"Read the paragraph: The company switched to electronic invoices to save paper and reduce mailing costs. Customers now receive bills by email unless they request paper copies. What change did the company make?","options":["It began sending invoices electronically","It stopped billing customers","It doubled mailing costs","It required paper copies for everyone"],"answer":"It began sending invoices electronically","explanation":"The paragraph says the company switched to electronic invoices and sends bills by email.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_039","question":"Read the paragraph: The lifeguard cleared the pool when thunder was heard nearby. Even if lightning seems distant, water and wet surfaces can make swimming dangerous during a storm. Why was the pool cleared?","options":["A storm created a safety risk","The water was too warm","The pool was closing forever","Swimmers requested colder water"],"answer":"A storm created a safety risk","explanation":"The lifeguard acted because thunder and possible lightning made swimming unsafe.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_040","question":"Read the paragraph: A well-organized toolbox saves time because each tool has a regular place. When tools are returned after use, workers spend less time searching and more time completing the job. What is the main idea?","options":["Organization helps workers save time","Toolboxes should be thrown away","Workers should use fewer tools","Searching for tools improves work"],"answer":"Organization helps workers save time","explanation":"The paragraph explains that keeping tools organized reduces searching and improves efficiency.","skillTag":"main_idea","topic":"main_idea","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_041","question":"Read the paragraph: The road crew spread salt before the snow began. Salt lowers the freezing point of water, which helps prevent ice from forming on the pavement. Why did the crew spread salt early?","options":["To help prevent ice from forming","To make the road darker","To clean the road signs","To melt the pavement"],"answer":"To help prevent ice from forming","explanation":"The paragraph says salt helps prevent ice by lowering the freezing point of water.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_042","question":"Read the paragraph: The young tree was tied to a stake after planting. The stake helped keep the trunk upright until the roots grew strong enough to support it. What was the purpose of the stake?","options":["To support the tree","To stop the roots from growing","To make the tree shorter","To remove water from the soil"],"answer":"To support the tree","explanation":"The stake held the trunk upright while the roots became stronger.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_043","question":"Read the paragraph: The shipping clerk weighed each package before printing a label. Heavier packages required more postage, so guessing the weight could lead to underpaying or overpaying. Why did the clerk weigh each package?","options":["To determine the correct postage","To decide the package color","To avoid printing labels","To make packages heavier"],"answer":"To determine the correct postage","explanation":"The paragraph explains that postage depends on package weight.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_044","question":"Read the paragraph: The mechanic replaced the worn brake pads because they were making a grinding noise. Ignoring the noise could have damaged the rotors and made repairs more expensive. What does the paragraph suggest about fixing brake problems early?","options":["It can prevent more costly damage","It always makes brakes louder","It causes rotors to fail","It is unnecessary if the car still moves"],"answer":"It can prevent more costly damage","explanation":"The paragraph says ignoring the noise could damage rotors and increase repair costs.","skillTag":"inference","topic":"inference","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_045","question":"Read the paragraph: The campground requires visitors to store food in sealed containers. This rule helps prevent animals from being attracted to campsites. What is the reason for the rule?","options":["To keep animals away from campsites","To make food cook faster","To reduce the number of tents","To stop visitors from eating"],"answer":"To keep animals away from campsites","explanation":"The paragraph says sealed containers prevent animals from being attracted to campsites.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_046","question":"Read the paragraph: The manager scheduled extra cashiers during the holiday sale. Large crowds were expected, and shorter checkout lines would improve customer satisfaction. What was the manager trying to do?","options":["Reduce checkout wait times","Close the store earlier","Sell fewer items","Remove customer service"],"answer":"Reduce checkout wait times","explanation":"Extra cashiers would help handle large crowds and make checkout lines shorter.","skillTag":"detail_comprehension","topic":"detail_comprehension","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_pc_047","question":"Read the paragraph: The firefighter crawled low through the smoky hallway. Smoke rises, so the air closer to the floor is usually easier to breathe and see through. Why did the firefighter stay low?","options":["The air near the floor was safer","The floor was hotter than the ceiling","Smoke stays only near the floor","The hallway was too short"],"answer":"The air near the floor was safer","explanation":"Since smoke rises, staying low can provide clearer and safer air.","skillTag":"cause_effect","topic":"cause_effect","difficulty":"
