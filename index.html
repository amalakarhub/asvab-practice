ns":["Watt","Newton","Meter","Gram"],"answer":"Watt","explanation":"Power is measured in watts, which represent joules per second.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_018","question":"What is torque?","options":["A twisting or turning force","A straight-line distance","The amount of heat in a liquid","The weight of a gear"],"answer":"A twisting or turning force","explanation":"Torque is a force that causes rotation around an axis or pivot.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_019","question":"Which action increases torque when using a wrench?","options":["Using a longer wrench","Using a shorter wrench","Pushing closer to the bolt","Removing the handle"],"answer":"Using a longer wrench","explanation":"A longer wrench increases the distance from the pivot, which increases torque.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_020","question":"What is friction?","options":["A force that opposes motion between surfaces","A force that always speeds objects up","The weight of an object","The amount of air in a tire"],"answer":"A force that opposes motion between surfaces","explanation":"Friction resists motion when two surfaces rub against each other.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_021","question":"What usually happens when friction increases?","options":["More heat is produced","Gravity disappears","Mass decreases","Work becomes zero"],"answer":"More heat is produced","explanation":"Friction often converts motion energy into heat.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_022","question":"What is the purpose of lubrication?","options":["To reduce friction between moving parts","To increase rust","To make parts heavier","To stop all rotation"],"answer":"To reduce friction between moving parts","explanation":"Lubrication reduces friction and wear between surfaces that move against each other.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_023","question":"What does a pulley do?","options":["Changes the direction of a force","Creates fuel","Removes gravity","Measures temperature"],"answer":"Changes the direction of a force","explanation":"A pulley can change the direction of a pulling force and, in some systems, reduce the effort needed.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_024","question":"What is a fixed pulley mainly used for?","options":["Changing the direction of force","Multiplying force by four always","Creating electrical current","Increasing the weight of the load"],"answer":"Changing the direction of force","explanation":"A fixed pulley changes the direction of the pull but does not greatly reduce the force needed.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_025","question":"What is the advantage of a movable pulley?","options":["It reduces the force needed to lift a load","It eliminates the load's weight","It turns heat into sound","It prevents all motion"],"answer":"It reduces the force needed to lift a load","explanation":"A movable pulley shares the load between rope sections, reducing the effort needed.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_026","question":"What is a block and tackle?","options":["A system of pulleys used to lift heavy loads","A type of hammer","A single fixed gear","A hydraulic brake pad"],"answer":"A system of pulleys used to lift heavy loads","explanation":"A block and tackle uses multiple pulleys to gain mechanical advantage.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_027","question":"If two meshed gears are the same size, what happens to their speeds?","options":["They turn at the same speed","The second gear always stops","The larger one turns faster","They both turn in the same direction"],"answer":"They turn at the same speed","explanation":"Equal-size gears have the same rotational speed, but they turn in opposite directions.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_028","question":"When two gears mesh, what happens to their directions of rotation?","options":["They rotate in opposite directions","They rotate in the same direction","They stop immediately","They rotate randomly"],"answer":"They rotate in opposite directions","explanation":"Two gears in direct contact rotate in opposite directions.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_029","question":"If a small gear drives a larger gear, what happens to the larger gear?","options":["It turns slower with more torque","It turns faster with less torque","It stops moving","It loses all force"],"answer":"It turns slower with more torque","explanation":"A larger driven gear turns slower than the small driving gear, but torque increases.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_030","question":"If a large gear drives a smaller gear, what happens to the smaller gear?","options":["It turns faster with less torque","It turns slower with more torque","It stops moving","It changes into a pulley"],"answer":"It turns faster with less torque","explanation":"A smaller driven gear turns faster than the large driving gear, but it has less torque.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_031","question":"What is the purpose of a gear train?","options":["To transmit motion and change speed or torque","To store liquid","To measure pressure only","To remove all friction"],"answer":"To transmit motion and change speed or torque","explanation":"A gear train transfers rotational motion and can change speed, direction, or torque.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_032","question":"What is a wheel and axle used for?","options":["Reducing effort needed to move or turn objects","Stopping all mechanical motion","Increasing friction only","Measuring liquid pressure"],"answer":"Reducing effort needed to move or turn objects","explanation":"A wheel and axle helps move loads or turn parts with less effort.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_033","question":"Which device is an example of a wheel and axle?","options":["Doorknob","Ramp","Wedge","Spring"],"answer":"Doorknob","explanation":"A doorknob works as a wheel and axle because turning the knob rotates the shaft.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_034","question":"What is a wedge?","options":["A simple machine used to split or cut material","A circular machine used to store energy","A spring used to absorb shock","A tool used only to measure angles"],"answer":"A simple machine used to split or cut material","explanation":"A wedge changes a pushing force into forces that split, cut, or separate material.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_035","question":"Which item is an example of a wedge?","options":["Axe blade","Pulley","Wheel","Gear"],"answer":"Axe blade","explanation":"An axe blade is a wedge because it forces material apart as it enters.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_036","question":"What is a screw?","options":["An inclined plane wrapped around a cylinder","A pulley wrapped around a lever","A gear with no teeth","A spring with no force"],"answer":"An inclined plane wrapped around a cylinder","explanation":"A screw is basically an inclined plane wrapped around a shaft.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_037","question":"What is the main purpose of threads on a screw?","options":["To convert turning motion into linear motion","To remove all friction","To make the screw magnetic","To reduce the screw's length"],"answer":"To convert turning motion into linear motion","explanation":"Threads allow a screw to move forward or backward as it is turned.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_038","question":"What does a spring do when compressed or stretched?","options":["Stores mechanical energy","Destroys mechanical energy","Stops gravity","Removes all force"],"answer":"Stores mechanical energy","explanation":"A spring stores energy when it is compressed or stretched and releases it when it returns to shape.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_039","question":"What is center of gravity?","options":["The point where an object's weight is balanced","The fastest point on an object","The hottest point on a machine","The point where friction disappears"],"answer":"The point where an object's weight is balanced","explanation":"The center of gravity is the balance point of an object's weight.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_040","question":"An object is usually more stable when its center of gravity is:","options":["Low and over a wide base","High and outside the base","High and narrow","Moving constantly"],"answer":"Low and over a wide base","explanation":"A low center of gravity and wide base make an object harder to tip over.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_041","question":"What is pressure?","options":["Force divided by area","Area divided by force","Speed divided by time","Distance multiplied by temperature"],"answer":"Force divided by area","explanation":"Pressure equals force spread over an area.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_042","question":"If the same force is applied over a smaller area, what happens to pressure?","options":["Pressure increases","Pressure decreases","Pressure becomes zero","Pressure changes into torque"],"answer":"Pressure increases","explanation":"Pressure increases when the same force is concentrated over a smaller area.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_043","question":"Why does a sharp knife cut better than a dull knife?","options":["It applies force over a smaller area","It weighs less than all dull knives","It removes friction completely","It changes gravity"],"answer":"It applies force over a smaller area","explanation":"A sharp edge concentrates force over a smaller area, creating greater pressure.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_044","question":"What principle explains how hydraulic systems transmit pressure through a fluid?","options":["Pascal's principle","Newton's third law only","Archimedes' heat law","Ohm's law"],"answer":"Pascal's principle","explanation":"Pascal's principle says pressure applied to a confined fluid is transmitted equally throughout the fluid.","skillTag":"fluids_pressure","topic":"fluids_pressure","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_045","question":"What is one advantage of a hydraulic system?","options":["It can multiply force","It needs no fluid","It works only in a vacuum","It removes all pressure"],"answer":"It can multiply force","explanation":"Hydraulic systems can use fluid pressure and different piston sizes to multiply force.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_046","question":"In a hydraulic lift, why can a small force lift a heavy load?","options":["Pressure acts on a larger output piston","The load has no weight","The fluid becomes solid","Gravity stops acting"],"answer":"Pressure acts on a larger output piston","explanation":"A small input force creates pressure, and that pressure acts over a larger piston area to make a larger output force.","skillTag":"levers","topic":"levers","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_047","question":"What is the purpose of a bearing?","options":["To reduce friction between moving parts","To increase rust","To block rotation","To store fuel"],"answer":"To reduce friction between moving parts","explanation":"Bearings support moving parts and reduce friction during motion.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_048","question":"What is the purpose of a flywheel?","options":["To store rotational energy and smooth motion","To stop the engine immediately","To pump hydraulic fluid","To increase friction in brakes"],"answer":"To store rotational energy and smooth motion","explanation":"A flywheel stores rotating energy and helps keep motion steady.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_049","question":"What does inertia mean?","options":["An object's resistance to changes in motion","The amount of heat in a spring","The color of a machine part","The pressure inside a tank only"],"answer":"An object's resistance to changes in motion","explanation":"Inertia is the tendency of an object to stay at rest or keep moving unless acted on by a force.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_050","question":"What happens to acceleration if the same force is applied to a heavier object?","options":["Acceleration decreases","Acceleration increases","Acceleration becomes infinite","Acceleration is unaffected by mass"],"answer":"Acceleration decreases","explanation":"For the same force, a larger mass accelerates less because acceleration equals force divided by mass.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_051","question":"What is kinetic energy?","options":["Energy of motion","Stored energy due to position","Energy only in springs","Energy only in fuel"],"answer":"Energy of motion","explanation":"Kinetic energy is the energy an object has because it is moving.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_052","question":"What is potential energy?","options":["Stored energy","Energy of motion only","Energy lost to sound only","Energy that cannot be used"],"answer":"Stored energy","explanation":"Potential energy is stored energy, often due to position, height, or compression.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_053","question":"Which object has more gravitational potential energy?","options":["A box on a high shelf","The same box on the floor","The same box sliding sideways on the floor","The same box broken into pieces"],"answer":"A box on a high shelf","explanation":"An object higher above the ground has more gravitational potential energy.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_054","question":"What does a brake system do?","options":["Converts motion energy into heat through friction","Creates fuel from motion","Removes the vehicle's weight","Makes tires spin faster"],"answer":"Converts motion energy into heat through friction","explanation":"Brakes use friction to slow motion, changing kinetic energy into heat.","skillTag":"mechanical_principles","topic":"mechanical_principles","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_055","question":"What is the purpose of a clutch?","options":["To connect and disconnect rotating power","To increase tire pressure","To cool hydraulic fluid","To measure force"],"answer":"To connect and disconnect rotating power","explanation":"A clutch allows rotating power to be engaged or disengaged between parts.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_056","question":"What is the purpose of a belt drive?","options":["To transfer motion between pulleys","To measure fluid pressure","To cut metal","To reduce gravity"],"answer":"To transfer motion between pulleys","explanation":"A belt drive uses a belt and pulleys to transfer rotational motion.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_057","question":"If two pulleys are connected by an uncrossed belt, how do they rotate?","options":["In the same direction","In opposite directions","Only the small pulley rotates","Neither pulley rotates"],"answer":"In the same direction","explanation":"An uncrossed belt causes both pulleys to rotate in the same direction.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_058","question":"If two pulleys are connected by a crossed belt, how do they rotate?","options":["In opposite directions","In the same direction","Only the large pulley rotates","They do not rotate"],"answer":"In opposite directions","explanation":"A crossed belt reverses the direction of rotation between the pulleys.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_059","question":"What is the purpose of a chain drive?","options":["To transmit power without much slipping","To store compressed air","To remove all load","To measure temperature"],"answer":"To transmit power without much slipping","explanation":"A chain drive uses chain links and sprockets to transfer power with less slipping than many belt drives.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_060","question":"What is buoyancy?","options":["The upward force a fluid exerts on an object","The downward force of friction","The twisting force on a shaft","The force that stops all motion"],"answer":"The upward force a fluid exerts on an object","explanation":"Buoyancy is the upward force from a fluid that helps objects float or feel lighter in the fluid.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_mc_real_001","question":"A longer wrench makes it easier to loosen a bolt because it increases:","options":["Torque","Voltage","Density","Friction only"],"answer":"Torque","explanation":"Torque increases when the same force is applied farther from the pivot point.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_002","question":"In a gear pair, if the driving gear is smaller than the driven gear, the driven gear usually turns:","options":["Slower with more torque","Faster with less torque","At the same speed always","Without torque"],"answer":"Slower with more torque","explanation":"A smaller gear driving a larger gear reduces speed and increases torque.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_003","question":"A fixed pulley mainly changes the:","options":["Direction of the applied force","Weight of the load","Amount of gravity","Mass of the rope"],"answer":"Direction of the applied force","explanation":"A fixed pulley lets the user pull down to lift up, but it does not multiply force by itself.","skillTag":"pulleys_mechanical_advantage","topic":"pulleys_mechanical_advantage","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_004","question":"A hydraulic lift works because pressure applied to a confined fluid is:","options":["Transmitted through the fluid","Destroyed by the fluid","Converted only to heat","Stopped by gravity"],"answer":"Transmitted through the fluid","explanation":"Pascal's principle explains that pressure in a confined fluid is transmitted throughout the fluid.","skillTag":"fluids_pressure","topic":"fluids_pressure","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_005","question":"A ramp reduces the force needed to raise an object by increasing the:","options":["Distance over which the force is applied","Object mass","Height being lifted","Gravity of the object"],"answer":"Distance over which the force is applied","explanation":"An inclined plane trades distance for reduced force. The work is spread over a longer path.","skillTag":"simple_machines","topic":"simple_machines","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_006","question":"If a machine has mechanical advantage greater than 1, it:","options":["Multiplies input force","Eliminates all work","Creates energy","Removes mass"],"answer":"Multiplies input force","explanation":"Mechanical advantage greater than 1 means output force is greater than input force.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_007","question":"A wheelbarrow is a second-class lever because the load is:","options":["Between the fulcrum and effort","At the same point as the fulcrum","Always outside the wheel","Between two efforts"],"answer":"Between the fulcrum and effort","explanation":"In a second-class lever, the load sits between the fulcrum and effort.","skillTag":"levers","topic":"levers","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_008","question":"A seesaw is an example of a first-class lever because the fulcrum is:","options":["Between the effort and load","At the load end only","At the effort end only","Missing entirely"],"answer":"Between the effort and load","explanation":"First-class levers have the fulcrum between effort and load.","skillTag":"levers","topic":"levers","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_009","question":"If the same force moves an object twice as far, the work done is:","options":["Twice as much","Half as much","Unchanged always","Zero"],"answer":"Twice as much","explanation":"Work equals force times distance. Doubling distance doubles work when force is constant.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_010","question":"Power measures:","options":["How fast work is done","Total mass only","Distance without force","Friction without movement"],"answer":"How fast work is done","explanation":"Power is the rate of doing work or transferring energy.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_011","question":"A spring stretched farther than before usually stores more:","options":["Potential energy","Current","Fuel","Volume only"],"answer":"Potential energy","explanation":"A stretched or compressed spring stores elastic potential energy.","skillTag":"energy_motion","topic":"energy_motion","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_012","question":"A low gear in a vehicle is useful for climbing because it provides:","options":["Greater torque at lower speed","Higher speed with no torque","Less force at all times","No engine load"],"answer":"Greater torque at lower speed","explanation":"Low gear increases torque to help move heavy loads or climb hills.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_013","question":"Pressure is calculated as force divided by:","options":["Area","Time","Voltage","Temperature"],"answer":"Area","explanation":"Pressure equals force per unit area.","skillTag":"fluids_pressure","topic":"fluids_pressure","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_014","question":"A sharp knife cuts better than a dull knife partly because it applies force over:","options":["A smaller area","A larger mass","A longer time only","No surface area"],"answer":"A smaller area","explanation":"The same force over a smaller area creates greater pressure.","skillTag":"fluids_pressure","topic":"fluids_pressure","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_015","question":"A moving object resists changes in motion because of:","options":["Inertia","Voltage","Buoyancy only","Condensation"],"answer":"Inertia","explanation":"Inertia is resistance to changes in motion.","skillTag":"energy_motion","topic":"energy_motion","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_016","question":"If a belt connects two pulleys of different size, changing pulley size affects:","options":["Speed and torque relationship","Chemical composition","Electrical insulation only","Fluid density only"],"answer":"Speed and torque relationship","explanation":"Pulley ratios change rotational speed and torque transfer.","skillTag":"torque_gears_rotation","topic":"torque_gears_rotation","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_017","question":"A brake converts much of a vehicle's kinetic energy into:","options":["Heat","Sound only","Electric charge only","Mass"],"answer":"Heat","explanation":"Friction brakes convert motion energy primarily into heat.","skillTag":"energy_motion","topic":"energy_motion","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_018","question":"A fluid pushed through a narrower opening usually increases its:","options":["Speed","Mass","Chemical formula","Freezing point automatically"],"answer":"Speed","explanation":"For many flow situations, constricting a passage can increase fluid speed.","skillTag":"fluids_pressure","topic":"fluids_pressure","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_019","question":"A third-class lever usually provides an advantage in:","options":["Speed or range of motion","Force multiplication","Eliminating effort","Removing the fulcrum"],"answer":"Speed or range of motion","explanation":"Third-class levers often trade force for speed and movement range.","skillTag":"levers","topic":"levers","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_mc_real_020","question":"If friction is reduced between moving parts, the machine generally becomes:","options":["More efficient","Heavier automatically","Less able to move","Electrically charged"],"answer":"More efficient","explanation":"Reducing friction reduces energy loss as heat and wear.","skillTag":"force_work_power","topic":"force_work_power","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"}],"Assembling Objects (AO)":[{"id":"asvab_ao_001","question":"A square is divided into two equal triangles by a diagonal line. Which two pieces would reassemble the square?","options":["Two matching right triangles","Two circles","One rectangle and one circle","Three narrow strips"],"answer":"Two matching right triangles","explanation":"A diagonal cut across a square creates two equal right triangles. Putting those two triangles together along the diagonal reforms the square.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_002","question":"A rectangle is cut straight across the middle into two equal pieces. What shape is each piece?","options":["Smaller rectangle","Circle","Triangle","Pentagon"],"answer":"Smaller rectangle","explanation":"A straight cut across the middle of a rectangle creates two smaller rectangles if the cut is parallel to one side.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_003","question":"A cube has 6 faces. If the cube is unfolded into a flat pattern, how many square faces should the pattern contain?","options":["4","5","6","8"],"answer":"6","explanation":"A cube always has 6 square faces, so its flat net must contain 6 squares.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_004","question":"Which set of pieces could form a complete circle?","options":["Four equal quarter-circle pieces","Four equal squares","Two long rectangles","Three triangles only"],"answer":"Four equal quarter-circle pieces","explanation":"Four quarter-circle pieces make one whole circle because each piece is one-fourth of the circle.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_005","question":"A shape has a square bottom and four triangular sides meeting at one point. What solid is it?","options":["Square pyramid","Cylinder","Cone","Cube"],"answer":"Square pyramid","explanation":"A square pyramid has a square base and four triangular faces that meet at a top point.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_006","question":"Which flat pattern could fold into a cylinder?","options":["One rectangle and two circles","Six equal squares","Four triangles and one square","Two triangles and three rectangles"],"answer":"One rectangle and two circles","explanation":"A cylinder has one curved side and two circular ends. The curved side unfolds into a rectangle.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_007","question":"A cone's flat pattern would most likely include which shapes?","options":["One circle and one curved sector","Six squares","Two circles and one rectangle","Four equal rectangles"],"answer":"One circle and one curved sector","explanation":"A cone has a circular base and a curved surface that unfolds into a sector shape.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_008","question":"If a shape is rotated 180 degrees, what happens to it?","options":["It turns halfway around","It becomes larger","It becomes smaller","It changes into a circle"],"answer":"It turns halfway around","explanation":"A 180-degree rotation turns an object halfway around, so its top and bottom positions are reversed.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_009","question":"If an arrow pointing up is rotated 90 degrees clockwise, which way will it point?","options":["Right","Left","Down","Up"],"answer":"Right","explanation":"A 90-degree clockwise turn moves an upward arrow to the right.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_010","question":"If an arrow pointing right is rotated 90 degrees counterclockwise, which way will it point?","options":["Up","Down","Left","Right"],"answer":"Up","explanation":"A 90-degree counterclockwise turn moves a right-pointing arrow upward.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_011","question":"Which shape has the same appearance after being rotated 90 degrees?","options":["Square","Rectangle that is not a square","Arrow","Letter L"],"answer":"Square","explanation":"A square looks the same after a 90-degree rotation because all four sides and angles are equal.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_012","question":"Which object would look like a circle from the top view and a rectangle from the side view?","options":["Cylinder","Cube","Pyramid","Flat triangle"],"answer":"Cylinder","explanation":"A cylinder appears circular from above and rectangular from the side.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_013","question":"Which object would look like a square from the front, side, and top?","options":["Cube","Cone","Cylinder","Sphere"],"answer":"Cube","explanation":"A cube has square faces on all sides, so its front, side, and top views can all look square.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_014","question":"A shape is made from one large square with a smaller square attached to its right side. Which description best matches the side attachment?","options":["The smaller square touches the large square along one side","The smaller square floats above the large square","The smaller square is inside the large square","The smaller square touches only one corner"],"answer":"The smaller square touches the large square along one side","explanation":"If a square is attached to the right side, it shares a side with the larger square.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_015","question":"Which pair of shapes can be joined along equal-length sides to form a larger rectangle?","options":["Two equal rectangles","One circle and one triangle","Two circles","One pentagon and one oval"],"answer":"Two equal rectangles","explanation":"Two matching rectangles can be placed side by side along equal sides to form a larger rectangle.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_016","question":"A capital letter L is rotated 180 degrees. Where will the short foot of the L appear?","options":["At the top instead of the bottom","In the same exact place","In the center only","It disappears"],"answer":"At the top instead of the bottom","explanation":"A 180-degree rotation flips the L halfway around, moving the lower foot to the opposite end.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_017","question":"Which shape has no corners?","options":["Circle","Triangle","Square","Rectangle"],"answer":"Circle","explanation":"A circle is curved all the way around and has no corners.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_018","question":"Which solid has exactly 8 corners?","options":["Cube","Cone","Cylinder","Sphere"],"answer":"Cube","explanation":"A cube has 8 vertices, also called corners.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_019","question":"Which solid has no flat faces?","options":["Sphere","Cube","Cylinder","Pyramid"],"answer":"Sphere","explanation":"A sphere is completely curved and has no flat faces.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_020","question":"A rectangular prism has how many faces?","options":["4","5","6","8"],"answer":"6","explanation":"A rectangular prism, like a box, has 6 rectangular faces.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_021","question":"Which net can fold into a cube?","options":["Six connected squares","Five connected circles","Three triangles only","One square and one circle"],"answer":"Six connected squares","explanation":"A cube is made of 6 square faces, so a valid net must contain 6 connected squares.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_022","question":"Which shape could be made by joining two equal right triangles along their longest side?","options":["Rectangle or square","Circle","Cone","Cylinder"],"answer":"Rectangle or square","explanation":"Two matching right triangles can join along their longest sides to form a four-sided shape such as a rectangle or square.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_023","question":"A piece shaped like a triangle is missing from the corner of a square. Which piece would best fill the missing part?","options":["A matching triangle","A circle","A long rectangle","A hexagon"],"answer":"A matching triangle","explanation":"A triangular missing space is filled by a triangle with the same size and orientation.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_024","question":"A gear-shaped drawing is reflected in a mirror. What changes?","options":["Left and right are reversed","The number of teeth changes","The object becomes larger","The object becomes a cube"],"answer":"Left and right are reversed","explanation":"A mirror reflection reverses left and right but does not change the object's size or number of parts.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_025","question":"If a shape has a notch on its left side and is reflected across a vertical mirror line, where will the notch appear?","options":["On the right side","On the left side","At the top","At the bottom"],"answer":"On the right side","explanation":"A vertical mirror reflection swaps left and right, so the notch moves to the right side.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_026","question":"If a shape has a notch on top and is reflected across a horizontal mirror line, where will the notch appear?","options":["On the bottom","On the top","On the left","On the right"],"answer":"On the bottom","explanation":"A horizontal reflection swaps top and bottom, so the notch moves to the bottom.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_027","question":"Which object would have a triangular front view and a rectangular side view?","options":["Triangular prism","Sphere","Cube","Cylinder"],"answer":"Triangular prism","explanation":"A triangular prism has triangular ends and rectangular side faces.","skillTag":"object_views","topic":"object_views","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_028","question":"Which solid has two circular faces and one curved surface?","options":["Cylinder","Cone","Sphere","Pyramid"],"answer":"Cylinder","explanation":"A cylinder has two flat circular faces and one curved side surface.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_029","question":"Which solid has one circular face and one point?","options":["Cone","Cylinder","Cube","Rectangular prism"],"answer":"Cone","explanation":"A cone has a circular base and one pointed top.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_030","question":"A rectangle is rotated 90 degrees. What happens to its length and height in the view?","options":["They trade positions","They disappear","They become equal","They become circles"],"answer":"They trade positions","explanation":"When a rectangle is turned 90 degrees, the long side changes from horizontal to vertical, or from vertical to horizontal.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_031","question":"Which shape can be folded from a net made of four triangles?","options":["Triangular pyramid","Cube","Cylinder","Rectangular prism"],"answer":"Triangular pyramid","explanation":"A triangular pyramid, also called a tetrahedron, has four triangular faces.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_032","question":"A flat shape has six equal sides. What is it called?","options":["Hexagon","Pentagon","Octagon","Triangle"],"answer":"Hexagon","explanation":"A hexagon is a flat shape with six sides.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_033","question":"A flat shape has five sides. What is it called?","options":["Pentagon","Hexagon","Octagon","Square"],"answer":"Pentagon","explanation":"A pentagon is a flat shape with five sides.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_034","question":"Which shape would complete a rectangle missing its right half?","options":["A matching rectangle","A circle","A cone","A star"],"answer":"A matching rectangle","explanation":"If the right half of a rectangle is missing, a matching rectangle of the same height and half-width completes it.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_035","question":"A shape has a hole shaped like a circle. Which insert would fit best?","options":["A circle of the same size","A square of any size","A triangle with equal sides","A rectangle twice as long"],"answer":"A circle of the same size","explanation":"A circular hole is filled by a circle with the same diameter.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_036","question":"A T-shaped figure is made from one vertical rectangle and one horizontal rectangle across the top. If rotated 180 degrees, what will it resemble?","options":["An upside-down T","The same upright T","A circle","A cube"],"answer":"An upside-down T","explanation":"A 180-degree rotation turns the top bar of the T to the bottom.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_037","question":"Which piece would complete an L shape into a full rectangle?","options":["A rectangle that fits the missing corner","A circle larger than the L","A triangle with no right angle","A long curved strip"],"answer":"A rectangle that fits the missing corner","explanation":"An L shape is like a rectangle with one corner missing, so a matching rectangular piece can complete it.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_038","question":"If a cube is turned so the top face becomes the front face, what changed?","options":["Its orientation","Its number of faces","Its number of edges","Its shape"],"answer":"Its orientation","explanation":"Turning a cube changes which face is seen from each direction, but the cube itself stays the same.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_039","question":"How many edges does a cube have?","options":["6","8","12","16"],"answer":"12","explanation":"A cube has 12 edges, where its square faces meet.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_040","question":"How many vertices does a rectangular prism have?","options":["4","6","8","12"],"answer":"8","explanation":"A rectangular prism has 8 corners, also called vertices.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_041","question":"Which shape has rotational symmetry after a 180-degree turn but not necessarily after a 90-degree turn?","options":["Non-square rectangle","Circle","Square","Equilateral triangle"],"answer":"Non-square rectangle","explanation":"A non-square rectangle looks the same after 180 degrees, but not after 90 degrees because its length and width are different.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_042","question":"Which shape looks the same after any amount of rotation around its center?","options":["Circle","Rectangle","Triangle","Letter L"],"answer":"Circle","explanation":"A circle looks the same no matter how much it is rotated around its center.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_043","question":"A square is cut into four equal smaller squares. How many smaller squares are needed to rebuild the original square?","options":["2","3","4","6"],"answer":"4","explanation":"If the original square was divided into four equal smaller squares, all four are needed to rebuild it.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_044","question":"A rectangle is cut diagonally from one corner to the opposite corner. What two pieces are formed?","options":["Two right triangles","Two circles","Two pentagons","Two cylinders"],"answer":"Two right triangles","explanation":"A diagonal cut across a rectangle forms two right triangles.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_045","question":"Which flat shape can be rotated to fit into an identical triangular opening?","options":["A matching triangle","A circle","A larger square","A cylinder"],"answer":"A matching triangle","explanation":"A triangle of the same size and shape can fit into the opening when rotated to the correct orientation.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_046","question":"A block is made of two cubes stacked vertically. What would its front view look like?","options":["Two squares stacked one above the other","Two circles side by side","One triangle","Four squares in a row"],"answer":"Two squares stacked one above the other","explanation":"From the front, each cube appears as a square, and stacking them vertically shows two squares one above the other.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_047","question":"A block is made of three cubes in a straight horizontal row. What would its top view look like?","options":["Three squares in a row","One circle","Three triangles in a column","One tall rectangle only"],"answer":"Three squares in a row","explanation":"From the top, each cube appears as a square, and the row appears as three squares side by side.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_048","question":"A solid made of cubes has two cubes on the bottom row and one cube centered on top. What does the front view resemble?","options":["A small pyramid shape made of squares","A circle","A straight line of four squares","A triangle only"],"answer":"A small pyramid shape made of squares","explanation":"The front view shows two squares on the bottom and one square above them, like a simple stepped pyramid.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_049","question":"Which shape has exactly one line of symmetry?","options":["Isosceles triangle","Circle","Square","Rectangle"],"answer":"Isosceles triangle","explanation":"A typical isosceles triangle has one line of symmetry running from the top vertex to the midpoint of the base.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_050","question":"Which shape has four lines of symmetry?","options":["Square","Non-square rectangle","Scalene triangle","Parallelogram"],"answer":"Square","explanation":"A square has four lines of symmetry: vertical, horizontal, and two diagonals.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_051","question":"Which shape has two lines of symmetry?","options":["Non-square rectangle","Scalene triangle","Letter L","Irregular pentagon"],"answer":"Non-square rectangle","explanation":"A non-square rectangle has two lines of symmetry: one vertical and one horizontal through the center.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_052","question":"A flat pattern has one square in the center with one square attached to each of its four sides and one extra square attached to one of those outer squares. What can it fold into?","options":["Cube","Cylinder","Cone","Sphere"],"answer":"Cube","explanation":"This is a common cube net because it has six connected squares arranged so they can fold into a cube.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_053","question":"Which pattern cannot fold into a cube?","options":["Six squares arranged in one straight line","Four squares in a row with one square attached above and one below","One center square with four around it and one extra attached","Three squares in a row with two attached to the middle and one attached to an end"],"answer":"Six squares arranged in one straight line","explanation":"Six squares in one straight line cannot wrap around to form all six faces of a cube properly.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_054","question":"If two identical triangles are joined along one equal side, which larger shape might they form?","options":["Parallelogram","Sphere","Cone","Cylinder"],"answer":"Parallelogram","explanation":"Two identical triangles can often be joined along a side to form a parallelogram.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_055","question":"A shape has a square base and a square directly above it, sharing one full side. What does this describe?","options":["Two connected squares","Two separated circles","One triangle","One cylinder"],"answer":"Two connected squares","explanation":"If two squares share one full side, they are connected squares.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_056","question":"A puzzle piece has a tab on the right side. Which piece would most likely connect to it?","options":["A piece with a matching slot on the left side","A piece with a tab on the right side","A piece with no edges","A piece that is much smaller and round"],"answer":"A piece with a matching slot on the left side","explanation":"A right-side tab fits into a matching left-side slot on the neighboring piece.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_057","question":"A puzzle piece has a slot on the top edge. Which piece would fit above it?","options":["A piece with a matching tab on the bottom edge","A piece with a slot on the bottom edge","A piece with a circle only","A piece with no matching edge"],"answer":"A piece with a matching tab on the bottom edge","explanation":"A top slot connects with a matching bottom tab from the piece placed above it.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_058","question":"If a shape's left side is straight and its right side has a semicircular bump, which neighboring shape would fit on the right?","options":["One with a matching semicircular cutout on the left","One with a straight left side only","One with a larger square bump on the bottom","One with no sides"],"answer":"One with a matching semicircular cutout on the left","explanation":"The bump needs to fit into a matching cutout on the side of the neighboring piece.","skillTag":"spatial_reasoning","topic":"spatial_reasoning","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_059","question":"A flat object shaped like the letter Z is rotated 180 degrees. What will it look like?","options":["Still like a Z","Like a circle","Like a square","Like the letter T"],"answer":"Still like a Z","explanation":"A standard Z shape has 180-degree rotational symmetry, so it still looks like a Z after a half turn.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_060","question":"A flat object shaped like the letter N is rotated 180 degrees. What will it look like?","options":["Still like an N","Like a circle","Like a triangle","Like a square"],"answer":"Still like an N","explanation":"A standard N shape has 180-degree rotational symmetry, so it still looks like an N after a half turn.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ao_real_001","question":"A rectangle is cut diagonally from one corner to the opposite corner. The two pieces are:","options":["Matching right triangles","Two circles","A square and a circle","Four equal strips"],"answer":"Matching right triangles","explanation":"A diagonal cut across a rectangle creates two right triangles that can reassemble the rectangle.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_002","question":"A cube net must contain how many equal square faces?","options":["6","4","8","12"],"answer":"6","explanation":"A cube has six square faces, so its flat net must include six squares.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_003","question":"A cylinder viewed from directly above appears as a:","options":["Circle","Triangle","Hexagon","L shape"],"answer":"Circle","explanation":"The top face of a cylinder is circular.","skillTag":"object_views","topic":"object_views","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_004","question":"A cone viewed from the side most commonly appears as a:","options":["Triangle","Circle","Square","Rectangle only"],"answer":"Triangle","explanation":"The side outline of a cone is triangular.","skillTag":"object_views","topic":"object_views","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_005","question":"If an arrow pointing left is rotated 180 degrees, it points:","options":["Right","Left","Up","Down"],"answer":"Right","explanation":"A 180-degree rotation reverses the direction.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_006","question":"If an L-shape is mirrored left-to-right, the vertical part stays vertical but the foot moves to the:","options":["Opposite side","Same side always","Center only","Top only"],"answer":"Opposite side","explanation":"A horizontal mirror flip reverses left and right positions.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_007","question":"Four equal quarter-circles can be arranged to make a:","options":["Complete circle","Cube","Pyramid","Long rectangle only"],"answer":"Complete circle","explanation":"Each quarter-circle is one fourth of a circle. Four complete the circle.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_008","question":"A square pyramid has a square base and how many triangular side faces?","options":["4","2","6","8"],"answer":"4","explanation":"A square pyramid has four triangular side faces meeting at one apex.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_009","question":"A rectangular prism has faces that are all:","options":["Rectangles","Circles","Triangles","Ovals"],"answer":"Rectangles","explanation":"A rectangular prism is made of rectangular faces.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_010","question":"Two identical right triangles joined along their hypotenuse can form a:","options":["Rectangle or square, depending on triangle dimensions","Circle only","Cone only","Sphere only"],"answer":"Rectangle or square, depending on triangle dimensions","explanation":"Matching right triangles can form a quadrilateral when joined along the diagonal.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_011","question":"If a shape looks the same after a 90-degree rotation, it could be a:","options":["Square","Non-square rectangle","Arrow","Letter F"],"answer":"Square","explanation":"A square has rotational symmetry every 90 degrees.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_012","question":"A sphere viewed from any direction appears as a:","options":["Circle","Rectangle","Triangle","Cross"],"answer":"Circle","explanation":"A sphere has a circular outline from any viewing direction.","skillTag":"object_views","topic":"object_views","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_013","question":"A flat pattern with one rectangle and two circles most likely folds into a:","options":["Cylinder","Cube","Cone","Pyramid"],"answer":"Cylinder","explanation":"The rectangle forms the curved side and the circles form the two ends.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_014","question":"A flat pattern with one circle and one curved sector most likely forms a:","options":["Cone","Cube","Rectangular prism","Cylinder with two ends"],"answer":"Cone","explanation":"The sector wraps into the cone surface and the circle forms the base.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_015","question":"If a block has a square front view, square side view, and square top view, it is most likely a:","options":["Cube","Cone","Cylinder","Flat circle"],"answer":"Cube","explanation":"A cube can show square faces from front, side, and top.","skillTag":"object_views","topic":"object_views","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_016","question":"If a piece is moved without turning it, its orientation:","options":["Stays the same","Rotates 90 degrees","Mirrors automatically","Becomes larger"],"answer":"Stays the same","explanation":"Translation changes position but not orientation.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_017","question":"A shape and its mirror image are not always the same because a mirror image:","options":["Reverses left and right","Only changes color","Always changes size","Removes corners"],"answer":"Reverses left and right","explanation":"Mirroring flips orientation across an axis.","skillTag":"spatial_rotation","topic":"spatial_rotation","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_018","question":"Three rectangles meeting around one corner are most consistent with a corner of a:","options":["Rectangular prism","Cone","Sphere","Circle"],"answer":"Rectangular prism","explanation":"A rectangular prism has rectangular faces meeting at corners.","skillTag":"nets_and_solids","topic":"nets_and_solids","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_019","question":"If a top view shows a circle and a front view shows a triangle, the solid is most likely a:","options":["Cone","Cube","Cylinder","Rectangular prism"],"answer":"Cone","explanation":"A cone has a circular base from above and a triangular side outline.","skillTag":"object_views","topic":"object_views","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_ao_real_020","question":"When two pieces are reassembled, matching edges should usually have:","options":["Equal lengths","Different scales","No contact","Rounded corners only"],"answer":"Equal lengths","explanation":"Pieces join correctly when corresponding edges match in length and orientation.","skillTag":"shape_assembly","topic":"shape_assembly","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"}],"ICTL (Cyber Test)":[{"id":"asvab_ictl_001","question":"What does CPU stand for?","options":["Central Processing Unit","Computer Power Utility","Central Program User","Control Panel Unit"],"answer":"Central Processing Unit","explanation":"The CPU is the main processor of a computer. It carries out instructions and performs calculations.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_002","question":"What is the main purpose of RAM in a computer?","options":["To temporarily store data currently being used","To permanently store files after shutdown","To cool the processor","To connect the computer to Wi-Fi"],"answer":"To temporarily store data currently being used","explanation":"RAM is temporary memory used by running programs and the operating system. Its contents are usually lost when power is turned off.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_003","question":"Which type of storage keeps data even when the computer is turned off?","options":["Nonvolatile storage","Cache memory","RAM","Processor register"],"answer":"Nonvolatile storage","explanation":"Nonvolatile storage, such as SSDs and hard drives, keeps data after power is removed.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_004","question":"Which device is commonly used to store the operating system and user files?","options":["Solid-state drive","Cooling fan","Network switch","Power button"],"answer":"Solid-state drive","explanation":"A solid-state drive, or SSD, stores the operating system, applications, and user files.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_005","question":"What is the purpose of a motherboard?","options":["To connect and allow communication between computer components","To display images on a monitor","To provide internet service","To clean temporary files"],"answer":"To connect and allow communication between computer components","explanation":"The motherboard is the main circuit board that connects the CPU, memory, storage, and other hardware.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_006","question":"What does BIOS or UEFI do when a computer starts?","options":["Initializes hardware and helps start the operating system","Deletes user files","Encrypts every email","Runs only web browsers"],"answer":"Initializes hardware and helps start the operating system","explanation":"BIOS or UEFI checks basic hardware and starts the boot process for the operating system.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_007","question":"Which component converts AC wall power into DC power for computer parts?","options":["Power supply unit","Graphics card","Network card","RAM module"],"answer":"Power supply unit","explanation":"The power supply unit converts AC electricity from the wall into DC power used by computer components.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_008","question":"What is the function of a GPU?","options":["Processing graphics and visual output","Storing passwords permanently","Routing network traffic","Cooling the hard drive"],"answer":"Processing graphics and visual output","explanation":"A GPU processes graphics, video, and other visual workloads.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_009","question":"Which connector is commonly used for wired Ethernet networking?","options":["RJ-45","HDMI","USB-C only","VGA"],"answer":"RJ-45","explanation":"RJ-45 connectors are commonly used with Ethernet cables for wired networking.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_010","question":"What is the purpose of an operating system?","options":["To manage hardware and software resources","To physically clean the computer","To replace all applications","To increase screen brightness only"],"answer":"To manage hardware and software resources","explanation":"An operating system manages files, memory, hardware, processes, and user interaction.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_011","question":"Which of the following is an example of an operating system?","options":["Linux","HTML","USB","Ethernet"],"answer":"Linux","explanation":"Linux is an operating system. HTML is a markup language, USB is a hardware interface, and Ethernet is a networking standard.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_012","question":"Which operating system is Android based on?","options":["Linux","MS-DOS","macOS Classic","UnixWare only"],"answer":"Linux","explanation":"Android uses the Linux kernel as a major foundation of its operating system.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_013","question":"In Windows, what tool is commonly used to view running processes and system performance?","options":["Task Manager","Paint","Notepad","Recycle Bin"],"answer":"Task Manager","explanation":"Task Manager shows running apps, processes, CPU usage, memory use, and other system information.","skillTag":"hardware","topic":"hardware","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_014","question":"Which Windows command can display IP configuration information?","options":["ipconfig","ls","chmod","grep"],"answer":"ipconfig","explanation":"The ipconfig command displays IP address, subnet mask, gateway, and related network information on Windows.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_015","question":"Which Linux command lists files and directories?","options":["ls","ipconfig","format","cls"],"answer":"ls","explanation":"The ls command lists files and directories in Linux and Unix-like systems.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_016","question":"Which Linux command is used to change file permissions?","options":["chmod","ping","mkdir","dir"],"answer":"chmod","explanation":"The chmod command changes file and directory permissions in Linux.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_017","question":"Which Linux command creates a new directory?","options":["mkdir","rmdir","cat","pwd"],"answer":"mkdir","explanation":"The mkdir command creates a new directory.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_018","question":"Which Linux command shows the current working directory?","options":["pwd","cd","rm","touch"],"answer":"pwd","explanation":"The pwd command prints the current working directory.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_019","question":"Which command is commonly used to test basic network connectivity to another host?","options":["ping","delete","copy","mkdir"],"answer":"ping","explanation":"The ping command sends test packets to another host to check whether it can be reached.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_020","question":"Which command can show the path packets take to reach a destination?","options":["tracert","format","rename","shutdown"],"answer":"tracert","explanation":"On Windows, tracert shows the route packets take through routers to a destination.","skillTag":"operating_systems_commands","topic":"operating_systems_commands","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_021","question":"What does IP stand for in networking?","options":["Internet Protocol","Internal Power","Input Process","Information Printer"],"answer":"Internet Protocol","explanation":"IP stands for Internet Protocol, which is used to address and route packets across networks.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_022","question":"What is the purpose of an IP address?","options":["To identify a device on a network","To encrypt a hard drive","To cool a computer","To measure screen size"],"answer":"To identify a device on a network","explanation":"An IP address identifies a device so data can be sent to and from it on a network.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_023","question":"Which IP address is a private IPv4 address?","options":["192.168.1.10","8.8.8.8","1.1.1.1","23.45.67.89"],"answer":"192.168.1.10","explanation":"Addresses beginning with 192.168 are private IPv4 addresses commonly used on local networks.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_024","question":"What does DNS do?","options":["Translates domain names into IP addresses","Encrypts every file on a computer","Blocks all wireless traffic","Measures network cable length"],"answer":"Translates domain names into IP addresses","explanation":"DNS lets users type names like example.com instead of remembering numeric IP addresses.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_025","question":"What does DHCP do?","options":["Automatically assigns IP addresses to devices","Encrypts web traffic","Filters spam email only","Compresses images"],"answer":"Automatically assigns IP addresses to devices","explanation":"DHCP automatically provides IP settings such as IP address, subnet mask, gateway, and DNS server.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_026","question":"What is the purpose of a subnet mask?","options":["To identify the network portion of an IP address","To hide a monitor from users","To delete malware","To measure processor speed"],"answer":"To identify the network portion of an IP address","explanation":"A subnet mask separates the network portion from the host portion of an IP address.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_027","question":"What is the purpose of a default gateway?","options":["To route traffic from a local network to other networks","To store local passwords only","To display web pages","To prevent a computer from booting"],"answer":"To route traffic from a local network to other networks","explanation":"The default gateway is usually a router that sends traffic outside the local network.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_028","question":"What does a network switch do?","options":["Connects devices on a local network and forwards frames","Converts AC to DC power","Stores files permanently","Creates computer viruses"],"answer":"Connects devices on a local network and forwards frames","explanation":"A switch connects devices in a LAN and forwards data based on MAC addresses.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_029","question":"What does a router do?","options":["Forwards traffic between different networks","Only prints documents","Only stores video files","Only powers USB devices"],"answer":"Forwards traffic between different networks","explanation":"A router connects different networks and sends packets toward their destinations.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_030","question":"What does a firewall primarily do?","options":["Controls network traffic based on security rules","Increases monitor resolution","Adds memory to a computer","Repairs damaged files automatically"],"answer":"Controls network traffic based on security rules","explanation":"A firewall allows or blocks traffic based on rules to help protect systems and networks.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_031","question":"What does MAC address refer to?","options":["A hardware address assigned to a network interface","A password manager code","A file extension","A type of encryption key only"],"answer":"A hardware address assigned to a network interface","explanation":"A MAC address is a unique hardware address used by network interfaces on local networks.","skillTag":"networking","topic":"networking","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_032","question":"What protocol is commonly used for secure web browsing?","options":["HTTPS","FTP","Telnet","HTTP only"],"answer":"HTTPS","explanation":"HTTPS uses encryption to protect web traffic between a browser and a website.","skillTag":"cybersecurity","topic":"cybersecurity","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_033","question":"Which protocol is commonly associated with sending email from a client or server?","options":["SMTP","DNS","ARP","ICMP"],"answer":"SMTP","explanation":"SMTP is commonly used to send email messages.","skillTag":"it_fundamentals","topic":"it_fundamentals","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_ictl_034","
