.clock{padding:18px;border-radius:var(--radius);border:1px solid #2b3e31;background:linear-gradient(180deg,#102018,#09100c);position:sticky;top:14px}.clock.green{border-color:rgba(69,212,131,.65);box-shadow:0 0 0 1px rgba(69,212,131,.18),var(--shadow)}.clock.yellow{border-color:rgba(245,200,75,.8);box-shadow:0 0 0 1px rgba(245,200,75,.22),var(--shadow)}.clock.red{border-color:rgba(255,91,91,.9);box-shadow:0 0 0 1px rgba(255,91,91,.26),0 0 30px rgba(255,91,91,.18),var(--shadow);animation:pulseRed 1.1s ease-in-out infinite}

.clock-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.clock-box{background:#07100a;border:1px solid #26382c;border-radius:15px;padding:10px}.clock-box b{display:block;font-size:1rem}.clock-box span{font-size:.75rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.progress{height:10px;background:#07100a;border:1px solid #26382c;border-radius:999px;overflow:hidden;margin:14px 0 2px}.progress-fill{height:100%;width:0;background:var(--green);transition:width .25s ease,background .25s ease}.clock.yellow .progress-fill{background:var(--yellow)}.clock.red .progress-fill{background:var(--red)}

.transition{max-width:760px;margin:36px auto;padding:28px;text-align:center}.transition h2{font-size:2rem;margin:8px 0}.big-score{font-size:4rem;line-height:1;font-weight:950;letter-spacing:-.07em}.result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}@media(max-width:800px){.result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}.result-tile{background:#0b140e;border:1px solid #2b3e31;border-radius:18px;padding:14px}.result-tile span{display:block;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;font-weight:900}.result-tile b{font-size:1.45rem}.table-wrap{overflow:auto}.result-table{width:100%;border-collapse:separate;border-spacing:0 8px}.result-table th{text-align:left;color:#a8baa8;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;padding:0 10px}.result-table td{background:#0b140e;border-top:1px solid #2b3e31;border-bottom:1px solid #2b3e31;padding:12px 10px}.result-table td:first-child{border-left:1px solid #2b3e31;border-radius:14px 0 0 14px}.result-table td:last-child{border-right:1px solid #2b3e31;border-radius:0 14px 14px 0}.bar{height:8px;background:#1c2d21;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:#45d483;width:0}.review-item{border:1px solid #2b3e31;background:#0b140e;border-radius:16px;margin:10px 0;overflow:hidden}.review-summary{padding:14px 16px;font-weight:900;display:flex;justify-content:space-between;gap:12px}.review-body{padding:0 16px 16px;color:#dce8db}.wrong{color:#ff9b9b}.right{color:#a8f0bb}.muted{color:var(--muted)}.hidden{display:none!important}.footer-note{margin-top:30px;color:#819481;font-size:.82rem}.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#07100a;border:1px solid #2b3e31;border-radius:7px;padding:2px 6px;color:#d7e8d5}.print-only{display:none}
@media print{body{background:white;color:black}.app{max-width:none}.btn,.topbar .pill-row,.clock,.action-row,.footer-note{display:none!important}.card,.result-tile,.result-table td{box-shadow:none;background:white;color:black;border-color:#aaa}.print-only{display:block}.muted{color:#444}}

/* Comfort Test-Center Theme Override

<script>
const QUESTION_BANKS = {"General Science (GS)":[{"id":"asvab_gs_001","question":"What is the smallest unit of an element that still has the properties of that element?","options":["Atom","Molecule","Cell","Compound"],"answer":"Atom","explanation":"An atom is the smallest unit of an element that keeps the chemical properties of that element.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_002","question":"Which particle in an atom has a positive charge?","options":["Electron","Proton","Neutron","Photon"],"answer":"Proton","explanation":"Protons are positively charged particles found in the nucleus of an atom.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_003","question":"The atomic number of an element is determined by the number of which particles?","options":["Neutrons","Electrons","Protons","Molecules"],"answer":"Protons","explanation":"The atomic number equals the number of protons in the nucleus of an atom.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_004","question":"What is the chemical formula for water?","options":["CO2","H2O","O2","NaCl"],"answer":"H2O","explanation":"Water is made of two hydrogen atoms and one oxygen atom, so its formula is H2O.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_005","question":"Which organelle is known as the control center of the cell?","options":["Mitochondrion","Nucleus","Ribosome","Cell membrane"],"answer":"Nucleus","explanation":"The nucleus contains DNA and controls many of the cell's activities.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_006","question":"Which organelle produces most of the energy used by a cell?","options":["Mitochondrion","Nucleus","Vacuole","Chloroplast"],"answer":"Mitochondrion","explanation":"Mitochondria release energy from food molecules and produce ATP, the cell's main energy source.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_007","question":"What process do plants use to make food from sunlight?","options":["Respiration","Photosynthesis","Fermentation","Evaporation"],"answer":"Photosynthesis","explanation":"Photosynthesis allows plants to use sunlight, carbon dioxide, and water to make glucose and oxygen.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_008","question":"Which gas do plants take in during photosynthesis?","options":["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],"answer":"Carbon dioxide","explanation":"Plants take in carbon dioxide and use it, along with water and sunlight, to make glucose.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_009","question":"Which structure controls what enters and leaves a cell?","options":["Cell membrane","Nucleus","Ribosome","Chromosome"],"answer":"Cell membrane","explanation":"The cell membrane acts like a boundary that regulates movement into and out of the cell.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_010","question":"What is diffusion?","options":["Movement from low concentration to high concentration","Movement from high concentration to low concentration","Movement of water only through a membrane","Movement caused only by gravity"],"answer":"Movement from high concentration to low concentration","explanation":"Diffusion is the movement of particles from an area where they are more concentrated to an area where they are less concentrated.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_011","question":"What is osmosis?","options":["Movement of water across a selectively permeable membrane","Breaking down food with enzymes","Producing energy in the mitochondria","Making proteins in ribosomes"],"answer":"Movement of water across a selectively permeable membrane","explanation":"Osmosis is a special type of diffusion involving water moving across a selectively permeable membrane.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_012","question":"Which structure is found in plant cells but not animal cells?","options":["Cell wall","Cell membrane","Nucleus","Cytoplasm"],"answer":"Cell wall","explanation":"Plant cells have a rigid cell wall that gives support and shape. Animal cells do not have cell walls.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_013","question":"What does DNA carry?","options":["Genetic instructions","Digestive enzymes","Oxygen molecules","Electric current"],"answer":"Genetic instructions","explanation":"DNA stores the genetic information that tells cells how to build and maintain an organism.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_014","question":"Genes are found on which structures?","options":["Chromosomes","Ribosomes","Lysosomes","Vacuoles"],"answer":"Chromosomes","explanation":"Genes are sections of DNA, and DNA is organized into chromosomes.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_015","question":"Which type of organism makes its own food?","options":["Producer","Consumer","Decomposer","Parasite"],"answer":"Producer","explanation":"Producers, such as plants and algae, make their own food, usually through photosynthesis.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_016","question":"Which organism eats only plants?","options":["Carnivore","Herbivore","Omnivore","Decomposer"],"answer":"Herbivore","explanation":"Herbivores are animals that eat plants as their main food source.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_017","question":"What is the main role of decomposers in an ecosystem?","options":["Produce sunlight","Break down dead organisms","Make oxygen from rocks","Stop all food chains"],"answer":"Break down dead organisms","explanation":"Decomposers break down dead plants and animals, returning nutrients to the environment.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_018","question":"In most food chains, what is the original source of energy?","options":["The Sun","The Moon","Soil","Water"],"answer":"The Sun","explanation":"Most food chains begin with sunlight, which producers use to make food.","skillTag":"physics","topic":"physics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_019","question":"Which blood cells help fight infection?","options":["Red blood cells","White blood cells","Platelets","Plasma cells only"],"answer":"White blood cells","explanation":"White blood cells are part of the immune system and help defend the body against disease.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_020","question":"What do red blood cells mainly transport?","options":["Oxygen","Bone tissue","Digestive enzymes","Nerve impulses"],"answer":"Oxygen","explanation":"Red blood cells contain hemoglobin, which carries oxygen through the bloodstream.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_021","question":"Which organ is mainly responsible for pumping blood through the body?","options":["Lung","Heart","Liver","Kidney"],"answer":"Heart","explanation":"The heart is a muscular pump that moves blood through the circulatory system.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_022","question":"Which blood vessels carry blood away from the heart?","options":["Arteries","Veins","Capillaries","Bronchi"],"answer":"Arteries","explanation":"Arteries carry blood away from the heart. Veins carry blood back toward the heart.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_023","question":"Where does most gas exchange occur in the lungs?","options":["Alveoli","Trachea","Diaphragm","Esophagus"],"answer":"Alveoli","explanation":"Alveoli are tiny air sacs where oxygen enters the blood and carbon dioxide leaves the blood.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_024","question":"Which organ filters wastes from the blood to produce urine?","options":["Kidney","Stomach","Pancreas","Spleen"],"answer":"Kidney","explanation":"The kidneys filter wastes and extra water from the blood, forming urine.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_025","question":"What is homeostasis?","options":["The body's ability to maintain stable internal conditions","The process of breaking down rocks","The transfer of heat by radiation","The movement of planets around the Sun"],"answer":"The body's ability to maintain stable internal conditions","explanation":"Homeostasis keeps internal conditions, such as temperature and water balance, within a healthy range.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_026","question":"What is a dominant allele?","options":["An allele that is expressed when only one copy is present","An allele that never affects traits","An allele found only in bacteria","An allele that is always harmful"],"answer":"An allele that is expressed when only one copy is present","explanation":"A dominant allele can show its trait even if the organism has only one copy of that allele.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_027","question":"What is natural selection?","options":["The survival and reproduction of organisms best suited to their environment","The random creation of new planets","The process of boiling water","The movement of electrons through a wire"],"answer":"The survival and reproduction of organisms best suited to their environment","explanation":"Natural selection occurs when organisms with helpful traits are more likely to survive and pass those traits to offspring.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_028","question":"Which organisms are prokaryotes?","options":["Bacteria","Plants","Animals","Fungi only"],"answer":"Bacteria","explanation":"Bacteria are prokaryotes, meaning their cells do not have a nucleus.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_029","question":"Why are viruses not usually considered fully living organisms?","options":["They are made only of water","They cannot reproduce without a host cell","They have bones instead of cells","They carry oxygen in blood"],"answer":"They cannot reproduce without a host cell","explanation":"Viruses must infect a host cell to reproduce, which is one reason they are not considered fully living.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_030","question":"What does a vaccine mainly do?","options":["Stimulates the immune system to recognize a disease","Replaces all white blood cells","Turns bacteria into viruses","Stops digestion permanently"],"answer":"Stimulates the immune system to recognize a disease","explanation":"Vaccines train the immune system to recognize and respond faster to certain disease-causing agents.","skillTag":"biology","topic":"biology","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_031","question":"What is matter?","options":["Anything that has mass and takes up space","Only things that are alive","Only invisible gases","Energy without mass"],"answer":"Anything that has mass and takes up space","explanation":"Matter is anything that has mass and occupies space, including solids, liquids, and gases.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_032","question":"Which state of matter has a definite shape and a definite volume?","options":["Solid","Liquid","Gas","Plasma"],"answer":"Solid","explanation":"A solid keeps its own shape and volume because its particles are tightly packed.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_033","question":"What is the change from a solid to a liquid called?","options":["Freezing","Melting","Condensation","Sublimation"],"answer":"Melting","explanation":"Melting occurs when a solid gains enough heat energy to become a liquid.","skillTag":"physics","topic":"physics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_034","question":"What is the change from a gas to a liquid called?","options":["Evaporation","Condensation","Melting","Deposition"],"answer":"Condensation","explanation":"Condensation happens when gas particles lose energy and become liquid.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_035","question":"Density is calculated using which formula?","options":["Density = mass / volume","Density = volume / mass","Density = force / area","Density = distance / time"],"answer":"Density = mass / volume","explanation":"Density measures how much mass is packed into a given volume.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_036","question":"What is a force?","options":["A push or pull","The amount of matter in an object","The distance an object travels","The brightness of light"],"answer":"A push or pull","explanation":"A force is any push or pull that can change an object's motion.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_037","question":"What is inertia?","options":["An object's resistance to a change in motion","The amount of heat in a liquid","The speed of light in air","A type of chemical bond"],"answer":"An object's resistance to a change in motion","explanation":"Inertia is the tendency of an object to keep doing what it is already doing, whether resting or moving.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_038","question":"Acceleration is best described as a change in what?","options":["Mass","Velocity","Color","Temperature"],"answer":"Velocity","explanation":"Acceleration is the rate at which velocity changes over time.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_039","question":"Which force pulls objects toward Earth?","options":["Friction","Gravity","Magnetism","Tension"],"answer":"Gravity","explanation":"Gravity is the attractive force between masses, and Earth's gravity pulls objects toward its center.","skillTag":"physics","topic":"physics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_040","question":"What does friction do?","options":["Opposes motion between surfaces","Creates matter from energy","Turns solids directly into plasma","Eliminates gravity"],"answer":"Opposes motion between surfaces","explanation":"Friction is a force that resists motion when surfaces rub against each other.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_041","question":"In physics, work is done when a force causes what?","options":["Displacement","Mass","Color","Temperature only"],"answer":"Displacement","explanation":"Work occurs when a force moves an object over a distance in the direction of the force.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_042","question":"Power is the rate at which what is done?","options":["Work","Mass","Volume","Density"],"answer":"Work","explanation":"Power measures how quickly work is done or energy is transferred.","skillTag":"physics","topic":"physics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_043","question":"What is kinetic energy?","options":["Energy of motion","Stored energy due to position","Energy stored in food only","Energy from gravity only"],"answer":"Energy of motion","explanation":"Kinetic energy is the energy an object has because it is moving.","skillTag":"physics","topic":"physics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_044","question":"What is potential energy?","options":["Stored energy","Energy of motion only","Energy lost forever","Energy that only sound waves have"],"answer":"Stored energy","explanation":"Potential energy is stored energy, often because of an object's position or condition.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_045","question":"Which simple machine is a ramp?","options":["Lever","Inclined plane","Pulley","Wheel and axle"],"answer":"Inclined plane","explanation":"An inclined plane is a sloped surface that makes it easier to move objects up or down.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_046","question":"Heat transfer through direct contact is called what?","options":["Conduction","Convection","Radiation","Reflection"],"answer":"Conduction","explanation":"Conduction transfers heat through direct contact between particles or objects.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_047","question":"Heat transfer through the movement of fluids is called what?","options":["Conduction","Convection","Radiation","Refraction"],"answer":"Convection","explanation":"Convection occurs when heat is transferred by moving liquids or gases.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_048","question":"Heat transfer by electromagnetic waves is called what?","options":["Radiation","Conduction","Convection","Insulation"],"answer":"Radiation","explanation":"Radiation transfers heat through electromagnetic waves, such as sunlight warming Earth.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_049","question":"Sound waves require what to travel?","options":["A medium","A vacuum only","Sunlight","Magnetic poles"],"answer":"A medium","explanation":"Sound needs matter, such as air, water, or solids, to carry vibrations.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_050","question":"What happens to wavelength when wave frequency increases, assuming wave speed stays the same?","options":["Wavelength decreases","Wavelength increases","Wavelength becomes zero","Wavelength is unrelated to frequency"],"answer":"Wavelength decreases","explanation":"When wave speed stays constant, frequency and wavelength have an inverse relationship.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_051","question":"Electric current is the flow of what?","options":["Electric charge","Heat only","Sound waves","Air pressure"],"answer":"Electric charge","explanation":"Electric current is the movement of electric charge, usually electrons, through a conductor.","skillTag":"physics","topic":"physics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_052","question":"What does resistance do in an electrical circuit?","options":["Opposes the flow of current","Creates gravity","Stores oxygen","Removes voltage completely"],"answer":"Opposes the flow of current","explanation":"Resistance limits or opposes the movement of electric current through a material.","skillTag":"physics","topic":"physics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_053","question":"Ohm's law is represented by which equation?","options":["V = IR","F = ma","D = m / V","P = W / t"],"answer":"V = IR","explanation":"Ohm's law states that voltage equals current multiplied by resistance.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_054","question":"Which material is usually a good conductor of electricity?","options":["Copper","Rubber","Glass","Wood"],"answer":"Copper","explanation":"Copper is a metal with electrons that move easily, making it a good electrical conductor.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_055","question":"In a series circuit, what happens if one bulb burns out?","options":["All bulbs usually go out","All bulbs get brighter","Nothing changes","Only the battery disappears"],"answer":"All bulbs usually go out","explanation":"A series circuit has one path for current. If one part breaks, the whole circuit is interrupted.","skillTag":"physics","topic":"physics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_056","question":"What is magnetism most closely associated with?","options":["Moving electric charges","Plant reproduction","Rock layers only","Evaporating water"],"answer":"Moving electric charges","explanation":"Magnetism is related to the motion of electric charges, including electrons in atoms.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_057","question":"On the pH scale, acids usually have a pH value that is what?","options":["Less than 7","Exactly 7","Greater than 7","Always 14"],"answer":"Less than 7","explanation":"Acids have pH values below 7. A pH of 7 is neutral.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_058","question":"On the pH scale, bases usually have a pH value that is what?","options":["Less than 7","Exactly 7","Greater than 7","Always 0"],"answer":"Greater than 7","explanation":"Bases have pH values greater than 7.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_059","question":"Which substance is commonly known as table salt?","options":["Sodium chloride","Carbon dioxide","Hydrogen peroxide","Calcium carbonate"],"answer":"Sodium chloride","explanation":"Table salt is sodium chloride, which has the chemical formula NaCl.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_060","question":"What is a compound?","options":["A substance made of two or more elements chemically combined","A mixture of rocks only","A single atom with no bonds","A type of electrical current"],"answer":"A substance made of two or more elements chemically combined","explanation":"A compound forms when two or more different elements are chemically bonded together.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_061","question":"What is a mixture?","options":["Two or more substances physically combined","One pure element only","A substance made only by nuclear fusion","A charged atom"],"answer":"Two or more substances physically combined","explanation":"A mixture contains substances combined physically, not chemically bonded.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_062","question":"What is an ion?","options":["An atom or molecule with an electric charge","A neutral neutron","A type of plant cell","A unit of force"],"answer":"An atom or molecule with an electric charge","explanation":"An ion forms when an atom or molecule gains or loses electrons, giving it a charge.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_063","question":"What are isotopes?","options":["Atoms of the same element with different numbers of neutrons","Atoms of different elements with the same color","Molecules made only of oxygen","Cells without membranes"],"answer":"Atoms of the same element with different numbers of neutrons","explanation":"Isotopes have the same number of protons but different numbers of neutrons.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_064","question":"Which change is a chemical change?","options":["Burning wood","Melting ice","Cutting paper","Crushing a can"],"answer":"Burning wood","explanation":"Burning wood produces new substances, such as ash and gases, so it is a chemical change.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_065","question":"Which change is a physical change?","options":["Rusting iron","Burning gasoline","Melting ice","Baking a cake"],"answer":"Melting ice","explanation":"Melting ice changes water from solid to liquid, but it does not create a new substance.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_066","question":"What usually forms when an acid reacts with a base?","options":["Salt and water","Only oxygen","Only hydrogen gas","A new planet"],"answer":"Salt and water","explanation":"Acid-base neutralization commonly produces salt and water.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_067","question":"Which rocks form when magma or lava cools and hardens?","options":["Igneous rocks","Sedimentary rocks","Metamorphic rocks","Fossil rocks"],"answer":"Igneous rocks","explanation":"Igneous rocks form from cooled magma below Earth's surface or lava at the surface.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_068","question":"Which rocks form from layers of compacted sediment?","options":["Sedimentary rocks","Igneous rocks","Metamorphic rocks","Volcanic glass only"],"answer":"Sedimentary rocks","explanation":"Sedimentary rocks form when sediments are deposited, compacted, and cemented over time.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_069","question":"Which rocks form when existing rocks are changed by heat and pressure?","options":["Metamorphic rocks","Sedimentary rocks","Igneous rocks","Molten rocks"],"answer":"Metamorphic rocks","explanation":"Metamorphic rocks form when heat and pressure change existing rocks without completely melting them.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_070","question":"What theory explains the movement of Earth's crustal plates?","options":["Plate tectonics","Cell theory","Atomic theory","Germ theory"],"answer":"Plate tectonics","explanation":"Plate tectonics explains how large sections of Earth's crust move and interact.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_071","question":"Earthquakes most often occur along what?","options":["Faults","Clouds","Ocean tides","River deltas only"],"answer":"Faults","explanation":"Faults are cracks in Earth's crust where rocks move, often causing earthquakes.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_072","question":"What is weathering?","options":["The breaking down of rocks","The movement of stars","The production of electricity","The formation of blood cells"],"answer":"The breaking down of rocks","explanation":"Weathering is the process that breaks rocks into smaller pieces.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_073","question":"What is erosion?","options":["The movement of weathered material","The freezing of lava","The creation of atoms","The burning of fossil fuels only"],"answer":"The movement of weathered material","explanation":"Erosion moves rock and soil from one place to another by wind, water, ice, or gravity.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_074","question":"Which layer of the atmosphere contains most weather?","options":["Troposphere","Stratosphere","Mesosphere","Thermosphere"],"answer":"Troposphere","explanation":"The troposphere is the lowest atmospheric layer and contains most clouds and weather.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_075","question":"What is the correct order for the basic water cycle?","options":["Evaporation, condensation, precipitation","Condensation, erosion, fusion","Precipitation, combustion, magnetism","Photosynthesis, digestion, respiration"],"answer":"Evaporation, condensation, precipitation","explanation":"Water evaporates into vapor, condenses into clouds, and returns to Earth as precipitation.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_076","question":"What causes Earth's seasons?","options":["Earth's tilted axis as it orbits the Sun","The Moon blocking sunlight every night","Earth moving closer to the Sun every summer","The oceans stopping Earth's rotation"],"answer":"Earth's tilted axis as it orbits the Sun","explanation":"Seasons happen because Earth's axis is tilted, causing different parts of Earth to receive different sunlight angles during the year.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_077","question":"Why does the Moon appear to shine?","options":["It reflects sunlight","It produces its own nuclear fusion","It burns oxygen","It is made of fire"],"answer":"It reflects sunlight","explanation":"The Moon does not make its own light. It appears bright because it reflects light from the Sun.","skillTag":"earth_space_science","topic":"earth_space_science","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_078","question":"What causes ocean tides on Earth?","options":["The gravitational pull of the Moon and the Sun","The spinning of clouds only","The heat from volcanoes","The magnetic pull of rocks only"],"answer":"The gravitational pull of the Moon and the Sun","explanation":"Tides are mainly caused by the Moon's gravity, with the Sun also contributing.","skillTag":"physics","topic":"physics","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_079","question":"What process powers stars like the Sun?","options":["Nuclear fusion","Photosynthesis","Erosion","Condensation"],"answer":"Nuclear fusion","explanation":"Stars produce energy through nuclear fusion, where lighter atomic nuclei combine to form heavier nuclei.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_080","question":"Which gas helps protect Earth by absorbing much of the Sun's ultraviolet radiation?","options":["Ozone","Helium","Carbon monoxide","Hydrogen"],"answer":"Ozone","explanation":"Ozone in the stratosphere absorbs much of the Sun's harmful ultraviolet radiation.","skillTag":"chemistry","topic":"chemistry","difficulty":"foundation","afqtRelevant":false,"realismTier":"foundation"},{"id":"asvab_gs_real_001","question":"A student places a plant near a window and another identical plant in a dark closet. After several days, the closet plant has paler leaves. Which process was most limited?","options":["Photosynthesis","Respiration","Osmosis","Digestion"],"answer":"Photosynthesis","explanation":"Light is required for photosynthesis. Without enough light, the plant cannot produce normal amounts of food and chlorophyll-supported growth is reduced.","skillTag":"biology","topic":"biology","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_002","question":"A beaker contains sand and salt mixed together. Which method would best separate both materials?","options":["Add water, filter out sand, then evaporate the water","Use a magnet to pull out the salt","Freeze the mixture until the salt rises","Shake the mixture until the sand dissolves"],"answer":"Add water, filter out sand, then evaporate the water","explanation":"Salt dissolves in water but sand does not. Filtering removes sand, and evaporation leaves the salt behind.","skillTag":"chemistry","topic":"chemistry","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_003","question":"A ball rolls across a rough floor and gradually slows down. Which force is mainly responsible?","options":["Friction","Magnetism","Gravity only","Electrical charge"],"answer":"Friction","explanation":"Friction opposes motion between surfaces and converts some kinetic energy into heat.","skillTag":"physics","topic":"physics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_004","question":"Two objects have the same volume, but object A has twice the mass of object B. What is true about object A?","options":["It has greater density","It has lower density","It has no density","It must be a gas"],"answer":"It has greater density","explanation":"Density equals mass divided by volume. With the same volume and more mass, object A has greater density.","skillTag":"chemistry","topic":"chemistry","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_005","question":"A person sweats during exercise. The evaporation of sweat helps cool the body because evaporation requires what?","options":["Heat energy","Genetic material","Carbon dioxide","Sound waves"],"answer":"Heat energy","explanation":"Evaporation absorbs heat energy from the skin, which helps lower body temperature.","skillTag":"biology","topic":"biology","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_006","question":"A sealed syringe full of air is compressed by pushing the plunger. What happens to the gas pressure inside?","options":["It increases","It decreases to zero","It stays exactly the same","It becomes negative"],"answer":"It increases","explanation":"Compressing gas into a smaller volume causes particles to collide more often with the container walls, increasing pressure.","skillTag":"physics","topic":"physics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_007","question":"Which statement best explains why metals usually conduct electricity well?","options":["Their electrons can move relatively freely","Their nuclei are made only of neutrons","They contain no atoms","They block all charge movement"],"answer":"Their electrons can move relatively freely","explanation":"Metals have mobile electrons that can move through the material, allowing electric current to flow.","skillTag":"physics","topic":"physics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_008","question":"A solution changes blue litmus paper red. The solution is most likely:","options":["Acidic","Basic","Neutral water","Pure salt only"],"answer":"Acidic","explanation":"Acids turn blue litmus paper red. Bases usually turn red litmus paper blue.","skillTag":"chemistry","topic":"chemistry","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_009","question":"Which body system carries oxygen from the lungs to body tissues?","options":["Circulatory system","Digestive system","Skeletal system","Integumentary system"],"answer":"Circulatory system","explanation":"Blood in the circulatory system transports oxygen from the lungs to tissues.","skillTag":"biology","topic":"biology","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_010","question":"A child inherits one allele for brown eyes and one allele for blue eyes. If brown is dominant, what eye color is most likely expressed?","options":["Brown","Blue","Half brown and half blue","No eye color"],"answer":"Brown","explanation":"A dominant allele can be expressed when only one copy is present.","skillTag":"biology","topic":"biology","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_011","question":"When a wave moves from deep water into shallow water and slows down, which property often changes direction?","options":["Refraction occurs","The wave becomes matter","Gravity stops acting","The frequency becomes zero"],"answer":"Refraction occurs","explanation":"Refraction is the bending or change in direction of a wave as its speed changes in a new medium.","skillTag":"physics","topic":"physics","difficulty":"hard","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_012","question":"A chemical reaction gives off heat and makes the container warmer. This reaction is best described as:","options":["Exothermic","Endothermic","Neutralized only","Condensed"],"answer":"Exothermic","explanation":"Exothermic reactions release heat to their surroundings.","skillTag":"chemistry","topic":"chemistry","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_013","question":"Which part of the respiratory system is the main site where oxygen enters the blood?","options":["Alveoli","Trachea","Nasal cavity","Diaphragm"],"answer":"Alveoli","explanation":"Alveoli are tiny sacs surrounded by capillaries where oxygen and carbon dioxide are exchanged.","skillTag":"biology","topic":"biology","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_014","question":"A heavier box and a lighter box are pushed with the same force on the same surface. Which box will generally have less acceleration?","options":["The heavier box","The lighter box","Both must accelerate equally","Neither can accelerate"],"answer":"The heavier box","explanation":"For the same force, a greater mass produces less acceleration according to F = ma.","skillTag":"physics","topic":"physics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_015","question":"If an atom gains electrons, what does it become?","options":["A negatively charged ion","A positively charged ion","A neutron","A molecule with no charge possible"],"answer":"A negatively charged ion","explanation":"Electrons carry negative charge. Gaining electrons makes an atom negatively charged.","skillTag":"chemistry","topic":"chemistry","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_016","question":"Which change is a physical change rather than a chemical change?","options":["Ice melting","Wood burning","Iron rusting","Milk souring"],"answer":"Ice melting","explanation":"Melting changes the state of water but does not create a new substance.","skillTag":"chemistry","topic":"chemistry","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_017","question":"A habitat loses most of its producers. What is the most likely result for the food chain?","options":["Consumers lose a major energy source","Consumers immediately increase forever","Decomposers stop existing","The Sun stops supplying energy"],"answer":"Consumers lose a major energy source","explanation":"Producers form the energy base for many food chains. Losing them reduces available food for consumers.","skillTag":"biology","topic":"biology","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_018","question":"A planet has a stronger gravitational pull than Earth. Compared with Earth, the same object would have:","options":["Greater weight","Less mass","No inertia","Lower density automatically"],"answer":"Greater weight","explanation":"Weight depends on gravitational force. Mass stays the same, but weight increases in stronger gravity.","skillTag":"physics","topic":"physics","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_019","question":"Which instrument would best measure air pressure?","options":["Barometer","Thermometer","Graduated cylinder","Balance scale"],"answer":"Barometer","explanation":"A barometer measures atmospheric pressure.","skillTag":"earth_science","topic":"earth_science","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"},{"id":"asvab_gs_real_020","question":"A mutation in DNA is best described as:","options":["A change in genetic instructions","A type of muscle contraction","A force opposing motion","A change from liquid to gas"],"answer":"A change in genetic instructions","explanation":"A mutation is a change in DNA sequence, which can affect genetic instructions.","skillTag":"biology","topic":"biology","difficulty":"medium","afqtRelevant":false,"realismTier":"asvab_style"}],"Arithmetic Reasoning (AR)":[{"id":"asvab_ar_001","question":"Maria buys 4 notebooks for $1.75 each and one pen for $2.50. How much does she spend in total?","options":["$7.00","$8.50","$9.50","$10.25"],"answer":"$9.50","explanation":"Four notebooks cost 4 x $1.75 = $7.00. Add the $2.50 pen to get $9.50.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_002","question":"A train travels 225 miles in 3 hours. What is its average speed?","options":["65 miles per hour","70 miles per hour","75 miles per hour","80 miles per hour"],"answer":"75 miles per hour","explanation":"Average speed equals distance divided by time. 225 divided by 3 equals 75 miles per hour.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_003","question":"A jacket originally costs $150 and is marked down 20%. What is the sale price?","options":["$100","$110","$120","$130"],"answer":"$120","explanation":"Twenty percent of $150 is $30. Subtract $30 from $150 to get $120.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_004","question":"What is 3/5 of 45?","options":["18","24","27","30"],"answer":"27","explanation":"First divide 45 by 5 to get 9. Then multiply 9 by 3 to get 27.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_005","question":"In a class, the ratio of boys to girls is 2:3. If there are 40 students total, how many boys are there?","options":["12","16","20","24"],"answer":"16","explanation":"The ratio has 5 total parts. Each part equals 40 divided by 5, or 8. Boys make up 2 parts, so 2 x 8 = 16.","skillTag":"ratios_proportions","topic":"ratios_proportions","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_006","question":"Twelve workers can complete a job in 8 days. At the same rate, how many days would 16 workers take?","options":["4 days","5 days","6 days","7 days"],"answer":"6 days","explanation":"The job requires 12 x 8 = 96 worker-days. With 16 workers, 96 divided by 16 equals 6 days.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_007","question":"A rectangular room is 14 feet long and 9 feet wide. What is its area?","options":["46 square feet","92 square feet","126 square feet","252 square feet"],"answer":"126 square feet","explanation":"Area equals length times width. 14 x 9 = 126 square feet.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_008","question":"A rectangle is 10 inches long and 7 inches wide. What is its perimeter?","options":["17 inches","24 inches","34 inches","70 inches"],"answer":"34 inches","explanation":"Perimeter equals 2 times length plus 2 times width. 2(10) + 2(7) = 34 inches.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_009","question":"A car gets 32 miles per gallon. How many gallons are needed to drive 288 miles?","options":["7 gallons","8 gallons","9 gallons","10 gallons"],"answer":"9 gallons","explanation":"Divide distance by miles per gallon. 288 divided by 32 equals 9 gallons.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_010","question":"The scores on four tests are 82, 76, 90, and 88. What is the average score?","options":["82","84","86","88"],"answer":"84","explanation":"Add the scores: 82 + 76 + 90 + 88 = 336. Divide by 4 to get 84.","skillTag":"averages","topic":"averages","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_011","question":"A meal costs $50 before tax. If the tax rate is 6%, what is the total cost?","options":["$51.50","$52.00","$53.00","$56.00"],"answer":"$53.00","explanation":"Six percent of $50 is $3. Add $3 to $50 to get $53.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_012","question":"A tank holds 80 gallons when full. If it is 3/4 full, how many gallons are in the tank?","options":["40 gallons","50 gallons","60 gallons","70 gallons"],"answer":"60 gallons","explanation":"Three-fourths of 80 is 80 divided by 4 times 3, which equals 60 gallons.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_013","question":"A worker earns $18 per hour. How much does the worker earn for 35 hours?","options":["$530","$600","$630","$680"],"answer":"$630","explanation":"Multiply the hourly rate by hours worked. 18 x 35 = 630.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_014","question":"A box contains 60 parts. If 15 parts are defective, what percent are defective?","options":["15%","20%","25%","30%"],"answer":"25%","explanation":"Divide defective parts by total parts: 15 divided by 60 = 0.25, or 25%.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_015","question":"A map scale says 1 inch represents 30 miles. If two towns are 5 inches apart on the map, how far apart are they?","options":["120 miles","135 miles","150 miles","180 miles"],"answer":"150 miles","explanation":"Each inch represents 30 miles. 5 x 30 = 150 miles.","skillTag":"ratios_proportions","topic":"ratios_proportions","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_016","question":"A number increased by 12 equals 37. What is the number?","options":["23","24","25","26"],"answer":"25","explanation":"Subtract 12 from 37. The number is 25.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_017","question":"If 5x = 65, what is x?","options":["11","12","13","14"],"answer":"13","explanation":"Divide both sides by 5. 65 divided by 5 equals 13.","skillTag":"algebra_word_problems","topic":"algebra_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_018","question":"A bicycle costs $240. The price is increased by 15%. What is the new price?","options":["$252","$264","$276","$288"],"answer":"$276","explanation":"Fifteen percent of $240 is $36. Add $36 to $240 to get $276.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_019","question":"A store sells 6 batteries for $9.00. What is the cost per battery?","options":["$1.25","$1.50","$1.75","$2.00"],"answer":"$1.50","explanation":"Divide the total cost by the number of batteries. $9.00 divided by 6 equals $1.50.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_020","question":"A runner completes 5 miles in 40 minutes. What is the runner's pace per mile?","options":["6 minutes per mile","7 minutes per mile","8 minutes per mile","9 minutes per mile"],"answer":"8 minutes per mile","explanation":"Divide total time by distance. 40 minutes divided by 5 miles equals 8 minutes per mile.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_021","question":"A package weighs 3 pounds 4 ounces. How many ounces does it weigh?","options":["36 ounces","44 ounces","48 ounces","52 ounces"],"answer":"52 ounces","explanation":"Three pounds is 3 x 16 = 48 ounces. Add 4 ounces to get 52 ounces.","skillTag":"unit_conversion","topic":"unit_conversion","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_022","question":"A rope is 18 feet long. How many inches long is the rope?","options":["180 inches","196 inches","216 inches","240 inches"],"answer":"216 inches","explanation":"There are 12 inches in a foot. 18 x 12 = 216 inches.","skillTag":"unit_conversion","topic":"unit_conversion","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_023","question":"A container holds 5 quarts. How many pints does it hold?","options":["5 pints","8 pints","10 pints","12 pints"],"answer":"10 pints","explanation":"There are 2 pints in 1 quart. 5 x 2 = 10 pints.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_024","question":"A square has a side length of 13 feet. What is its perimeter?","options":["26 feet","39 feet","52 feet","169 feet"],"answer":"52 feet","explanation":"A square has four equal sides. 4 x 13 = 52 feet.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_025","question":"A square has a side length of 12 inches. What is its area?","options":["24 square inches","48 square inches","120 square inches","144 square inches"],"answer":"144 square inches","explanation":"Area of a square equals side times side. 12 x 12 = 144 square inches.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_026","question":"A triangle has a base of 16 inches and a height of 9 inches. What is its area?","options":["36 square inches","72 square inches","144 square inches","288 square inches"],"answer":"72 square inches","explanation":"Area of a triangle equals 1/2 x base x height. 1/2 x 16 x 9 = 72 square inches.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_027","question":"A rectangular box is 8 inches long, 5 inches wide, and 4 inches high. What is its volume?","options":["80 cubic inches","120 cubic inches","160 cubic inches","200 cubic inches"],"answer":"160 cubic inches","explanation":"Volume equals length x width x height. 8 x 5 x 4 = 160 cubic inches.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_028","question":"A salesperson earns 8% commission on $3,000 in sales. How much commission is earned?","options":["$180","$220","$240","$300"],"answer":"$240","explanation":"Eight percent of $3,000 is 0.08 x 3,000 = $240.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_029","question":"A bank account earns simple interest at 4% per year on $2,500. How much interest is earned in one year?","options":["$75","$100","$125","$150"],"answer":"$100","explanation":"Simple interest equals principal x rate. $2,500 x 0.04 = $100.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_030","question":"A group of 7 people splits a $91 bill equally. How much does each person pay?","options":["$11","$12","$13","$14"],"answer":"$13","explanation":"Divide the bill by the number of people. 91 divided by 7 equals 13.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_031","question":"A recipe calls for 2 cups of rice to serve 6 people. How many cups are needed to serve 15 people?","options":["4 cups","5 cups","6 cups","8 cups"],"answer":"5 cups","explanation":"Fifteen people is 2.5 times 6 people. Multiply 2 cups by 2.5 to get 5 cups.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_032","question":"A machine produces 360 parts in 9 hours. How many parts does it produce per hour?","options":["30","35","40","45"],"answer":"40","explanation":"Divide total parts by hours. 360 divided by 9 equals 40 parts per hour.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_033","question":"A printer prints 18 pages per minute. How many pages can it print in 7 minutes?","options":["108","116","126","144"],"answer":"126","explanation":"Multiply pages per minute by minutes. 18 x 7 = 126 pages.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_034","question":"A tank is filled at 14 gallons per minute. How long will it take to fill 98 gallons?","options":["6 minutes","7 minutes","8 minutes","9 minutes"],"answer":"7 minutes","explanation":"Divide total gallons by the fill rate. 98 divided by 14 equals 7 minutes.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_035","question":"A store had 120 shirts. It sold 35% of them. How many shirts were sold?","options":["36","40","42","48"],"answer":"42","explanation":"Thirty-five percent of 120 is 0.35 x 120 = 42.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_036","question":"A worker saves $75 each week. How much will the worker save in 12 weeks?","options":["$750","$825","$900","$975"],"answer":"$900","explanation":"Multiply weekly savings by the number of weeks. 75 x 12 = 900.","skillTag":"work_rate","topic":"work_rate","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_037","question":"A number is multiplied by 4, and then 6 is added. The result is 38. What is the number?","options":["6","7","8","9"],"answer":"8","explanation":"Subtract 6 from 38 to get 32. Divide 32 by 4 to get 8.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_038","question":"A warehouse has 9 shelves with 24 boxes on each shelf. If 36 boxes are removed, how many boxes remain?","options":["144","168","180","216"],"answer":"180","explanation":"There are 9 x 24 = 216 boxes. Subtract 36 to get 180 boxes remaining.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_039","question":"A man drives 60 miles north and then 25 miles south. How far is he from his starting point?","options":["25 miles north","35 miles north","60 miles north","85 miles north"],"answer":"35 miles north","explanation":"The southward distance cancels part of the northward distance. 60 minus 25 equals 35 miles north.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_040","question":"A store buys an item for $48 and sells it for $60. What is the profit?","options":["$8","$10","$12","$15"],"answer":"$12","explanation":"Profit equals selling price minus cost. $60 minus $48 equals $12.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_041","question":"A chair sells for $80 after a 25% markup from cost. What was the original cost?","options":["$60","$64","$70","$75"],"answer":"$64","explanation":"A 25% markup means the selling price is 125% of cost. $80 divided by 1.25 equals $64.","skillTag":"averages","topic":"averages","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_042","question":"A customer pays $36 for 3 movie tickets. What is the cost of 5 tickets at the same price per ticket?","options":["$48","$54","$60","$72"],"answer":"$60","explanation":"Each ticket costs $36 divided by 3, or $12. Five tickets cost 5 x $12 = $60.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_043","question":"A truck uses 12 gallons of fuel to travel 300 miles. How many miles per gallon does it get?","options":["20 miles per gallon","22 miles per gallon","25 miles per gallon","30 miles per gallon"],"answer":"25 miles per gallon","explanation":"Divide miles by gallons. 300 divided by 12 equals 25 miles per gallon.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_044","question":"The average of five numbers is 18. What is the total of the five numbers?","options":["72","80","90","100"],"answer":"90","explanation":"Total equals average times number of values. 18 x 5 = 90.","skillTag":"averages","topic":"averages","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_045","question":"Four numbers total 86. Three of the numbers are 18, 22, and 31. What is the fourth number?","options":["13","15","17","19"],"answer":"15","explanation":"Add the known numbers: 18 + 22 + 31 = 71. Subtract 71 from 86 to get 15.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_046","question":"A parking lot charges $5 for the first hour and $3 for each additional hour. How much does it cost to park for 6 hours?","options":["$15","$18","$20","$23"],"answer":"$20","explanation":"The first hour costs $5. The next 5 hours cost 5 x $3 = $15. Total cost is $20.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_047","question":"A bag has 10 red marbles, 15 blue marbles, and 5 green marbles. What fraction of the marbles are blue?","options":["1/3","1/2","2/3","3/4"],"answer":"1/2","explanation":"There are 30 marbles total. Blue marbles are 15 out of 30, which simplifies to 1/2.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_048","question":"A class has 28 students. If 7 are absent, what percent of the class is absent?","options":["15%","20%","25%","30%"],"answer":"25%","explanation":"Seven out of 28 equals 7 divided by 28, or 0.25. That is 25%.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_049","question":"A number decreases from 200 to 150. What is the percent decrease?","options":["20%","25%","30%","35%"],"answer":"25%","explanation":"The decrease is 50. Divide 50 by the original 200 to get 0.25, or 25%.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_050","question":"A number increases from 80 to 100. What is the percent increase?","options":["20%","25%","30%","40%"],"answer":"25%","explanation":"The increase is 20. Divide 20 by the original 80 to get 0.25, or 25%.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_051","question":"A worker starts at 8:15 a.m. and finishes at 4:45 p.m. How long did the worker work?","options":["7 hours 30 minutes","8 hours","8 hours 30 minutes","9 hours"],"answer":"8 hours 30 minutes","explanation":"From 8:15 a.m. to 4:15 p.m. is 8 hours. From 4:15 to 4:45 is 30 minutes.","skillTag":"work_rate","topic":"work_rate","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_052","question":"A pipe leaks 3 gallons every 20 minutes. How many gallons leak in 2 hours?","options":["12 gallons","15 gallons","18 gallons","24 gallons"],"answer":"18 gallons","explanation":"Two hours is 120 minutes. There are six 20-minute periods in 120 minutes. 6 x 3 = 18 gallons.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_053","question":"A plane flies 720 miles in 3 hours. At the same speed, how far will it fly in 5 hours?","options":["960 miles","1,080 miles","1,200 miles","1,440 miles"],"answer":"1,200 miles","explanation":"The plane flies 720 divided by 3 = 240 miles per hour. In 5 hours, it flies 240 x 5 = 1,200 miles.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_054","question":"A family uses 1,200 kilowatt-hours of electricity in 40 days. What is the average use per day?","options":["20 kilowatt-hours","25 kilowatt-hours","30 kilowatt-hours","35 kilowatt-hours"],"answer":"30 kilowatt-hours","explanation":"Divide total electricity use by days. 1,200 divided by 40 equals 30 kilowatt-hours per day.","skillTag":"averages","topic":"averages","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_055","question":"A store sells apples at 4 pounds for $10. How much would 10 pounds cost at the same rate?","options":["$20","$22.50","$25","$30"],"answer":"$25","explanation":"The cost per pound is $10 divided by 4, or $2.50. Ten pounds cost 10 x $2.50 = $25.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_056","question":"A ladder is 24 feet long. If 6 feet are cut off, what percent of the ladder remains?","options":["50%","60%","70%","75%"],"answer":"75%","explanation":"After cutting off 6 feet, 18 feet remain. 18 divided by 24 equals 0.75, or 75%.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_057","question":"A jar contains 20 nickels and 12 dimes. What is the total value of the coins?","options":["$1.80","$2.00","$2.20","$2.40"],"answer":"$2.20","explanation":"Twenty nickels are worth $1.00. Twelve dimes are worth $1.20. The total is $2.20.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_058","question":"Two numbers are in the ratio 5:8. If the smaller number is 35, what is the larger number?","options":["48","52","56","64"],"answer":"56","explanation":"If 5 parts equal 35, then 1 part equals 7. The larger number is 8 parts, so 8 x 7 = 56.","skillTag":"ratios_proportions","topic":"ratios_proportions","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_059","question":"A recipe calls for 3/4 cup of oil. How much oil is needed to make double the recipe?","options":["1 cup","1 1/4 cups","1 1/2 cups","2 cups"],"answer":"1 1/2 cups","explanation":"Double 3/4 cup is 6/4 cups, which equals 1 1/2 cups.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_060","question":"A car rental costs $40 per day plus $0.25 per mile. What is the cost for one day and 80 miles?","options":["$50","$55","$60","$65"],"answer":"$60","explanation":"Mileage cost is 80 x $0.25 = $20. Add the $40 daily cost to get $60.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_061","question":"A worker earns $20 per hour for regular time and $30 per hour for overtime. If the worker works 40 regular hours and 6 overtime hours, what is the total pay?","options":["$860","$900","$940","$980"],"answer":"$980","explanation":"Regular pay is 40 x $20 = $800. Overtime pay is 6 x $30 = $180. Total pay is $980.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_062","question":"A truck carries 4,800 pounds of cargo. If each crate weighs 160 pounds, how many crates are on the truck?","options":["24","28","30","36"],"answer":"30","explanation":"Divide total cargo weight by the weight per crate. 4,800 divided by 160 equals 30 crates.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_063","question":"A circular track is 500 meters long. How many meters does a runner cover in 8 laps?","options":["3,500 meters","4,000 meters","4,500 meters","5,000 meters"],"answer":"4,000 meters","explanation":"Multiply the length of one lap by the number of laps. 500 x 8 = 4,000 meters.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_064","question":"If 2x + 9 = 31, what is x?","options":["9","10","11","12"],"answer":"11","explanation":"Subtract 9 from both sides to get 2x = 22. Divide by 2 to get x = 11.","skillTag":"algebra_word_problems","topic":"algebra_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_065","question":"A person has $240 and spends 3/8 of it. How much money is spent?","options":["$60","$75","$90","$120"],"answer":"$90","explanation":"One-eighth of 240 is 30. Three-eighths is 3 x 30 = 90.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_066","question":"A person has $240 and spends 3/8 of it. How much money remains?","options":["$90","$120","$150","$180"],"answer":"$150","explanation":"Three-eighths of $240 is $90 spent. $240 minus $90 equals $150 remaining.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_067","question":"A contractor needs 15 boards, each 6 feet long. How many total feet of board are needed?","options":["75 feet","80 feet","90 feet","100 feet"],"answer":"90 feet","explanation":"Multiply the number of boards by the length of each board. 15 x 6 = 90 feet.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_068","question":"A 60-inch board is cut into pieces that are each 12 inches long. How many pieces are made?","options":["4","5","6","8"],"answer":"5","explanation":"Divide total length by piece length. 60 divided by 12 equals 5 pieces.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_069","question":"A class collects 360 cans for recycling. If 45 students each collect the same number of cans, how many cans does each student collect?","options":["6","7","8","9"],"answer":"8","explanation":"Divide the total cans by the number of students. 360 divided by 45 equals 8.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_070","question":"A store reduces the price of a $90 item by 10%, then adds 5% sales tax to the sale price. What is the final price?","options":["$81.00","$84.15","$85.05","$94.50"],"answer":"$85.05","explanation":"Ten percent off $90 gives $81. Sales tax is 5% of $81, or $4.05. Final price is $85.05.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_071","question":"A store sells 2 shirts for $18. At the same rate, how much do 7 shirts cost?","options":["$54","$60","$63","$72"],"answer":"$63","explanation":"Each shirt costs $18 divided by 2, or $9. Seven shirts cost 7 x $9 = $63.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_072","question":"A water tank is 2/5 full. If it contains 50 gallons, how many gallons does it hold when full?","options":["100 gallons","115 gallons","125 gallons","150 gallons"],"answer":"125 gallons","explanation":"If 2/5 equals 50 gallons, then 1/5 equals 25 gallons. Full capacity is 5 x 25 = 125 gallons.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_073","question":"A motor turns 1,800 revolutions in 3 minutes. How many revolutions per minute does it turn?","options":["300","450","600","900"],"answer":"600","explanation":"Divide total revolutions by minutes. 1,800 divided by 3 equals 600 revolutions per minute.","skillTag":"multi_step_arithmetic","topic":"multi_step_arithmetic","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_074","question":"A ship travels 96 miles in 4 hours. How long will it take to travel 168 miles at the same speed?","options":["5 hours","6 hours","7 hours","8 hours"],"answer":"7 hours","explanation":"The ship travels 96 divided by 4 = 24 miles per hour. 168 divided by 24 equals 7 hours.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_075","question":"A wall is 20 feet wide and 9 feet high. A gallon of paint covers 60 square feet. How many gallons are needed for one coat?","options":["2 gallons","3 gallons","4 gallons","5 gallons"],"answer":"3 gallons","explanation":"The wall area is 20 x 9 = 180 square feet. 180 divided by 60 equals 3 gallons.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_076","question":"A floor is 12 feet by 15 feet. Tiles cover 3 square feet each. How many tiles are needed?","options":["45","50","60","75"],"answer":"60","explanation":"The floor area is 12 x 15 = 180 square feet. 180 divided by 3 equals 60 tiles.","skillTag":"geometry_measurement","topic":"geometry_measurement","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_077","question":"A person walks 3.5 miles each day. How many miles does the person walk in 8 days?","options":["24 miles","26 miles","28 miles","30 miles"],"answer":"28 miles","explanation":"Multiply 3.5 miles by 8 days. The total is 28 miles.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_078","question":"A 240-page book is read at a rate of 30 pages per hour. How many hours will it take to read the book?","options":["6 hours","7 hours","8 hours","9 hours"],"answer":"8 hours","explanation":"Divide total pages by pages per hour. 240 divided by 30 equals 8 hours.","skillTag":"rates_speed_distance","topic":"rates_speed_distance","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_079","question":"A computer costs $900. A buyer pays 30% down. How much is the down payment?","options":["$180","$240","$270","$300"],"answer":"$270","explanation":"Thirty percent of $900 is 0.30 x 900 = $270.","skillTag":"percent_change","topic":"percent_change","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_080","question":"A computer costs $900. A buyer pays 30% down. How much remains to be paid?","options":["$540","$600","$630","$700"],"answer":"$630","explanation":"The down payment is $270. Subtract $270 from $900 to get $630 remaining.","skillTag":"money_word_problems","topic":"money_word_problems","difficulty":"foundation","afqtRelevant":true,"realismTier":"foundation"},{"id":"asvab_ar_081","
